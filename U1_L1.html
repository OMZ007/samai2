/* ==========================================================================
   SAMAI 2 — shared stylesheet
   Every lesson links this file, then adds only its own lesson-specific rules.

   Four parts:
     1. Design tokens — the closed scales the whole system is built from.
        Nothing downstream may invent a colour, a radius, a size or a shadow:
        if a value is not here, it does not exist. Component geometry a token
        cannot express — the diameter of a wheel, the box of a thumbnail —
        stays in the lesson that owns the component.
     2. Design primitives — the shapes those tokens make. The card, the tile,
        the badge and the grid every lesson is assembled from, each with one
        rule behind it and no second way to draw it.
     3. The mock application and its tour — the window every unit that shows
        an application shows, and the walk around it.
     4. Shared chrome and content components — brand bar, lesson nav, hero,
        section shell, callouts, conclusion, references, the three sections
        every unit overview is made of, and the understanding check.
   ========================================================================== */


/* ==========================================================================
   1 · DESIGN TOKENS
   ========================================================================== */

/* The five official SAMAI 2 brand colours. Nothing else counts as brand. */
:root{--primary:#2F3068;--teal:#00AD8B;--green:#7FC242;--grey:#7B868C;--black:#101820}

/* Brand ramp. Tints and shades of the five, for gradients and hover states. */
:root{--primary-2:#3E4089;--teal-2:#00806A;--green-2:#5E9430;--green-3:#A8DC7C}

/* Text and surfaces. */
:root{--ink:#101820;--muted:#7B868C;--page:#F4F7F9;--page-top:#FBFDFF;--surface:#FFFFFF;--surface-soft:#F7FAFB;--surface-veil:#FFFFFFFA}

/* Text and fills that sit on a dark or brand-coloured background. */
:root{--on-dark:#FFFFFF;--on-dark-soft:#FFFFFFF2;--on-dark-muted:#FFFFFFA6;--on-dark-accent:#A8DC7C}

/* Translucent tints. The only legal way to lay one brand colour over another. */
:root{--border:#2F30681F;--border-strong:#00AD8B45;--tint-primary:#2F30680F;--tint-primary-2:#2F30681A;--tint-teal:#00AD8B14;--tint-teal-2:#00AD8B1F;--tint-green:#7FC2421F;--tint-green-2:#7FC2422B;--veil:#FFFFFF1F;--veil-strong:#FFFFFF33;--veil-line:#FFFFFF29;--veil-sheen:#FFFFFF59;--tint-danger:#C0392B0F;--border-danger:#C0392B66;--tint-warning:#B789001F;--border-warning:#B7890059;--border-green:#7FC2428C;--scrim:#10182030}

/* Glows. Soft brand-coloured light, only ever behind or under an element. */
:root{--glow-teal:#00AD8B33;--glow-green:#7FC2421F;--glow-hero:#7FC24247}

/* State colours. Outside the brand five, reserved for correctness feedback. */
:root{--danger:#C0392B;--warning:#B78900;--success:#00806A}

/* Category colours. Used by the classification activities in U3 and U6_L2. */
:root{--cat-r:#00AD8B;--cat-i:#7FC242;--cat-c:#E0A128;--cat-e:#8E5FB0;--tint-cat-c:#E0A1281F;--tint-cat-e:#8E5FB01F;--border-cat-e:#8E5FB066}

/* Spacing scale. */
:root{--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-7:28px;--space-8:32px;--space-10:40px}

/* Radius scale. */
:root{--radius-2xs:9px;--radius-xs:11px;--radius-sm:14px;--radius-md:18px;--radius-lg:22px;--radius-pill:999px}

/* Shadow scale. */
:root{--shadow:0 14px 30px #2F306812,0 2px 8px #10182008;--shadow-hover:0 22px 46px #2F306824;--shadow-glow-card:0 28px 58px #2F306829,0 0 0 1px #00AD8B33,0 0 30px #00AD8B2B;--shadow-card:0 4px 12px #2F30680F;--shadow-bar:0 8px 24px #1018204D;--shadow-nav:0 8px 22px #2F306817;--shadow-active:0 6px 16px #2F30682E;--shadow-hero:0 16px 36px #2F306833;--shadow-hub:0 14px 32px #2F306847;--shadow-glow:0 -2px 12px #00AD8B47;--shadow-ring:0 0 0 4px #7FC24238;--shadow-text:0 2px 10px #10182026;--shadow-logo:drop-shadow(0 2px 6px #10182073);--shadow-inset:inset 0 1px 0 #FFFFFF;--shadow-raised:0 10px 24px #2F306838}

/* Type scale. */
:root{--text-3xs:10.5px;--text-2xs:11.5px;--text-xs:12.5px;--text-sm:13px;--text-md:14px;--text-base:14.5px;--text-lg:15.5px;--text-xl:17px;--text-2xl:20px;--text-3xl:22px;--text-display:26px;--text-h2:clamp(21px,2.3vw,27px);--text-h1:clamp(27px,3.3vw,40px);--text-lead:clamp(14.5px,1.25vw,16.5px);--text-nav:clamp(11.5px,1.05vw,13.5px)}

/* Line heights and weights. */
:root{--leading-tight:1.35;--leading-snug:1.5;--leading-relaxed:1.75;--leading-normal:1.85;--leading-loose:1.95;--weight-normal:500;--weight-medium:700;--weight-bold:800;--weight-black:900}

/* Layout. */
:root{--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;--width:1180px;--gutter:14px;--scroll-offset:88px}

/* Logo sizing and the brand clear-space rule.
   Once the logo renders taller than 8mm (~30.2px at 96dpi) it must keep a
   clear space of 36% of its own height on every side. --logo-clear is that
   distance; the brand bar feeds it into its own padding and gap as a
   minimum, so the rule is honoured without inflating the bar. Below 8mm the
   rule does not apply, and the ordinary padding already exceeds it. */
:root{--logo-height:36px;--logo-clear:calc(var(--logo-height) * .36)}


/* ==========================================================================
   2 · DOCUMENT DEFAULTS
   ========================================================================== */

/* Rules that paint a gradient carry background-origin:border-box. The
   `background` shorthand resets that property to padding-box, so on a
   bordered element the gradient is sized to the padding box yet painted
   over the border box, and the far end wraps onto the near edge as a thin
   fringe. Setting it after the shorthand is the only thing that sticks —
   a universal rule earlier in the sheet does not survive. */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{min-height:100%;margin:0;overflow-x:clip}
body{font-family:var(--font);color:var(--ink);line-height:var(--leading-normal);background:radial-gradient(1100px 560px at 92% -12%,var(--tint-teal),transparent 60%),radial-gradient(900px 500px at -8% 34%,var(--tint-green),transparent 55%),linear-gradient(180deg,var(--page-top) 0%,var(--page) 100%);background-origin:border-box}
button,input,textarea,select{font:inherit}
button,a,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:var(--tint-primary)}
button:not([hidden]),[role="button"]{min-height:44px}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--border-strong);outline-offset:3px}
[hidden]{display:none!important}


/* ==========================================================================
   3 · DESIGN PRIMITIVES
   The closed set of shapes a lesson builds from. Every card, panel, well and
   tile in the twenty-two lessons is one of these, so a block in unit 1 and the
   same block in unit 6 cannot drift apart: there is only one rule behind them.

   Colour is not written into a shape. A block declares a tone and the shapes
   inside it read --tone and its ramp, so one word in a lesson's content
   recolours a card, its rule, its tile and its badge together.
   ========================================================================== */

:root{--tone:var(--primary);--tone-2:var(--teal);--tone-ink:var(--primary);--tone-tint:var(--tint-primary)}
.tone-primary{--tone:var(--primary);--tone-2:var(--primary-2);--tone-ink:var(--primary);--tone-tint:var(--tint-primary)}
.tone-teal{--tone:var(--teal);--tone-2:var(--teal-2);--tone-ink:var(--teal-2);--tone-tint:var(--tint-teal)}
.tone-green{--tone:var(--green);--tone-2:var(--green-2);--tone-ink:var(--green-2);--tone-tint:var(--tint-green)}
.tone-warning{--tone:var(--warning);--tone-2:var(--cat-c);--tone-ink:var(--warning);--tone-tint:var(--tint-warning)}
.tone-danger{--tone:var(--danger);--tone-2:var(--danger);--tone-ink:var(--danger);--tone-tint:var(--tint-danger)}

/* ---- The one bordered surface ------------------------------------------ */

.card{position:relative;min-width:0;padding:var(--space-5);overflow:hidden;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow)}
/* The corner and the shadow follow the room inside: a card the size of a
   chip should not carry the radius and the lift of one the size of a panel. */
.card-bare{padding:0}
.card-tight{padding:var(--space-3);border-radius:var(--radius-xs);box-shadow:var(--shadow-card)}
.card-snug{padding:var(--space-4);border-radius:var(--radius-sm);box-shadow:var(--shadow-card)}
.card-wide{padding:var(--space-6);border-radius:var(--radius-lg)}
.card-soft{background:linear-gradient(180deg,var(--surface),var(--surface-soft));background-origin:border-box}
.card-sunken{background:var(--surface-soft);box-shadow:none}
.card-dark{border-color:transparent;background:linear-gradient(140deg,var(--black),var(--primary));color:var(--on-dark);box-shadow:var(--shadow-hero);background-origin:border-box}
.card.is-center{text-align:center}

/* The brand laid across the top edge, for a card that opens a set. */
.card.has-rule::before{content:"";position:absolute;inset-block-start:0;inset-inline:0;height:4px;background:linear-gradient(90deg,var(--tone),var(--tone-2),var(--green));background-origin:border-box}

/* A card that is a choice rises to say so. One distance, so a page of cards
   moves as one page rather than each card by its own amount. */
.card.is-lift{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.card.is-lift:hover{border-color:var(--border-strong);box-shadow:var(--shadow-hover);transform:translateY(-4px)}

/* ---- The marks a card carries ------------------------------------------ */

.tile{flex:none;display:grid;place-items:center;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--tone),var(--tone-2));color:var(--on-dark);background-origin:border-box}
.tile-xs{width:28px;height:28px;border-radius:var(--radius-2xs);font-size:var(--text-2xs)}
.tile-sm{width:36px;height:36px;border-radius:var(--radius-2xs);font-size:var(--text-sm)}
.tile-md{width:46px;height:46px;font-size:var(--text-xl)}
.tile-lg{width:52px;height:52px;font-size:var(--text-2xl)}
.tile-xl{width:58px;height:58px;border-radius:var(--radius-md);font-size:var(--text-3xl)}

.badge{padding:5px 13px;display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-pill);background:linear-gradient(135deg,var(--tone),var(--tone-2));color:var(--on-dark);font-size:var(--text-xs);font-weight:var(--weight-black);letter-spacing:.02em;white-space:nowrap;background-origin:border-box}
.badge>i{font-size:10px}
.badge.is-plain{border:1px solid var(--border);background:var(--tone-tint);color:var(--tone-ink)}

.card-head{margin-block-end:var(--space-3);display:flex;align-items:center;gap:var(--space-3)}
.card-head.is-center{flex-direction:column;text-align:center}
.card-head-body{min-width:0;flex:1}
.card-eyebrow{margin-block-end:2px;display:block;color:var(--teal-2);font-size:var(--text-3xs);font-weight:var(--weight-black)}
.card-title{margin:0;min-width:0;color:var(--primary);font-size:var(--text-lg);font-weight:var(--weight-black);line-height:var(--leading-tight)}
.card-trail{margin-inline-start:auto;flex:none}
.card-head.is-center .card-trail{margin-inline-start:0}

/* A link that leaves the lesson. Written as [label](address) in the copy. */
.away{color:var(--teal);font-weight:var(--weight-black);text-decoration:none}
.away:hover{text-decoration:underline}
.away>i{margin-inline-start:var(--space-1);font-size:10px}

/* ---- Rows of them ------------------------------------------------------
   auto-fit with a named floor, so a set of three and a set of four each fill
   their row without a per-lesson column count, and the floors themselves come
   off one five-step scale rather than being guessed a pixel at a time. */

.grid{display:grid;gap:14px}
.gap-tight{gap:var(--space-2)}
.gap-loose{gap:var(--space-5)}
.grid-xs{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.grid-sm{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid-md{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-lg{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid-xl{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}


/* ==========================================================================
   4 · THE MOCK APPLICATION AND ITS TOUR
   One window, shown by every unit that shows one, so a learner taught its
   parts in unit 1 meets the same parts in unit 6 rather than a second
   mock-up that happens to look similar.

   Nothing in it is operable — the lesson driving it says what it shows — so
   it carries no controls, and the sizes are deliberately under the body
   scale: it is a window seen at a distance, not a second interface inside
   the page.
   ========================================================================== */

.win{overflow:hidden;pointer-events:none;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);box-shadow:var(--shadow-card)}
.win-top{padding:9px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:var(--space-3);border-block-end:1px solid var(--border);background:var(--surface-soft)}
.win-brand{min-width:0;display:flex;align-items:center;gap:10px}
.win-dots{flex:none;display:flex;gap:5px;direction:ltr}
.win-dots i{width:9px;height:9px;border-radius:50%}
.win-dots i:nth-child(1){background:var(--danger)}
.win-dots i:nth-child(2){background:var(--warning)}
.win-dots i:nth-child(3){background:var(--success)}
.win-name{overflow:hidden;color:var(--primary);font-size:var(--text-xs);font-weight:var(--weight-black);text-overflow:ellipsis;white-space:nowrap}
.win-agents{padding:3px;display:inline-flex;gap:2px;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--tint-primary)}
.win-agent{min-height:32px;padding:6px 18px;display:grid;place-items:center;border-radius:var(--radius-pill);color:var(--muted);font-size:var(--text-2xs);font-weight:var(--weight-black);white-space:nowrap}
.win-agent.is-on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-card)}

/* A lesson that needs a taller window or a wider sidebar raises the two
   below rather than restyling the window; everything else about it is fixed. */
.win-body{min-height:var(--win-height,266px);display:grid;grid-template-columns:var(--win-side,154px) minmax(0,1fr)}
.win-body.is-bare{min-height:0;grid-template-columns:minmax(0,1fr)}
.win-side{padding:var(--space-3) 10px;display:flex;flex-direction:column;gap:var(--space-2);border-inline-end:1px solid var(--border);background:var(--surface-soft)}
.win-new{min-height:32px;padding:var(--space-2) 10px;display:flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--radius-2xs);background:linear-gradient(135deg,var(--primary),var(--teal));color:var(--on-dark);font-size:var(--text-3xs);font-weight:var(--weight-black);background-origin:border-box}
.win-new>i{font-size:9px}
.win-thread{height:10px;flex:none;border-radius:5px;background:var(--tint-primary-2)}
.win-thread.is-current{background:var(--border-strong)}
/* Named destinations, for the units teaching what the parts are called. */
.win-item{padding:7px 9px;display:flex;align-items:center;gap:8px;border-radius:var(--radius-2xs);color:var(--ink);font-size:var(--text-3xs);font-weight:var(--weight-bold);text-align:start}
.win-item>i{width:14px;flex:none;color:var(--muted);text-align:center}
.win-item.is-on{background:var(--tint-primary-2);color:var(--primary);font-weight:var(--weight-black)}
.win-item.is-on>i{color:var(--primary)}
.win-group{padding:11px 9px 3px;color:var(--muted);font-size:var(--text-3xs);font-weight:var(--weight-black)}
.win-fill{flex:1}
.win-account{padding:7px var(--space-2);display:flex;align-items:center;gap:var(--space-2);border-block-start:1px solid var(--border);color:var(--muted)}
.win-avatar{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--teal));color:var(--on-dark);font-size:10px;background-origin:border-box}
.win-account-text{min-width:0;display:grid}
.win-account-text b{overflow:hidden;color:var(--primary);font-size:var(--text-3xs);font-weight:var(--weight-black);text-overflow:ellipsis;white-space:nowrap}
.win-account-text small{overflow:hidden;font-size:var(--text-3xs);font-weight:var(--weight-medium);text-overflow:ellipsis;white-space:nowrap}
.win-account>i:last-child{margin-inline-start:auto;font-size:10px}
.win-account.is-on{background:var(--tint-primary-2)}
.win-account.is-on .win-account-text b{color:var(--primary)}
.win-main{min-width:0;display:grid;align-content:stretch}
.win-screen-top{padding:9px 13px;display:flex;align-items:center;justify-content:space-between;border-block-end:1px solid var(--border);color:var(--primary);font-size:var(--text-3xs);font-weight:var(--weight-black)}
.win-screen-top>i{color:var(--muted)}
.win-screen{min-width:0;min-height:0;padding:13px;display:grid;align-content:stretch;overflow:hidden}
/* A screen whose own surface is the point paints to the frame instead. */
.win-screen.is-bleed{padding:0}

/* ---- The conversation inside it ---------------------------------------- */

.win-chat{display:grid;align-content:space-between;gap:14px}
.win-messages{display:grid;align-content:start;gap:10px}
.win-empty{margin:22px 0;color:var(--muted);font-size:var(--text-2xs);font-weight:var(--weight-bold);text-align:center}
.win-msg{margin:0;padding:10px 13px;border-radius:var(--radius-sm);font-size:var(--text-2xs);font-weight:var(--weight-bold);line-height:var(--leading-relaxed)}
.win-msg p{margin:0}
.win-msg.is-user{max-width:82%;justify-self:start;border:1px solid var(--border-strong);background:var(--tint-teal-2);color:var(--teal-2)}
.win-msg.is-assistant{width:86%;justify-self:end;border:1px solid var(--border);background:var(--surface-soft)}
.win-msg.is-pending{padding:13px;display:grid;gap:7px}
.win-msg.is-pending i{height:7px;border-radius:4px;background:var(--tint-primary-2)}
.win-msg.is-pending i:last-child{width:58%}
.win-msg-files{margin-block-end:var(--space-2);display:flex;flex-wrap:wrap;gap:6px}
.win-msg .win-file{border-color:var(--border-strong);background:var(--surface-veil)}

/* ---- The row the learner writes in -------------------------------------- */

.win-composer{padding:var(--space-2) 10px;display:grid;gap:var(--space-2);border:1px solid var(--border);border-radius:15px;background:var(--surface);box-shadow:var(--shadow-card)}
.win-files{display:flex;flex-wrap:wrap;gap:6px}
.win-file{padding:5px 9px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:9px;background:var(--surface-soft);color:var(--primary);font-size:var(--text-3xs);font-weight:var(--weight-bold)}
.win-file>i{color:var(--primary-2);font-size:11px}
.win-row{display:flex;align-items:center;gap:var(--space-2)}
.win-field{min-width:0;flex:1 1 120px;overflow:hidden;display:flex;align-items:center;gap:1px;font-size:var(--text-2xs);font-weight:var(--weight-medium);white-space:nowrap}
.win-placeholder{overflow:hidden;color:var(--muted);text-overflow:ellipsis}
.win-typed{overflow:hidden;color:var(--ink);font-weight:var(--weight-bold);text-overflow:ellipsis}
.win-caret{width:1.5px;height:14px;flex:none;display:none;background:var(--primary)}
.win-field.is-typing .win-caret{display:block;animation:win-caret 1.06s steps(2,jump-none) infinite}
@keyframes win-caret{from{opacity:1}to{opacity:0}}
.win-tools{position:relative;flex:none}
.win-plus{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;background:var(--surface-soft);color:var(--primary);font-size:var(--text-2xs);transition:background .2s ease,border-color .2s ease,transform .2s ease}
.win-tools.is-open .win-plus{border-color:var(--teal);background:var(--tint-teal-2);transform:rotate(45deg)}
.win-pickers{flex:none;display:flex;gap:6px}
.win-picker{position:relative}
.win-picker-button{min-height:34px;padding:6px var(--space-3);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--surface-soft);color:var(--muted);font-size:var(--text-3xs);font-weight:var(--weight-bold);white-space:nowrap;transition:background .2s ease,border-color .2s ease}
.win-picker-button>i{color:var(--muted);font-size:9px}
.win-picker-value{overflow:hidden;color:var(--primary);font-weight:var(--weight-black);text-overflow:ellipsis}
.win-picker.is-open .win-picker-button{border-color:var(--teal);background:var(--tint-teal)}
.win-menu{position:absolute;inset-block-end:calc(100% + 7px);inset-inline-start:0;z-index:3;min-width:172px;padding:6px;display:none;border:1px solid var(--border);border-radius:13px;background:var(--surface);box-shadow:var(--shadow-hover)}
.win-picker .win-menu{min-width:148px;inset-inline-start:auto;inset-inline-end:0}
.is-open>.win-menu{display:grid;gap:2px}
.win-option{padding:var(--space-2) 10px;display:flex;align-items:center;gap:9px;border-radius:9px;color:var(--ink);font-size:var(--text-2xs);font-weight:var(--weight-bold);white-space:nowrap}
.win-option>i{width:13px;color:var(--teal-2);font-size:11px;text-align:center}
.win-option[data-value]>i{visibility:hidden}
.win-option.is-current{background:var(--tint-teal-2);color:var(--teal-2)}
.win-option.is-current>i{visibility:visible}
.win-send{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--green));color:var(--on-dark);font-size:var(--text-2xs);background-origin:border-box}

/* ---- The conversation on its screen -------------------------------------
   Who is speaking, then what they said. A learner's own turn runs the other
   way and takes a tint, so the two sides read apart without either being
   labelled. */

.chat{display:grid;gap:10px}
.msg{display:flex;align-items:flex-start;gap:8px}
.msg.is-you{flex-direction:row-reverse}
.avatar{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--tint-primary-2);color:var(--primary);font-size:var(--text-3xs)}
.bubble{max-width:82%;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-soft);color:var(--ink);font-size:var(--text-3xs);font-weight:var(--weight-medium);line-height:var(--leading-relaxed)}
.msg.is-you .bubble{border-start-end-radius:5px;background:var(--tint-primary)}

/* ---- The tour around it -------------------------------------------------
   The stage clips its own overflow and carries extra headroom at the top,
   which is where the spotlight's label sits without being cut off. */

.sim{padding:var(--space-5);border:1px solid var(--border);border-radius:var(--radius-lg);background:linear-gradient(180deg,var(--surface),var(--surface-soft));box-shadow:var(--shadow);background-origin:border-box}
.sim-lead{margin:0 0 var(--space-4);color:var(--ink);font-size:var(--text-sm);font-weight:var(--weight-medium);line-height:var(--leading-loose)}
.sim-stage{position:relative;overflow:hidden;padding:40px 18px 18px;border-radius:var(--radius-md);background:linear-gradient(180deg,var(--tint-primary),var(--surface-soft));background-origin:border-box}
.sim-spot{position:absolute;top:0;left:0;z-index:2;border:2px solid var(--teal);border-radius:var(--radius-sm);background:var(--tint-teal);opacity:0;pointer-events:none;cursor:pointer;box-shadow:0 0 0 9999px var(--scrim);transition:opacity .25s ease,top .3s ease,left .3s ease,width .3s ease,height .3s ease}
.sim-spot.is-on{opacity:1;pointer-events:auto}
/* Placed from measured pixels, so "left" is physical; the translate keeps
   the label anchored to the reading edge of the spotlight either way. */
.sim-tag{position:absolute;top:0;left:0;z-index:4;padding:4px 11px;border-radius:var(--radius-2xs);background:var(--teal);color:var(--on-dark);font-size:var(--text-2xs);font-weight:var(--weight-black);line-height:var(--leading-relaxed);white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-100%);transition:opacity .25s ease}
.sim-tag.is-on{opacity:1}
.sim-caption{margin-block-start:18px;display:grid;grid-template-columns:34px minmax(0,1fr);align-items:start;gap:var(--space-3)}
.sim-caption.is-plain{grid-template-columns:minmax(0,1fr)}
.sim-number{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--radius-xs);background:linear-gradient(135deg,var(--primary),var(--teal));color:var(--on-dark);font-size:var(--text-md);font-weight:var(--weight-black);background-origin:border-box}
.sim-text{margin:0;min-height:62px;color:var(--ink);font-size:var(--text-base);font-weight:var(--weight-medium);line-height:var(--leading-loose)}
.sim-note{margin:14px 0 0;color:var(--muted);font-size:var(--text-2xs);font-weight:var(--weight-medium);line-height:var(--leading-normal);text-align:center}

/* Anything that steps through a sequence shares this control row. Equal side
   columns keep the middle dead centre when the next label swaps to the wider
   restart label. */
.sim-steps{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center}
.sim-steps>button{padding:9px var(--space-4);display:inline-flex;align-items:center;gap:var(--space-2);border:1px solid var(--border-strong);border-radius:var(--radius-xs);background:var(--surface);color:var(--primary);font-size:var(--text-xs);font-weight:var(--weight-black);cursor:pointer;transition:border-color .2s ease,background .2s ease}
.sim-steps>button:first-child{justify-self:start}
.sim-steps>button:last-child{justify-self:end}
.sim-steps>button:hover:not(:disabled){border-color:var(--teal);background:var(--tint-teal)}
.sim-steps>button:disabled{opacity:.45;cursor:default}
.sim-dots{display:flex;gap:7px}
.sim-dots button{width:11px;height:11px;min-height:0;padding:0;border:0;border-radius:50%;background:var(--tint-primary-2);cursor:pointer;transition:background .2s ease,transform .2s ease}
.sim-dots button.is-on{background:var(--teal);transform:scale(1.25)}
.sim-dots button.is-done{background:var(--border-strong)}


/* ==========================================================================
   5 · BRAND BAR
   ========================================================================== */

.brand-bar{position:relative;z-index:80;width:min(var(--width),calc(100% - (var(--gutter) * 2)));min-height:72px;margin:0 auto;padding:max(14px,var(--logo-clear)) max(var(--space-7),var(--logo-clear));display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:max(var(--space-4),var(--logo-clear));overflow:hidden;border-radius:0 0 var(--radius-lg) var(--radius-lg);background:var(--black);color:var(--on-dark);box-shadow:var(--shadow-bar)}
.brand-bar::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px 180px at 80% 50%,var(--glow-teal),transparent 70%),radial-gradient(420px 180px at 20% 50%,var(--glow-green),transparent 70%);background-origin:border-box}
.brand-bar>*{position:relative;z-index:1}
.brand-action{display:flex;align-items:center}
.brand-heading{min-width:0;text-align:center;line-height:var(--leading-tight)}
.brand-title{overflow:hidden;color:var(--on-dark);font-size:15px;font-weight:var(--weight-black);text-overflow:ellipsis;white-space:nowrap}
.brand-subtitle{margin-block-start:2px;overflow:hidden;color:var(--on-dark-muted);font-size:var(--text-2xs);font-weight:var(--weight-medium);text-overflow:ellipsis;white-space:nowrap}
.brand-logo-wrap{display:flex;align-items:center}
.brand-logo{width:auto;height:var(--logo-height);display:block;filter:var(--shadow-logo)}
.fullscreen{appearance:none;width:44px;height:44px;padding:0;display:grid;place-items:center;border:1px solid var(--veil-line);border-radius:var(--radius-xs);background:var(--veil);color:var(--on-dark);cursor:pointer;transition:background .2s ease,transform .2s ease}
.fullscreen:hover{background:var(--veil-strong);transform:scale(1.06)}


/* ==========================================================================
   6 · SECTION INDICATOR AND READING PROGRESS
   The indicator is a read-out of where the learner is, not a control: the
   items are inert spans and the strip is hidden from assistive technology,
   which reads position from the section headings instead.
   ========================================================================== */

.nav-shell{position:sticky;inset-block-start:0;z-index:70;width:min(var(--width),calc(100% - (var(--gutter) * 2)));margin:var(--space-4) auto 0}
.nav{padding:7px;display:flex;gap:5px;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-veil);box-shadow:var(--shadow-nav);backdrop-filter:blur(10px)}
.nav-link{min-width:0;flex:1 1 0;padding:10px var(--space-2);display:block;overflow:hidden;border-radius:var(--radius-xs);color:var(--muted);font-size:var(--text-nav);font-weight:var(--weight-black);line-height:normal;text-align:center;text-overflow:ellipsis;white-space:nowrap;transition:background .3s ease,color .3s ease,box-shadow .3s ease}
.nav-link.is-active{background:linear-gradient(135deg,var(--primary),var(--teal));color:var(--on-dark);box-shadow:var(--shadow-active);background-origin:border-box}

/* Sits outside the nav shell so it survives the shell being hidden on phones. */
.progress{position:fixed;inset-inline:0;inset-block-end:0;z-index:120;width:100%;height:4px;pointer-events:none}
.progress i{width:0;height:100%;display:block;background:linear-gradient(90deg,var(--primary),var(--teal),var(--green));box-shadow:var(--shadow-glow);transition:width .12s linear;background-origin:border-box}


/* ==========================================================================
   7 · SECTION SHELL
   ========================================================================== */

.section{scroll-margin-block-start:var(--scroll-offset);width:min(var(--width),calc(100% - (var(--gutter) * 2)));margin:22px auto;padding:30px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow)}

/* Sections only start hidden once the runtime has claimed the page. Without
   the .js gate a lesson whose script never runs would render blank. */
.js .section[data-reveal]{opacity:0;transform:translateY(14px)}
.js .section[data-reveal].is-visible{animation:reveal .55s ease both}
@keyframes reveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade-down{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.section-title{margin:0 0 var(--space-2);display:flex;align-items:center;gap:10px;color:var(--primary);font-size:var(--text-h2);font-weight:var(--weight-black);letter-spacing:-.01em;line-height:var(--leading-tight)}
.section-title>i{color:var(--teal);font-size:.72em}
.section-num{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:var(--radius-2xs);background:var(--tint-primary);color:var(--primary);font-size:var(--text-md)}
.section-subtitle{margin:0 0 var(--space-6);color:var(--muted);font-size:var(--text-base);font-weight:var(--weight-medium);line-height:var(--leading-loose)}
.section-subtitle b{color:var(--primary);font-weight:var(--weight-black)}
.subheading{margin:var(--space-6) 0 var(--space-3);color:var(--primary);font-size:var(--text-xl);font-weight:var(--weight-black);line-height:var(--leading-snug)}


/* ==========================================================================
   8 · HERO
   ========================================================================== */

.hero-section{margin-block-start:var(--space-5);padding:0;overflow:hidden;border:0;background:transparent;box-shadow:none}
.hero{position:relative;overflow:hidden;border:none;border-radius:24px;background:linear-gradient(125deg,var(--primary) 0%,var(--primary-2) 48%,var(--teal) 100%);color:#fff;padding:40px 34px;box-shadow:0 18px 40px rgba(36,55,113,.22),0 2px 6px rgba(36,55,113,.10)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px 260px at 95% -20%,rgba(115,194,103,.30),transparent 60%),radial-gradient(420px 220px at -5% 110%,rgba(115,194,103,.17),transparent 60%),radial-gradient(420px 260px at 45% 55%,rgba(255,255,255,.06),transparent 65%)}
.hero>*{position:relative;z-index:1}
.hero-copy{min-width:0;max-width:none}
.hero h1{margin:0 0 13px;color:#fff;font-size:min(42px,calc(4.3vw - 3px));font-weight:900;line-height:1.25;letter-spacing:-.02em;text-shadow:0 2px 10px rgba(0,0,0,.15);white-space:nowrap;overflow-wrap:normal}
.hero-copy>p{margin:0;color:rgba(255,255,255,.95);font-size:clamp(15px,1.3vw,18px);font-weight:500;line-height:1.9}


/* ==========================================================================
   9 · CALLOUTS AND INTERACTION HINT
   ========================================================================== */

.callout{padding:14px var(--space-5);display:flex;align-items:flex-start;gap:var(--space-3);border-radius:var(--radius-sm);font-size:var(--text-base);font-weight:var(--weight-bold);line-height:var(--leading-loose)}
.callout>i{flex:none;margin-block-start:5px}
.callout p{margin:0}
.callout b{font-weight:var(--weight-black)}

/* Bridges one section into the next. */
.callout-keyline{margin-block-start:var(--space-5);padding:var(--space-5);gap:14px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:linear-gradient(135deg,var(--tint-primary),var(--tint-teal));color:var(--primary);background-origin:border-box}
.callout-keyline>i{margin-block-start:4px;color:var(--teal);font-size:var(--text-xl)}

/* Carries the single idea a section turns on. */
.callout-focus{margin-block-end:var(--space-5);padding:19px var(--space-6);align-items:center;gap:15px;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--primary),var(--primary-2) 58%,var(--teal));color:var(--on-dark);background-origin:border-box}
.callout-focus>i{width:38px;height:38px;flex:none;margin:0;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--veil);color:var(--on-dark-accent);font-size:var(--text-lg)}
.callout-focus b{color:var(--on-dark-accent)}

/* Sets down a rule the learner should carry out of the block above it. It
   stands off whatever it follows, and its accent sits on the inline start,
   which the RTL page puts on the right. */
.callout-note{margin-block-start:var(--space-5);border-inline-start:4px solid var(--teal);background:var(--tint-teal);color:var(--teal-2)}
.callout-note>i{color:var(--teal)}

/* The same, for a caution the learner has to read before acting. */
.callout-warn{margin-block-start:var(--space-5);border-inline-start:4px solid var(--warning);background:var(--tint-warning);color:var(--warning)}
.callout-warn>i{color:var(--warning)}

/* Tells the learner a block is interactive. */
.hint{margin:0 0 14px;padding:7px 14px;display:inline-flex;align-items:center;gap:var(--space-2);border:1px dashed var(--border);border-radius:var(--radius-xs);background:var(--tint-primary);color:var(--primary);font-size:var(--text-2xs);font-weight:var(--weight-black)}
.hint>i{color:var(--teal)}


/* ==========================================================================
   10 · BUTTON
   Every control a lesson gives the learner: the quiz's own navigation, a
   simulator's reset, a workshop's next step. Ghost by default, filled when
   it is the one action the block is asking for.
   ========================================================================== */

.btn{padding:11px var(--space-5);display:inline-flex;align-items:center;justify-content:center;gap:9px;appearance:none;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--primary);font-family:inherit;font-size:var(--text-sm);font-weight:var(--weight-black);cursor:pointer;transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease}
.btn i{font-size:11px}
.btn:hover:not(:disabled){border-color:var(--border-strong);box-shadow:var(--shadow-nav)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.is-primary{border-color:transparent;background:linear-gradient(135deg,var(--primary),var(--teal));color:var(--on-dark);background-origin:border-box}
.btn.is-primary:hover:not(:disabled){box-shadow:var(--shadow-raised);transform:translateY(-2px)}


/* ==========================================================================
   11 · DISCLOSURE LIST
   A list where one item is open at a time, used wherever a lesson wants the
   learner to work through a set rather than read it all at once.
   ========================================================================== */

/* A hint on one side, a count on the other. */
.acc-top{margin-block-end:var(--space-4);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3)}
.acc-top .hint{margin:0}
.tally{padding:9px var(--space-5);display:inline-flex;align-items:center;gap:9px;border:1.5px solid var(--border);border-radius:var(--radius-pill);background:var(--surface);color:var(--primary);font-size:var(--text-md);font-weight:var(--weight-black);box-shadow:var(--shadow)}
.tally>i{color:var(--teal)}
.tally b{color:var(--teal);font-size:var(--text-xl)}
.acc{display:grid;gap:10px}
.acc-item{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow)}
.acc-head{width:100%;min-height:72px;padding:15px var(--space-5);display:flex;align-items:center;gap:var(--space-3);appearance:none;border:none;background:var(--surface);color:var(--primary);font-family:inherit;font-size:var(--text-lg);font-weight:var(--weight-black);text-align:start;cursor:pointer;user-select:none;transition:background .2s ease}
.acc-head:hover{background:var(--surface-soft)}
.acc-name{flex:1;min-width:0}
.acc-name>b{display:block;font-weight:var(--weight-black)}
.acc-name>small{margin-block-start:2px;display:block;color:var(--muted);font-size:var(--text-xs);font-weight:var(--weight-bold);line-height:var(--leading-relaxed)}
.acc-chev{flex:none;color:var(--muted);font-size:var(--text-md);transition:transform .3s ease,color .3s ease}
.acc-item.is-open .acc-head{background:var(--tint-teal)}
.acc-item.is-open .acc-chev{transform:rotate(180deg);color:var(--teal)}
/* An item already opened keeps a tick, so what is left can be seen rather
   than counted. */
.acc-item.is-seen .acc-head::after{content:"\f00c";width:21px;height:21px;flex:none;order:-1;display:grid;place-items:center;border-radius:50%;background:var(--tint-teal-2);color:var(--teal-2);font-family:"Font Awesome 6 Free";font-size:var(--text-3xs);font-weight:var(--weight-black)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.acc-item.is-open .acc-body{max-height:760px}
.acc-inner{margin:0 var(--space-5) var(--space-5);padding:var(--space-4);border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-soft)}

/* ==========================================================================
   12 · CONCLUSION
   Three or four recap cards, the bridge into the next lesson, then the
   references. The cards are the shared card on the shared grid, so only what
   is particular to a recap is written here.
   ========================================================================== */

.rc .tile{margin-block-end:13px}
.rc .card-title{margin-block-end:6px}
.rc p{margin:0;color:var(--muted);font-size:var(--text-sm);font-weight:var(--weight-medium);line-height:var(--leading-normal)}

.bridge{margin-block-start:var(--space-5);padding:var(--space-4) 21px;display:flex;align-items:center;gap:var(--space-3);border-radius:var(--radius-md);background:linear-gradient(135deg,var(--primary),var(--primary-2));color:var(--on-dark);font-size:var(--text-md);font-weight:var(--weight-bold);line-height:var(--leading-normal);background-origin:border-box}
.bridge>i{flex:none;color:var(--on-dark-accent);font-size:var(--text-xl)}
.bridge p{margin:0}
.bridge b{color:var(--on-dark-accent)}


/* ==========================================================================
   13 · REFERENCES
   ========================================================================== */

.refs{margin-block-start:var(--space-6);padding-block-start:var(--space-4);border-block-start:1px dashed var(--border)}
.refs summary{padding:9px var(--space-4);display:inline-flex;align-items:center;gap:9px;border:1px solid var(--border-strong);border-radius:var(--radius-pill);background:var(--tint-teal);color:var(--teal);font-size:var(--text-xs);font-weight:var(--weight-black);list-style:none;cursor:pointer;user-select:none;transition:background .2s ease}
.refs summary::-webkit-details-marker{display:none}
.refs summary::marker{content:""}
.refs summary:hover{background:var(--tint-teal-2)}
.refs summary .fa-chevron-down{font-size:10px;transition:transform .25s ease}
.refs[open] summary .fa-chevron-down{transform:rotate(180deg)}
.refs-body{margin-block-start:13px;display:grid;gap:9px;animation:fade-down .28s ease}
.refs-body a{display:inline-flex;align-items:flex-start;gap:var(--space-2);color:var(--teal);font-size:var(--text-xs);font-weight:var(--weight-bold);line-height:var(--leading-normal);text-decoration:none}
.refs-body a:hover{text-decoration:underline}
.refs-body a>i{margin-block-start:5px;flex:none;font-size:9px}


/* ==========================================================================
   14 · UNIT OVERVIEW
   The three sections every unit opens with: what the learner will be able to
   do, what the unit covers lesson by lesson, and the terms it uses. The first
   two are the shared card on the shared grid; what is left here is what only
   a goal or a lesson plan has.
   ========================================================================== */

/* The tile turns as the card rises, so a goal answers the pointer. */
.goal .tile{margin-block-end:14px;transition:transform .4s ease}
