   * A flat drawing, given as plain shape data so the artwork stays in the
   * lesson's content rather than its code:
   *
   *   drawing("0 0 74 58", [{ tag: "circle", cls: "tv-node", cx: 13, cy: 42, r: 5 }])
   *
   * `text` is the shape's content, for the one tag that has any:
   *
   *   { tag: "text", x: 31, y: 30, "text-anchor": "middle", text: "يُقبل" }
   *
   * A drawing is hidden from assistive technology, so whatever it says has to
   * be said again by whatever frames it. `label` puts that on the drawing
   * itself for the cases with no frame to carry it.
   */
  function drawing(viewBox, shapes, label) {
    return svg("svg", {
      attrs: label
        ? { viewBox, role: "img", "aria-label": asText(label) }
        : { viewBox, "aria-hidden": "true" }
    }, asArray(shapes).map(({ tag, cls, text, ...attrs }) => svg(tag, { className: cls, attrs }, text)));
  }

  /** Icon followed by its label, the order used by buttons and nav items. */
  function iconText(iconValue, text, fallback) {
    return fragment([icon(iconValue, fallback), el("span", { text: asText(text) })]);
  }

  /** Label followed by its icon, the order used by disclosure summaries. */
  function textIcon(text, iconValue, fallback) {
    return fragment([el("span", { text: asText(text) }), icon(iconValue, fallback)]);
  }

  // Lesson copy is written in a small markdown of two marks and nothing else:
  //
  //   **قدرةً وطنيةً تُبنى**              the phrase the sentence turns on
  //   [سدايا](https://sdaia.gov.sa)   a link away from the lesson
  //
  // A sentence stays one string in the content that way, rather than being cut
  // into the pieces around its own emphasis. Raw inline HTML still passes for
  // what the two marks cannot say — a <br>, or a <span dir="ltr"> around a
  // Latin term inside Arabic — but anything outside INLINE_TAGS is unwrapped,
  // keeping its text and losing its tag, and every attribute but dir and lang
  // is dropped. Links are built after that pass rather than read out of the
  // copy, so the only <a> on a page is one the mark above made, with an
  // address the mark itself has already vouched for.
  const INLINE_TAGS = new Set(["B", "STRONG", "I", "EM", "SPAN", "SMALL", "CODE", "BR"]);
  const BOLD = /\*\*([^\s*](?:[^*\n]*[^\s*])?)\*\*/g;
  const LINK = /\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g;

  /**
   * A link that opens away from the lesson. Given words it says so with the
   * mark for it; given nodes it carries them as they are, for the cases —
   * a picture with its caption — where the mark belongs somewhere inside.
   */
  function away(href, content, title) {
    return el("a", {
      className: "away",
      attrs: { href, target: "_blank", rel: "noopener noreferrer", title }
    }, typeof content === "string"
      ? [el("span", { text: content }), icon("arrow-up-right-from-square")]
      : content);
  }

  /** Turns every [label](address) still sitting in the text into a link. */
  function linkify(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const carrying = [];
    while (walker.nextNode()) {
      LINK.lastIndex = 0;
      if (LINK.test(walker.currentNode.data)) carrying.push(walker.currentNode);
    }

    for (const node of carrying) {
      const pieces = [];
      let at = 0;
      let found;
      LINK.lastIndex = 0;
      while ((found = LINK.exec(node.data)) !== null) {
        if (found.index > at) pieces.push(document.createTextNode(node.data.slice(at, found.index)));
        pieces.push(away(found[2], found[1]));
        at = found.index + found[0].length;
      }
      if (at < node.data.length) pieces.push(document.createTextNode(node.data.slice(at)));
      node.replaceWith(...pieces);
    }

    return root;
  }

  function markup(html) {
    const text = asText(html);
    const template = document.createElement("template");
    template.innerHTML = text.replace(BOLD, "<b>$1</b>");
    for (const node of [...template.content.querySelectorAll("*")]) {
      if (!INLINE_TAGS.has(node.tagName)) {
        node.replaceWith(...node.childNodes);
        continue;
      }
      for (const attribute of [...node.attributes]) {
        if (attribute.name !== "dir" && attribute.name !== "lang") node.removeAttribute(attribute.name);
      }
    }
    return text.includes("](") ? linkify(template.content) : template.content;
  }

  /* ========================================================================
     2 · DESIGN PRIMITIVES
     The shapes every lesson is built out of. A card in unit 1 and a card in
     unit 6 are the same card because there is only one of them, and a lesson
     that wants a bordered box asks for one rather than drawing another.
     ======================================================================== */

  // What a lesson may ask for. Anything else falls back rather than putting a
  // class on the page with no rule behind it.
  const TONES = ["primary", "teal", "green", "warning", "danger"];
  const PADS = ["bare", "tight", "snug", "wide"];
  const FILLS = ["soft", "sunken", "dark"];
  const SIZES = ["xs", "sm", "md", "lg", "xl"];
  const GAPS = ["tight", "loose"];

  /** `base-value`, for the values this component knows; nothing otherwise. */
  function variant(base, value, allowed) {
    return allowed.includes(value) ? `${base}-${value}` : "";
  }

  function classNames() {
    return [].slice.call(arguments).filter(Boolean).join(" ");
  }

  /**
   * Which brand colour a block is in. The class sets --tone and its ramp, and
   * everything inside reads those rather than naming a colour, so one word in
   * a lesson's content recolours a whole card.
   */
  function tone(value) {
    return variant("tone", value, TONES);
  }

  /**
   * The one bordered surface in the course. Card, panel, well, tile: they are
   * all this, so nothing downstream restates a border, a radius and a shadow.
   *
   *   card({ rule: true, lift: true, center: true }, [ … ])
   *
   *   rule    a brand gradient laid across the top edge
   *   lift    rises under the pointer, for a card that is a choice
   *   center  centres what it holds
   *   tone    which brand colour it and its rule take
   *   pad     "bare", "tight", "snug" or "wide" for the room inside
   *   fill    "soft" gradient, "sunken" tint, or "dark" for the brand panel
   */
  function card(options, children) {
    const settings = options || {};
    return el(settings.tag || "article", {
      id: settings.id,
      className: classNames(
        "card",
        settings.rule ? "has-rule" : "",
        settings.lift ? "is-lift" : "",
        settings.center ? "is-center" : "",
        variant("card", settings.pad, PADS),
        variant("card", settings.fill, FILLS),
        tone(settings.tone),
        settings.className
      ),
      attrs: settings.attrs
    }, children || []);
  }

  /**
   * The gradient square a card leads with, holding one icon.
   *
   *   tile("trophy", { size: "lg" })
   */
  function tile(iconValue, options) {
    const settings = options || {};
    return el("span", {
      className: classNames("tile", variant("tile", settings.size, SIZES) || "tile-md", tone(settings.tone), settings.className),
      attrs: { "aria-hidden": "true" }
    }, icon(iconValue, settings.fallback));
  }

  /**
   * A short label on a pill: a count, a year, a state.
   *
   *   badge("1950م", { tone: "teal" })
   */
  function badge(text, options) {
    const settings = options || {};
    return el(settings.tag || "span", {
      className: classNames("badge", settings.plain ? "is-plain" : "", tone(settings.tone), settings.className),
      attrs: settings.attrs
    }, [settings.icon ? icon(settings.icon) : null, el("span", {}, markup(text))]);
  }

  /**
   * The head of a card: its tile, then its title with whatever small line
   * belongs over it, then anything trailing.
   *
   *   cardHead({ icon: "robot", eyebrow: "Agentic AI", title: "…", trail: badge("2024م") })
   */
  function cardHead(options) {
    const settings = options || {};
    return el("header", {
      className: classNames("card-head", settings.center ? "is-center" : "", settings.className)
    }, [
      settings.icon ? tile(settings.icon, { size: settings.iconSize || "md" }) : null,
      (settings.title || settings.eyebrow) ? el("div", { className: "card-head-body" }, [
        settings.eyebrow ? el("span", { className: "card-eyebrow", text: asText(settings.eyebrow) }) : null,
        settings.title ? el(settings.level || "h3", { className: "card-title" }, markup(settings.title)) : null
      ]) : null,
      settings.trail ? el("span", { className: "card-trail" }, settings.trail) : null
    ]);
  }

  /**
   * Equal columns that fit themselves to the screen. `min` is how narrow a
   * column may get before the row gives one up, named on the same five-step
   * scale as everything else; `columns` pins the count instead, for a grid
   * whose shape is part of what it is saying.
   *
   *   grid(facts, (fact) => card({ rule: true }, …), { min: "md" })
   */
  function grid(items, render, options) {
    const settings = options || {};
    const columns = Number(settings.columns);
    return el(settings.tag || "div", {
      className: classNames(
        "grid",
        columns ? `cols-${Math.max(2, Math.min(4, columns))}` : variant("grid", settings.min, SIZES) || "grid-lg",
        variant("gap", settings.gap, GAPS),
        settings.className
      ),
      attrs: settings.attrs
    }, asArray(items).map((item, index) => render(item, index)));
  }

  /* ========================================================================
     3 · PAGE BUILDERS
     ======================================================================== */

  /**
   * The brand bar. A unit overview passes no lesson number and gets
   * "الوحدة 6 | العنوان"; a lesson gets "الوحدة 6 - الدرس 1 | العنوان".
   */
  function brandBar(meta) {
    const settings = meta || {};
    const subtitle = settings.lesson
      ? `الوحدة ${settings.module} - الدرس ${settings.lesson} | ${settings.lessonTitle}`
      : `الوحدة ${settings.module} | ${settings.lessonTitle}`;

    return el("header", { className: "brand-bar" }, [
      el("div", { className: "brand-action" },
        el("button", {
          className: "fullscreen",
          type: "button",
          attrs: { "aria-label": STRINGS.fullscreen, title: STRINGS.fullscreen, "aria-keyshortcuts": "F" }
        }, icon("expand"))),
      el("div", { className: "brand-heading" }, [
        el("div", { className: "brand-title", text: asText(settings.moduleTitle) }),
        el("div", { className: "brand-subtitle", text: subtitle })
      ]),
      el("div", { className: "brand-logo-wrap" },
        el("img", { className: "brand-logo", attrs: { src: LOGO, alt: STRINGS.logoAlt } }))
    ]);
  }

  /**
   * The section indicator. Items are inert spans: they report where the
   * learner is, they do not navigate, and the strip is hidden from assistive
   * technology because the section headings already carry that.
   *
   * Its items come from the sections themselves: a section that declares a
   * `nav` label gets one, a section that does not stays out of the strip. The
   * conclusion closes every lesson that has one, so its item is appended here
   * rather than declared — a unit overview, which has none, gets no item.
   */
  function lessonNav(sections, hasConclusion) {
    const entries = Object.entries(sections || {})
      .filter(([, config]) => config && config.nav)
      .map(([id, config]) => ({ target: id, label: config.nav }));
    if (hasConclusion) entries.push({ target: "summary", label: STRINGS.conclusionShort });

    return el("div", { className: "nav-shell", attrs: { "aria-hidden": "true" } },
      el("div", { className: "nav" }, entries.map((item, index) => el("span", {
        className: index === 0 ? "nav-link is-active" : "nav-link",
        text: asText(item.label),
        attrs: { "data-target": item.target }
      }))));
  }

  /**
   * The opening section: one heading and one paragraph of introduction. A
   * lesson leads with its own title; a unit overview leads with the unit's,
   * since "نظرة عامة" names the page rather than what it is about.
   */
  function hero(meta) {
    const settings = meta || {};
    const id = "intro";
    const title = settings.lesson ? settings.lessonTitle : settings.moduleTitle;
    return el("section", {
      id,
      className: "section hero-section",
      attrs: { "data-reveal": true, "aria-labelledby": `${id}-title` }
    }, el("div", { className: "hero" },
      el("div", { className: "hero-copy" }, [
        el("h1", { id: `${id}-title` }, markup(title)),
        settings.introduction ? el("p", {}, markup(settings.introduction)) : null
      ])));
  }

  /**
   * A lesson section. The key it is registered under becomes its id, so the
   * indicator and the scroll-spy line up without a second list:
   *
   *   section("trends", { nav: "الاتجاهات", title: "…", subtitle: "…", nodes })
   *
   * Omit `nav` and the section still renders but stays out of the indicator.
   *
   * A section that is one of a numbered series says so before it says its
   * name: `number` puts a badge at the head of the title, `icon` an icon.
   * Both are built here rather than written into `title`, because markup()
   * keeps no class and Font Awesome is nothing without one.
   */
  function section(id, config) {
    const settings = config || {};
    return el("section", {
      id,
      className: "section",
      attrs: { "data-reveal": true, "aria-labelledby": settings.title ? `${id}-title` : null }
    }, [
      settings.title ? el("h2", { id: `${id}-title`, className: "section-title" }, [
        settings.number ? el("span", { className: "section-num", text: asText(settings.number) }) : null,
        settings.icon ? icon(settings.icon) : null,
        markup(settings.title)
      ]) : null,
      settings.subtitle ? el("p", { className: "section-subtitle" }, markup(settings.subtitle)) : null,
      settings.nodes || null
    ]);
  }

  /* ---- Content components shared across lessons -------------------------- */

  /** Tells the learner a block is interactive. */
  function hint(text, iconValue) {
    return el("p", { className: "hint" }, [icon(iconValue, "hand-pointer"), ` ${asText(text)}`]);
  }

  /** Bridges one section into the next. */
  function keyline(text, iconValue) {
    return el("div", { className: "callout callout-keyline" }, [icon(iconValue, "arrow-down"), el("p", {}, markup(text))]);
  }

  /** Carries the single idea a section turns on. */
  function focusNote(text, iconValue) {
    return el("div", { className: "callout callout-focus" }, [icon(iconValue, "bullseye"), el("p", {}, markup(text))]);
  }

  /** Sets down a rule the learner carries out of the block above it. */
  function note(text, iconValue) {
    return el("div", { className: "callout callout-note" }, [icon(iconValue, "lightbulb"), el("p", {}, markup(text))]);
  }

  /** The same, for a caution the learner has to read before acting. */
  function warn(text, iconValue) {
    return el("div", { className: "callout callout-warn" }, [icon(iconValue, "triangle-exclamation"), el("p", {}, markup(text))]);
  }

  /**
   * A control. `primary` fills it, for the one action a block is asking for;
   * everything else stays a ghost.
   *
   *   button({ text: "إعادة المحاولة", icon: "rotate-right", primary: true })
   */
  function button(config) {
    const settings = config || {};
    return el("button", {
      className: settings.primary ? "btn is-primary" : "btn",
      type: "button",
      attrs: { disabled: settings.disabled }
    }, [settings.icon ? icon(settings.icon) : null, ` ${asText(settings.text)}`]);
  }

  function progressBar() {
    return el("div", {
      className: "progress",
      attrs: {
        role: "progressbar",
        "aria-label": STRINGS.progress,
        "aria-valuemin": "0",
        "aria-valuemax": "100",
        "aria-valuenow": "0"
      }
    }, el("i"));
  }

  /**
   * The conclusion. Its shape is the same in every lesson: three or four
   * recap cards, one bridge paragraph into the next lesson, then the
   * references. The heading and the disclosure label are fixed.
   *
   *   conclusion({
   *     cards: [{ icon, title, text }],
   *     text: "…",
   *     references: [{ text, link }]
   *   })
   */
  function conclusion(data) {
    const settings = data || {};
    const id = settings.id || "summary";
    const cards = asArray(settings.cards);
    const references = asArray(settings.references);

    return el("section", {
      id,
      className: "section",
      attrs: { "data-reveal": true, "aria-labelledby": `${id}-title` }
    }, [
      el("h2", { id: `${id}-title`, className: "section-title", text: STRINGS.conclusion }),

      cards.length ? grid(cards, (recap) => card({ lift: true, className: "rc" }, [
        tile(recap.icon),
        el("h3", { className: "card-title" }, markup(recap.title)),
        recap.text ? el("p", {}, markup(recap.text)) : null
      ])) : null,

      settings.text ? el("div", { className: "bridge" },
        el("p", {}, markup(settings.text))
      ) : null,

      references.length ? el("details", { className: "refs" }, [
        el("summary", {}, [icon("book"), ` ${STRINGS.references} `, icon("chevron-down")]),
        el("div", { className: "refs-body" }, references.map((reference) => el("a", {
          attrs: { href: reference.link, rel: "noopener", target: "_blank" }
        }, [icon("arrow-up-right-from-square"), " ", markup(reference.text)])))
      ]) : null
    ]);
  }

  /**
   * A list where one item is open at a time. Each item names itself and
   * carries whatever the lesson puts behind it, and the list keeps count of
   * how many have been opened — a lesson that asks the learner to read all of
   * them wants to be able to say when they have.
   *
   *   disclosure({
   *     hint: "…",
   *     tally: "قرأت",                        the count is written after it
   *     done: node,                           shown once every item is opened
   *     items: [{ icon, title, note, nodes }]
   *   })
   *
   * An item that has been opened keeps a tick, so a learner coming back to
   * the list can see what is left rather than counting.
   */
  function disclosure(data) {
    const settings = data || {};
    const items = asArray(settings.items);
    const tally = el("b", { text: "0" });
    const seen = new Set();
    const opened = [];

    const rows = items.map((item) => {
      const head = el("button", {
        className: "acc-head",
        type: "button",
        attrs: { "aria-expanded": "false" }
      }, [
        tile(item.icon, { size: "md" }),
        el("span", { className: "acc-name" }, [
          el("b", {}, markup(item.title)),
          item.note ? el("small", {}, markup(item.note)) : null
        ]),
        el("i", { className: `${iconName("chevron-down")} acc-chev`, attrs: { "aria-hidden": "true" } })
      ]);

      const row = el("div", { className: "acc-item" }, [
        head,
        el("div", { className: "acc-body" }, el("div", { className: "acc-inner" }, item.nodes))
      ]);

      head.addEventListener("click", () => {
        const open = !row.classList.contains("is-open");
        for (const other of opened) {
          const on = other.head === head && open;
          other.row.classList.toggle("is-open", on);
          other.head.setAttribute("aria-expanded", String(on));
        }
        if (!open) return;
        row.classList.add("is-seen");
        if (seen.has(item)) return;
        seen.add(item);
        tally.textContent = String(seen.size);
        if (settings.done) settings.done.classList.toggle("is-shown", seen.size >= items.length);
      });

      opened.push({ head, row });
      return row;
    });

    return fragment([
      (settings.hint || settings.tally !== undefined) ? el("div", { className: "acc-top" }, [
        settings.hint ? hint(settings.hint) : null,
        settings.tally !== undefined ? el("span", { className: "tally" }, [
          icon("list-check"),
          ` ${asText(settings.tally)} `, tally, ` ${STRINGS.quizOf} ${items.length}`
        ]) : null
      ]) : null,
      el("div", { className: "acc" }, rows),
      settings.done || null
    ]);
  }

  /* ---- Unit overview ----------------------------------------------------- */

  /** What the learner will be able to do once the unit is done. */
  function goalCards(goals) {
    return grid(goals, (goal) => card({ rule: true, lift: true, className: "goal" }, [
      tile(goal.icon, { size: "lg", fallback: "circle-check" }),
      el("p", {}, markup(goal.text))
    ]));
  }

  /** The unit lesson by lesson, each with the topics it covers. */
  function lessonPlan(lessons) {
    return grid(lessons, (lesson, index) => card({ fill: "soft", lift: true, className: "plan-card" }, [
      el("span", { className: "plan-num", text: String(index + 1) }),
      el("h3", { className: "card-title" }, markup(lesson.title)),
      el("ul", { className: "plan-items" }, asArray(lesson.items).map((item) => el("li", {}, [
        icon("circle-dot"),
        el("span", {}, markup(item))
      ])))
    ]), { min: "xl" });
  }

  /** The unit's vocabulary: the Arabic term, its Latin original, its meaning. */
  function termsTable(terms) {
    return el("div", { className: "terms" }, el("table", {}, [
      el("thead", {}, el("tr", {}, [
        el("th", { text: STRINGS.termArabic }),
        el("th", { text: STRINGS.termLatin }),
        el("th", { text: STRINGS.termDefinition })
      ])),
      el("tbody", {}, terms.map((term) => el("tr", {}, [
        el("td", { className: "term", text: asText(term.ar) }),
        el("td", { className: "term-en", text: asText(term.en), attrs: { dir: "ltr" } }),
        el("td", {}, markup(term.def))
      ])))
    ]));
  }

  /**
   * The sections a unit overview is made of. Every unit opens the same way, so
   * the overview passes content and gets the whole `sections` object back:
   *
   *   sections: unitOverview({
   *     goals: [{ icon, text }],
   *     lessons: [{ title, items: ["…"] }],
   *     terms: [{ ar, en, def }]
   *   })
   *
   * A part with no content leaves out its section, and with it its nav item.
   */
  function unitOverview(data) {
    const settings = data || {};
    const goals = asArray(settings.goals);
    const lessons = asArray(settings.lessons);
    const terms = asArray(settings.terms);
    const sections = {};

    if (goals.length) {
      sections.goals = {
        nav: STRINGS.goalsShort,
        title: STRINGS.goals,
        subtitle: STRINGS.goalsLead,
        nodes: goalCards(goals)
      };
    }

    if (lessons.length) {
      sections.outline = { nav: STRINGS.outlineShort, title: STRINGS.outline, nodes: lessonPlan(lessons) };
    }

    if (terms.length) {
      sections.terms = { nav: STRINGS.termsShort, title: STRINGS.terms, nodes: termsTable(terms) };
    }

    return sections;
  }

  /* ---- Understanding check ----------------------------------------------- */

  // Options are lettered in abjad order, the sequence Arabic uses for
  // enumerating. Past the sequence a lesson gets numbers rather than nothing.
  const OPTION_LETTERS = "أبجدهوزحطيكلمنسعفصقرشتثخذضظغ";

  function optionLetter(index) {
    return index < OPTION_LETTERS.length ? OPTION_LETTERS[index] : String(index + 1);
  }

  /**
   * The question tally, counted the way Arabic counts: one and two carry the
   * number in the noun itself and drop the numeral, three to ten take the
   * plural, and eleven upwards take the singular.
   */
  function questionTally(count) {
    if (count === 1) return STRINGS.quizQuestionOne;
    if (count === 2) return STRINGS.quizQuestionTwo;
    return `${count} ${count <= 10 ? STRINGS.quizQuestionsFew : STRINGS.quizQuestionsMany}`;
  }

  /**
   * Reads one question's content into the shape the component runs on. An
   * option is either a bare string or an object, and the answer key is the
   * options that carry `correct` — no index to keep in step with the list:
   *
   *   {
   *     text: "…",
   *     tag: "…",                                 // what the question is about
   *     lead: "…",                                // the detail it is answered from
   *     why: "…",                                 // why the answer is the answer
   *     options: [
   *       { text: "…", correct: true },
   *       { text: "…", why: "…" },                // why this one misses
   *       "…"
   *     ]
   *   }
   *
   * Mark more than one option `correct` and the question becomes select-all:
   * the learner picks freely and presses تحقّق, and it scores only when the
   * selection matches the key exactly.
   */
  function readQuestion(question) {
    const settings = question || {};
    const options = asArray(settings.options)
      .map((option) => (option && typeof option === "object" ? option : { text: option }));
    const key = options.reduce((picked, option, index) => (option.correct ? picked.concat(index) : picked), []);

    return { text: settings.text, tag: settings.tag, lead: settings.lead, why: settings.why, options, key, multiple: key.length > 1 };
  }

  /**
   * The end-of-lesson check: one question at a time, with prev and next.
   * Answers are kept, so stepping back never loses one, and an answered
   * question stays locked.
   *
   *   understandingCheck({
   *     hint: "…",
   *     results: { perfect: "…", good: "…", poor: "…" },
   *     questions: [ … ]                          // see readQuestion above
   *   })
   */
  function understandingCheck(data) {
    const settings = data || {};
    const questions = asArray(settings.questions).map(readQuestion);
    const results = settings.results || {};
    const total = questions.length;

    // One set of chosen options per question; null until it is answered.
    const picks = questions.map(() => null);
    let current = 0;

    const step = el("b", { text: "1" });
    const fill = el("i");
    const hits = el("b", { text: "0" });
    const finalScore = el("b", { text: "0" });
    const message = el("span", { className: "q-msg" });
    const previous = el("button", { className: "btn", type: "button", attrs: { disabled: true } }, [icon("chevron-right"), ` ${STRINGS.quizPrevious}`]);
    const next = el("button", { className: "btn is-primary", type: "button", attrs: { disabled: true } });
    const again = el("button", { className: "btn", type: "button" }, [icon("rotate-right"), ` ${STRINGS.quizRetry}`]);

    const isRight = (index) => {
      const picked = picks[index];
      const key = questions[index].key;
      return picked !== null && picked.size === key.length && key.every((choice) => picked.has(choice));
    };

    const score = () => questions.filter((question, index) => isRight(index)).length;

    const resets = [];

    const cards = questions.map((question, index) => {
      // Held while the learner is still choosing; only a locked question
      // writes to picks, so stepping away from an unchecked select-all
      // question leaves it unanswered rather than half answered.
      const chosen = new Set();

      const notes = el("div", { className: "q-note" });
      const why = el("div", { className: "q-why" }, [icon("lightbulb"), notes]);

      const check = question.multiple
        ? el("button", { className: "btn is-primary", type: "button", attrs: { disabled: true } }, [icon("circle-check"), ` ${STRINGS.quizCheck}`])
        : null;

      const options = question.options.map((option, choice) => el("button", {
        className: "qopt",
        type: "button",
        attrs: question.multiple ? { "aria-pressed": "false" } : {}
      }, [
        el("span", { className: "q-l", text: optionLetter(choice) }),
        el("span", {}, markup(option.text))
      ]));

      const card = el("article", { className: index === 0 ? "qcard is-current" : "qcard" }, [
        question.tag ? el("p", { className: "q-tag" }, [icon("tag"), ` ${asText(question.tag)}`]) : null,
        el("div", { className: "q-txt" }, [
          el("span", { className: "q-n", text: String(index + 1) }),
          el("h3", {}, markup(question.text))
        ]),
        question.lead ? el("p", { className: "q-lead" }, markup(question.lead)) : null,
        question.multiple ? el("p", { className: "q-multi" }, [icon("list-check"), ` ${STRINGS.quizSelectAll}`]) : null,
        el("div", { className: "q-opts" }, options),
        check ? el("div", { className: "q-act" }, check) : null,
        why
      ]);

      // What the learner reads once the question is locked: the note on each
      // option they got wrong, then why the answer is the answer.
      const explain = () => question.options
        .filter((option, choice) => option.why && chosen.has(choice) && !option.correct)
        .map((option) => option.why)
        .concat(question.why ? [question.why] : [])
        .map((line) => el("p", {}, markup(line)));

      const lock = () => {
        picks[index] = new Set(chosen);
        card.classList.add("is-done");

        options.forEach((button, choice) => {
          const correct = question.key.includes(choice);
          const picked = chosen.has(choice);
          button.disabled = true;
          button.classList.remove("is-chosen");
          button.classList.toggle("is-right", correct);
          button.classList.toggle("is-picked", picked);
          button.classList.toggle("is-wrong", picked && !correct);
          button.classList.toggle("is-missed", correct && !picked);
        });

        if (check) check.disabled = true;
        notes.replaceChildren(...explain());
        why.hidden = notes.childElementCount === 0;
        hits.textContent = String(score());
        next.disabled = false;
      };

      options.forEach((button, choice) => {
        button.addEventListener("click", () => {
          if (picks[index] !== null) return;

          if (!question.multiple) {
            chosen.clear();
            chosen.add(choice);
            lock();
            return;
          }

          const on = !chosen.has(choice);
          if (on) chosen.add(choice);
          else chosen.delete(choice);
          button.classList.toggle("is-chosen", on);
          button.setAttribute("aria-pressed", String(on));
          check.disabled = chosen.size === 0;
        });
      });

      if (check) check.addEventListener("click", () => {
        if (picks[index] === null && chosen.size) lock();
      });

      // Puts the question back the way it was authored.
      resets.push(() => {
        chosen.clear();
        card.classList.remove("is-done");
        notes.replaceChildren();
        why.hidden = false;
        if (check) check.disabled = true;
        for (const button of options) {
          button.disabled = false;
          button.classList.remove("is-chosen", "is-picked", "is-wrong", "is-right", "is-missed");
          if (question.multiple) button.setAttribute("aria-pressed", "false");
        }
      });

      return card;
    });

    const list = el("div", {}, cards);
    const nav = el("div", { className: "q-nav" }, [previous, next]);
    const panel = el("div", { className: "q-done", hidden: true }, [
      icon("award"),
      el("p", {}, [`${STRINGS.quizResult} `, finalScore, ` ${STRINGS.quizOf} ${questionTally(total)}`]),
      message,
      again
    ]);

    const show = (index) => {
      current = index;
      cards.forEach((card, i) => card.classList.toggle("is-current", i === index));
      step.textContent = String(index + 1);
      fill.style.width = `${((index + 1) / total) * 100}%`;
      previous.disabled = index === 0;
      next.disabled = picks[index] === null;
      next.replaceChildren(...(index === total - 1
        ? [document.createTextNode(`${STRINGS.quizFinish} `), icon("flag-checkered")]
        : [document.createTextNode(`${STRINGS.quizNext} `), icon("chevron-left")]));
    };

    previous.addEventListener("click", () => {
      if (current > 0) show(current - 1);
    });

    next.addEventListener("click", () => {
      if (picks[current] === null) return;
      if (current < total - 1) {
        show(current + 1);
        return;
      }

      const correct = score();
      list.hidden = true;
      nav.hidden = true;
      panel.hidden = false;
      finalScore.textContent = String(correct);
      message.textContent = asText(correct === total ? results.perfect
        : correct >= Math.ceil(total / 2) ? results.good
        : results.poor);
      if (panel.getBoundingClientRect().top < 0) {
        panel.scrollIntoView({ behavior: REDUCED_MOTION ? "auto" : "smooth", block: "center" });
      }
    });

    again.addEventListener("click", () => {
      picks.fill(null);
      for (const reset of resets) reset();
      hits.textContent = "0";
      panel.hidden = true;
      list.hidden = false;
      nav.hidden = false;
      show(0);
    });

    show(0);

    return fragment([
      settings.hint ? hint(settings.hint, "list-check") : null,
      el("div", { className: "quiz" }, [
        el("div", { className: "q-bar" }, [
          el("span", { className: "q-step" }, [`${STRINGS.quizQuestion} `, step, ` ${STRINGS.quizOf} `, el("b", { text: String(total) })]),
          el("span", { className: "q-track", attrs: { "aria-hidden": "true" } }, fill),
          el("span", { className: "q-score" }, [icon("circle-check"), " ", hits, ` ${STRINGS.quizHits}`])
        ]),
        list,
        nav,
        panel
      ])
    ]);
  }

  /** The document title the browser tab shows. */
  function pageTitle(meta) {
    const settings = meta || {};
    return settings.lesson
      ? `${STRINGS.title} - الوحدة ${settings.module} - الدرس ${settings.lesson}`
      : `${STRINGS.title} - الوحدة ${settings.module}`;
  }

  /**
   * Builds the whole page from one object, so a lesson's content sits in a
   * single place and its markup carries nothing but an empty <main>.
   *
   *   SAMAI.mount({
   *     module: 6, moduleTitle: "…", lesson: 1, lessonTitle: "…",
   *     introduction: "…",
   *     sections: {
   *       trends: { nav: "الاتجاهات", title: "…", subtitle: "…", nodes: … },
   *       aside:  { title: "…", nodes: … }        // no nav: off the indicator
   *     },
   *     conclusion: { cards, text, references }
   *   })
   *
   * The hero opens <main> and the conclusion closes it; the sections fall in
   * between, in the order the object declares them. Anything already inside
   * <main> is replaced.
   *
   * A unit overview is the same call without a lesson number or a conclusion,
   * and with unitOverview() standing in for the sections it shares with the
   * other five.
   */
  // Which lesson this page is. Set by mount() and read by the reading report,
  // the one piece of chrome behaviour that needs to name the page it is on.
  let PAGE = null;

  function mount(config) {
    // Every unit overview carries the same lesson title, so it need not say so.
    const settings = Object.assign({}, config);
    if (!settings.lessonTitle) settings.lessonTitle = STRINGS.overview;
    PAGE = settings;

    const sections = settings.sections || {};
    const main = document.querySelector("main");

    document.title = pageTitle(settings);

    const chrome = fragment([brandBar(settings), lessonNav(sections, Boolean(settings.conclusion)), progressBar()]);
    if (main) main.before(chrome);
    else document.body.prepend(chrome);

    if (main) {
      main.replaceChildren(fragment([
        hero(settings),
        Object.entries(sections).map(([id, sectionConfig]) => section(id, sectionConfig)),
        settings.conclusion ? conclusion(settings.conclusion) : null
      ]));
    }

    init();
    return main;
  }

  /* ========================================================================
     4 · THE MOCK APPLICATION AND ITS TOUR
     One application, shown by every unit that shows one, so a learner taught
     its parts in unit 1 recognises the same parts in unit 6. The window is
     inert: it is a picture of an application, not one, and a lesson moves it
     by describing the state it should be in rather than by pressing it.

     The tour around it is separate, and knows nothing about applications: it
     lights a part, says what that part is, and lets the learner walk. A
     lesson supplies the stage and answers for what each step shows.
     ======================================================================== */

  /** One file the learner has attached, as the application shows it. */
  function appFile(file) {
    return el("span", { className: "win-file" }, [
      icon(file.icon, "paperclip"),
      el("span", { text: asText(file.label) })
    ]);
  }

  /**
   * One turn in the conversation. A reply with nothing to say yet is the
   * skeleton: the window shows that an answer is coming without inventing
   * its words.
   */
  function appMessage(message) {
    const from = message.from === "assistant" ? "is-assistant" : "is-user";
    if (message.pending) {
      return el("div", { className: `win-msg ${from} is-pending` }, [1, 2, 3, 4].map(() => el("i")));
    }
    return el("div", { className: `win-msg ${from}` }, [
      asArray(message.files).length
        ? el("span", { className: "win-msg-files" }, message.files.map(appFile))
        : null,
      el("p", { text: asText(message.text) })
    ]);
  }

  /**
   * A destination in the sidebar, for the lessons that name them rather than
   * leaving them as the bars unit 1 shows. Every one is addressable, because
   * a tour step points at one by name rather than by its place in the list.
   *
   *   { key: "projects", icon: "folder", label: "المشاريع", on: true }
   *   { group: "المشاريع" }                        a heading over the next few
   */
  function appItem(item) {
    if (item.group !== undefined) return el("div", { className: "win-group", text: asText(item.group) });
    return el("div", {
      className: item.on ? "win-item is-on" : "win-item",
      attrs: { "data-part": item.key }
    }, [icon(item.icon), el("span", { text: asText(item.label) })]);
  }

  /**
   * The window. Its title bar carries the application's name and, where a
   * lesson is teaching the difference, the switch between answering and
   * working. The sidebar and the screen are the lesson's to fill.
   *
   *   appWindow({
   *     name: "…",
   *     agents: [{ label: "…" }, { label: "…" }],   the switch, first one on
   *     agentsLabel: "…",
   *     threadsLabel: "…",
   *     newChat: "…",
   *     items: [ … ],                               named destinations, or
   *     side: node,                                 a sidebar of your own
   *     account: { name: "…", detail: "…" },
   *     top: "…",                                   a line above the screen
   *     bleed: true                                 screen paints to the edge
   *   }, screen)
   *
   * Given neither `items` nor `side` the sidebar is four bars: unit 1 is
   * teaching what the parts of an application are, not what they are called.
   * `side: false` drops it altogether, for the lessons showing one exchange
   * rather than the application it happened in.
   *
   * The screen keeps the window's own inset, so what a lesson puts on it
   * needs no padding of its own. `bleed` takes that inset away, for a screen
   * whose surface is the point — a tinted panel has to reach the frame or it
   * reads as a card floating inside the window rather than as the screen.
   */
  function appWindow(data, screen) {
    const settings = data || {};
    const agents = asArray(settings.agents);
    const account = settings.account;

    return el("div", {
      className: classNames("win", settings.className),
      attrs: { "data-part": "app", inert: true, "aria-hidden": "true" }
    }, [
      el("header", { className: "win-top" }, [
        el("div", { className: "win-brand" }, [
          el("span", { className: "win-dots" }, [el("i"), el("i"), el("i")]),
          el("span", { className: "win-name", text: asText(settings.name) })
        ]),
        agents.length ? el("div", {
          className: "win-agents",
          attrs: { "data-part": "agent", "aria-label": settings.agentsLabel }
        }, agents.map((agent, index) => el("span", {
          className: (agent.on === undefined ? index === 0 : agent.on) ? "win-agent is-on" : "win-agent",
          text: asText(agent.label)
        }))) : null,
        el("span", { className: "win-top-end" })
      ]),
      el("div", { className: settings.side === false ? "win-body is-bare" : "win-body" }, [
        settings.side === false ? null : el("aside", { className: "win-side", attrs: { "aria-label": settings.threadsLabel } }, [
          settings.newChat ? el("span", { className: "win-new" }, [icon("plus"), el("span", { text: settings.newChat })]) : null,
          settings.items ? asArray(settings.items).map(appItem)
            : settings.side || [0, 1, 2, 3].map((index) => el("span", {
              className: index === 0 ? "win-thread is-current" : "win-thread"
            })),
          el("span", { className: "win-fill" }),
          account ? el("span", {
            className: account.on ? "win-account is-on" : "win-account",
            attrs: { "data-part": "account" }
          }, [
            el("span", { className: "win-avatar" }, icon("user")),
            el("span", { className: "win-account-text" }, [
              el("b", { text: asText(account.name) }),
              el("small", { text: asText(account.detail) })
            ]),
            icon("gear")
          ]) : null
        ]),
        el("div", { className: "win-main" }, [
          settings.top ? el("div", { className: "win-screen-top" }, [
            typeof settings.top === "string" ? el("span", { text: settings.top }) : settings.top,
            icon("ellipsis")
          ]) : null,
          el("div", { className: settings.bleed ? "win-screen is-bleed" : "win-screen" }, screen)
        ])
      ])
    ]);
  }

  /** One closed picker in the composer, showing the choice it is on. */
  function appPicker(item) {
    const current = item.options.find((option) => option.label === item.value) || item.options[0];
    return el("div", {
      className: "win-picker",
      attrs: { "data-part": item.key, "data-menu": item.key }
    }, [
      el("span", { className: "win-picker-button", attrs: { "aria-label": item.label } }, [
        el("span", { className: "win-picker-value", text: asText(current.chip) }),
        icon("chevron-down")
      ]),
      el("div", { className: "win-menu" }, item.options.map((option) => el("span", {
        className: option.label === item.value ? "win-option is-current" : "win-option",
        attrs: { "data-value": option.label }
      }, [icon("check"), el("span", { text: asText(option.label) })])))
    ]);
  }

  /**
   * The row the learner writes in: the tools and their menu, the field being
   * typed into, the pickers that choose how the answer is made, and send.
   *
   * It answers to the state it should be showing rather than to presses, so
   * a tour can put it anywhere by describing where:
   *
   *   const composer = appComposer({ placeholder, tools, pickers, sendLabel });
   *   composer.show({ prompt: "…", files: [ … ], picks: { model: "…" },
   *                   open: "tools", choose: "إرفاق ملف" });
   *
   * `node` is what goes on the page.
   */
  function appComposer(data) {
    const settings = data || {};
    const pickers = asArray(settings.pickers);

    const files = el("div", { className: "win-files", hidden: true });
    const placeholder = el("span", { className: "win-placeholder", text: asText(settings.placeholder) });
    const typed = el("span", { className: "win-typed" });
    const field = el("span", { className: "win-field" }, [placeholder, typed, el("i", { className: "win-caret" })]);

    const tools = el("div", {
      className: "win-tools",
      attrs: { "data-part": "tools", "data-menu": "tools" }
    }, [
      el("span", { className: "win-plus" }, icon("plus")),
      el("div", { className: "win-menu" }, asArray(settings.tools).map((tool) => el("span", {
        className: "win-option",
        attrs: { "data-tool": tool.label }
      }, [icon(tool.icon, "wrench"), el("span", { text: asText(tool.label) })])))
    ]);

    const node = el("div", { className: "win-composer", attrs: { "data-part": "composer" } }, [
      files,
      el("div", { className: "win-row" }, [
        tools,
        field,
        pickers.length ? el("div", { className: "win-pickers" }, pickers.map(appPicker)) : null,
        el("span", {
          className: "win-send",
          attrs: { "data-part": "send", "aria-label": settings.sendLabel }
        }, icon("paper-plane"))
      ])
    ]);

    const holders = [tools, ...node.querySelectorAll(".win-picker")];
    let typing = null;
    let written = null;

    /** Typed a character at a time, so the learner watches it appear. */
    function write(text) {
      window.clearInterval(typing);
      typing = null;
      placeholder.hidden = Boolean(text);
      field.classList.toggle("is-typing", Boolean(text));
      if (!text || REDUCED_MOTION) {
        typed.textContent = text;
        return;
      }
      typed.textContent = "";
      let count = 0;
      const pace = Math.max(16, Math.min(45, Math.round(900 / text.length)));
      typing = window.setInterval(() => {
        count += 1;
        typed.textContent = text.slice(0, count);
        if (count < text.length) return;
        window.clearInterval(typing);
        typing = null;
      }, pace);
    }

    function show(at) {
      const state = at || {};
      const prompt = asText(state.prompt);
      const picks = state.picks || {};

      for (const item of pickers) {
        const holder = node.querySelector(`[data-menu="${item.key}"]`);
        const chosen = item.options.find((option) => option.label === picks[item.key]) || item.options[0];
        holder.querySelector(".win-picker-value").textContent = asText(chosen.chip);
        for (const option of holder.querySelectorAll(".win-option")) {
          option.classList.toggle("is-current", option.dataset.value === chosen.label);
        }
      }

      for (const holder of holders) holder.classList.toggle("is-open", holder.dataset.menu === state.open);
      for (const option of node.querySelectorAll("[data-tool]")) {
        option.classList.toggle("is-current", option.dataset.tool === state.choose);
      }

      if (written !== prompt) write(prompt);
      written = prompt;

      const attached = asArray(state.files);
      files.replaceChildren(...attached.map(appFile));
      files.hidden = attached.length === 0;
    }

    return { node, show, write };
  }

  /**
   * A turn in a conversation, as the application's screen shows it: who is
   * speaking, then what they said. `you` turns the row round and tints the
   * bubble, so the two sides of an exchange read apart without either being
   * labelled.
   *
   *   turn("you", el("p", { text: "…" }))
   *   turn("app", [ … ])
   */
  function turn(who, children) {
    return el("div", { className: who === "you" ? "msg is-you" : "msg" }, [
      el("span", { className: "avatar" }, who === "you" ? null : icon("robot")),
      el("div", { className: "bubble" }, children)
    ]);
  }

  /**
   * A guided tour of whatever the lesson has built. The tour moves the
   * spotlight, its label, the caption and the dots; the lesson answers for
   * what the stage shows at each step.
   *
   *   tour({
   *     lead: "…",                                  a line above the stage
   *     note: "…",                                  a line below it
   *     stage: node,
   *     steps: [{ target: "[data-part='send']", label: "…", text: "…" }],
   *     show(index, again) { … },                   puts the stage in state
   *     labels: { previous, next, restart, step, steps, spot }
   *   })
   *
   * A step with no target dims nothing, for the one that introduces the whole
   * picture rather than naming a piece of it. Those steps are also unnumbered.
   */
  function tour(data) {
    const settings = data || {};
    const steps = asArray(settings.steps);
    const labels = settings.labels || {};
    const stage = settings.stage;

    let counted = 0;
    const numbers = steps.map((step) => (step.target ? (counted += 1) : 0));

    const spot = el("div", {
      className: "sim-spot",
      attrs: { "aria-hidden": "true", title: labels.spot }
    });
    const tag = el("div", { className: "sim-tag", attrs: { "aria-hidden": "true" } });
    const frame = el("div", { className: "sim-stage" }, [stage, spot, tag]);

    const number = el("span", { className: "sim-number" });
    const caption = el("p", {
      className: "sim-text",
      attrs: { "aria-live": "polite", "aria-atomic": "true" }
    });
    // Built before the first step runs, because that step decides whether the
    // badge is there and the row has to exist to be told.
    const captionRow = el("div", { className: "sim-caption" }, [number, caption]);
    const previous = el("button", { type: "button" }, iconText("chevron-right", labels.previous));
    const next = el("button", { type: "button" });
    const dots = steps.map((step, index) => (numbers[index] ? el("button", {
      type: "button",
      attrs: { "aria-label": `${asText(labels.step)} ${numbers[index]}` }
    }) : null));

    let current = 0;
    let placing = null;
    let settling = null;

    /** Lays the spotlight over the part this step names, and labels it. */
    function place(step) {
      const target = frame.querySelector(step.target);
      if (!target || !target.getClientRects().length) {
        spot.classList.remove("is-on");
        tag.classList.remove("is-on");
        return;
      }

      const base = frame.getBoundingClientRect();
      const box = target.getBoundingClientRect();
      let { top, left, right, bottom } = box;

      // An open menu belongs to the part it hangs off, so the light covers
      // both rather than stopping at the control.
      const menu = target.classList.contains("is-open") ? target.querySelector(".win-menu") : null;
      if (menu) {
        const area = menu.getBoundingClientRect();
        top = Math.min(top, area.top);
        left = Math.min(left, area.left);
        right = Math.max(right, area.right);
        bottom = Math.max(bottom, area.bottom);
      }

      const y = top - base.top - 7;
      const x = left - base.left - 7;
      const width = right - left + 14;
      const height = bottom - top + 14;

      // Measured pixels, so the overlay is placed physically; the
      // translateX(-100%) in the stylesheet keeps the label anchored to the
      // reading edge of the spotlight in RTL.
      spot.style.top = `${y}px`;
      spot.style.left = `${x}px`;
      spot.style.width = `${width}px`;
      spot.style.height = `${height}px`;
      spot.classList.add("is-on");

      tag.textContent = asText(step.label);
      tag.classList.toggle("is-on", Boolean(step.label));
      // Above the spotlight when the stage has room, otherwise just inside
      // it — the stage clips its overflow, so neither can escape.
      const above = y - tag.offsetHeight - 5;
      tag.style.top = `${above >= 0 ? above : y + 6}px`;
      tag.style.left = `${x + width}px`;
    }

    function go(index) {
      current = index < 0 || index > steps.length - 1 ? 0 : index;
      const step = steps[current];
      const last = current === steps.length - 1;

      // The lesson puts the stage into this step, reading the step out of
      // its own list. It is handed a way to ask for the light to be laid
      // again, for a stage that settles a moment after it is built.
      //
      // A step whose stage has to go and fetch something says so by handing
      // back a promise: the walk holds its next button until that settles,
      // because there is nothing yet to walk on to.
      const building = settings.show ? settings.show(current, () => place(step)) : null;
      const waiting = building && typeof building.then === "function";

      // Only the steps that light a part are numbered. A step that opens or
      // closes the walk is talking about the whole picture, so it drops the
      // badge rather than wearing a number that names nothing.
      const numbered = Boolean(numbers[current]);
      number.hidden = !numbered;
      number.textContent = numbered ? String(numbers[current]) : "";
      captionRow.classList.toggle("is-plain", !numbered);
      caption.textContent = asText(step.text);
      dots.forEach((dot, at) => {
        if (!dot) return;
        dot.classList.toggle("is-on", at === current);
        dot.classList.toggle("is-done", at < current);
      });
      previous.disabled = current === 0;
      next.replaceChildren(textIcon(
        last ? labels.restart : labels.next,
        last ? "rotate-right" : "chevron-left"
      ));

      spot.classList.remove("is-on");
      tag.classList.remove("is-on");
      next.disabled = waiting;
      if (!step.target) return;

      // A menu opens and the stage re-lays out on this same tick; measure
      // once that has settled. A timer rather than rAF, so placement still
      // happens in a background tab.
      const lay = () => {
        window.clearTimeout(placing);
        placing = window.setTimeout(() => place(step), 60);
      };
      if (!waiting) { lay(); return; }
      const asked = current;
      building.then(() => {
        if (asked !== current) return;
        next.disabled = false;
        lay();
      });
    }

    previous.addEventListener("click", () => go(current - 1));
    next.addEventListener("click", () => go(current + 1));
    // The light is a shortcut, not a second control: it repeats what next
    // does, which is why it stays hidden from assistive technology rather
    // than being announced as another way through the same walk.
    spot.addEventListener("click", () => {
      if (!next.disabled) go(current + 1);
    });
    dots.forEach((dot, index) => dot && dot.addEventListener("click", () => go(index)));
    window.addEventListener("resize", () => {
      window.clearTimeout(settling);
      settling = window.setTimeout(() => {
        if (steps[current].target) place(steps[current]);
      }, 120);
    }, { passive: true });

    go(0);

    return el("div", { className: classNames("sim", settings.className) }, [
      settings.lead ? el("p", { className: "sim-lead", text: settings.lead }) : null,
      frame,
      captionRow,
      el("div", { className: "sim-steps" }, [
        previous,
        el("div", { className: "sim-dots", attrs: { role: "group", "aria-label": labels.steps } }, dots),
        next
      ]),
      settings.note ? el("p", { className: "sim-note", text: settings.note }) : null
    ]);
  }

  /* ========================================================================
     5 · SHARED CHROME BEHAVIOUR
     ======================================================================== */

  /**
   * Fullscreen toggle, plus the F shortcut. Ctrl+F and Cmd+F stay with the
   * browser, and the key is ignored while the learner is typing.
   */
  function initFullscreen() {
    const button = document.querySelector(".fullscreen");
    if (!button) return;

    const isActive = () => document.fullscreenElement !== null;

    const sync = () => {
      const active = isActive();
      const label = active ? STRINGS.exitFullscreen : STRINGS.fullscreen;
      button.setAttribute("aria-label", label);
      button.title = label;
      button.replaceChildren(icon(active ? "compress" : "expand"));
    };

    const toggle = () => {
      const pending = isActive()
        ? document.exitFullscreen()
        : document.documentElement.requestFullscreen();
      pending.catch(sync);
    };

    button.addEventListener("click", toggle);

    document.addEventListener("keydown", (event) => {
      if (event.key !== "f" && event.key !== "F" && event.key !== "ب") return;
      if (event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
      const target = event.target;
      if (target instanceof Element && target.closest("input, textarea, select, [contenteditable]:not([contenteditable='false'])")) return;
      event.preventDefault();
      toggle();
    });

    document.addEventListener("fullscreenchange", sync);
    sync();
  }

  /**
   * Highlights the indicator item for the section being read and fills the
   * reading progress bar. A section with no item of its own — the hero —
   * leaves the previous one active, so no lesson needs a lookup table.
   */
  function initNav() {
    const links = [...document.querySelectorAll(".nav-link")];
    const progress = document.querySelector(".progress");
    const sections = [...document.querySelectorAll(".section")];
    if (!sections.length) return;

    const fill = progress ? progress.querySelector("i") : null;
    const targets = new Set(links.map((link) => link.dataset.target));
    const first = links.length ? links[0].dataset.target : "";

    const update = () => {
      const line = window.innerHeight * 0.45;
      let current = first;
      for (const section of sections) {
        if (section.getBoundingClientRect().top <= line && targets.has(section.id)) {
          current = section.id;
        }
      }
      for (const link of links) {
        link.classList.toggle("is-active", link.dataset.target === current);
      }

      if (!fill) return;
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      const percent = scrollable > 0 ? Math.min(100, Math.max(0, (window.scrollY / scrollable) * 100)) : 100;
      fill.style.width = `${percent}%`;
      progress.setAttribute("aria-valuenow", String(Math.round(percent)));
    };

    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update, { passive: true });
    update();
  }

  /** Reveals each section as it scrolls into view. */

/* ==========================================================================
   How this lesson is drawn. Nothing below says anything to the learner: every
   word on the page comes from the content above.
   ========================================================================== */

const scripts = (S) => {
  const { el, svg, fragment, icon, iconText, textIcon, note, REDUCED_MOTION,
    appWindow, appComposer, appMessage, appFile, tour } = S;

  /* ====================================================================
     1 · The guided tour of the window.
     ==================================================================== */

  /**
   * The tour. Every step declares the state it wants rather than the change
   * it makes, and the window is rebuilt by replaying every step up to the
   * current one — so jumping backwards, or straight to a dot, lands on
   * exactly the same picture as walking there.
   *
   * The window, the composer and the walk itself are the shared ones; what
   * belongs to this lesson is only the reading of its own steps.
   */
  function appTour(data) {
    const steps = data.tour.steps;

    const empty = el("p", { className: "win-empty", text: data.emptyText });
    const messages = el("div", { className: "win-messages", attrs: { "data-part": "messages" } }, empty);
    const composer = appComposer(data);
    const stage = appWindow(data, el("div", { className: "win-chat" }, [messages, composer.node]));

    /** The window as steps 0..index leave it. Derived, never accumulated. */
    function stateAt(index) {
      const at = { picks: {}, prompt: "", files: [], messages: [] };
      data.pickers.forEach((item) => { at.picks[item.key] = item.value; });
      for (let i = 0; i <= index; i += 1) {
        const step = steps[i];
        if (step.prompt !== undefined) at.prompt = step.prompt;
        if (step.attach) at.files = at.files.concat([step.attach]);
        if (step.pick) Object.assign(at.picks, step.pick);
        if (step.send) {
          at.messages = at.messages.concat([{ text: at.prompt, files: at.files }]);
          at.prompt = "";
          at.files = [];
        }
        if (step.respond) at.messages = at.messages.concat([{ from: "assistant", pending: true }]);
      }
      return at;
    }

    return tour({
      lead: data.lead,
      note: data.note,
      stage,
      labels: {
        previous: data.tour.previousLabel,
        next: data.tour.nextLabel,
        restart: data.tour.restartLabel,
        step: data.tour.stepLabel,
        steps: data.tour.stepsLabel
      },
      steps: steps.map((step) => ({
        target: step.target ? `[data-part="${step.target}"]` : null,
        label: step.label,
        text: step.text
      })),
      show(index) {
        const step = steps[index];
        const at = stateAt(index);
        composer.show({
          prompt: at.prompt,
          files: at.files,
          picks: at.picks,
          open: step.open,
          choose: step.choose
        });
        empty.hidden = at.messages.length > 0;
        messages.replaceChildren(empty, ...at.messages.map(appMessage));
      }
    });
  }

  /* ====================================================================
     2 · The four components.
     ==================================================================== */

  /**
   * A flat drawing, given as shape data so the artwork stays content and
   * takes its colours from the card's tone. Unlike the shared drawing()
   * helper these carry a label: the drawing says something the card's
   * words do not.
   */
  function diagram(label, shapes) {
    return svg("svg", {
      className: "dg",
      attrs: { viewBox: "0 0 220 100", role: "img", "aria-label": label }
    }, shapes.map(({ tag, cls, ...attrs }) => svg(tag, { className: cls, attrs })));
  }

  function partCards(examplesLabel, parts) {
    return el("div", { className: "parts" }, parts.map((part) => el("article", {
      className: `part ${part.tone}`
    }, [
      el("div", { className: "part-figure" }, diagram(part.diagramAlt, part.diagram)),
      el("div", { className: "part-head" }, [
        el("span", {}, icon(part.icon)),
        el("h3", { text: `${part.title} (${part.term})` })
      ]),
      el("p", { className: "part-text", text: part.text }),
      el("p", { className: "part-examples-title", text: examplesLabel }),
      el("ul", { className: "part-examples" }, part.examples.map((example) => el("li", { text: example })))
    ])));
  }

  /* ====================================================================
     3 · The journey behind the window.
     ==================================================================== */

  /** The narration panel: the step's number beside the step's words. */
  function sayPanel(className) {
    const key = el("span", { className: "say-key", attrs: { "aria-hidden": "true" } });
    const body = el("p");
    const panel = el("div", { className: className, attrs: { "aria-live": "polite" } }, [key, body]);
    return { panel, key, body };
  }

  /**
   * What happens between pressing send and the answer appearing. The
   * window from the section above carries on where the tour left it — the
   * request sent, nothing back yet — and the engine panel beside it lights
   * each component as the request reaches it.
   */
  function requestJourney(data) {
    const screen = data.screen;
    const steps = data.steps;
    const keys = data.nodes.map((item) => item.key);

    const answer = el("div", {
      className: "win-msg is-assistant",
      attrs: { "data-chat": "answer" }
    }, [
      el("p", {}, el("b", { text: screen.answerTitle })),
      el("ul", { className: "answer" }, screen.answerPoints.map((point) => el("li", { text: point })))
    ]);
    const statusIcon = el("span", { className: "status-icon" });
    const statusText = el("span", { className: "status-text" });
    // One line for both halves of the same fact: what the engine is doing,
    // and that it has not finished doing it.
    const status = el("div", { className: "status", attrs: { "data-chat": "typing" } }, [
      statusIcon,
      statusText,
      el("span", { className: "status-dots", attrs: { "aria-hidden": "true" } }, [el("i"), el("i"), el("i")])
    ]);
    const messages = el("div", { className: "win-messages" }, [
      el("div", { className: "win-msg is-user", attrs: { "data-chat": "prompt" } }, [
        el("span", { className: "win-msg-files" }, appFile(screen.attachment)),
        el("p", { text: screen.prompt })
      ]),
      status,
      answer
    ]);
    const composer = el("div", { className: "win-composer" },
      el("div", { className: "win-row" }, [
        el("span", { className: "win-tools" }, el("span", { className: "win-plus" }, icon("plus"))),
        el("span", { className: "win-field" },
          el("span", { className: "win-placeholder", text: screen.placeholder })),
        el("span", { className: "win-send", attrs: { "aria-label": screen.sendLabel } }, icon("paper-plane"))
      ]));

    const says = [];
    const nodes = data.nodes.map((item) => {
      const say = sayPanel("say");
      says.push(say);
      return el("li", { className: `node ${item.tone}` }, [
        el("span", { className: "node-pulse", attrs: { "aria-hidden": "true" } }),
        el("div", { className: "node-head" }, [
          el("span", { className: "node-icon" }, icon(item.icon)),
          el("div", { className: "node-text" }, [
            el("b", { text: item.title }),
            item.description ? el("span", { text: item.description }) : null
          ])
        ]),
        item.tags ? el("div", { className: "node-tags" }, item.tags.map((tag) => el("span", {
          className: "node-tag",
          attrs: { "data-tag": tag.key }
        }, [icon(tag.icon), el("span", { text: tag.label })]))) : null,
        say.panel
      ]);
    });

    const full = sayPanel("say journey-say");
    const view = el("div", { className: "journey-view" }, el("ol", { className: "journey-track" }, nodes));
    const tags = [];
    nodes.forEach((node) => tags.push(...node.querySelectorAll(".node-tag")));
    const chats = [messages.querySelector("[data-chat=prompt]"), status, answer];

    const previous = el("button", { type: "button" }, iconText("chevron-right", data.previousLabel));
    const next = el("button", { type: "button" });
    const keyButtons = steps.map((step, index) => el("button", {
      type: "button",
      attrs: { "aria-label": `${index + 1}: ${step.title}` }
    }));

    // Opens on the state the tour above ended in — full window, still
    // thinking — and splits into the two panes when the learner steps on.
    const element = el("section", {
      className: "journey is-full",
      attrs: { "aria-label": data.ariaLabel }
    }, [
      el("div", { className: "journey-grid" }, [
        el("div", { className: "journey-screen" }, [
          el("div", { className: "journey-stage" }, appWindow(screen, el("div", { className: "win-chat" }, [messages, composer]))),
          full.panel
        ]),
        el("div", { className: "journey-engine" }, [
          el("p", { className: "journey-engine-title" }, [icon("gears"), el("span", { text: data.engineLabel })]),
          view
        ])
      ]),
      el("div", { className: "sim-steps" }, [
        previous,
        el("div", { className: "sim-dots", attrs: { role: "group", "aria-label": data.stepsLabel } }, keyButtons),
        next
      ]),
      el("p", { className: "sim-note", text: data.note })
    ]);

    let current = 0;

    function apply(index, animate) {
      current = Math.max(0, Math.min(steps.length - 1, index));
      const step = steps[current];
      // The path draws itself: every node up to the active one stays lit,
      // and every connector behind it with them. On a full-window step
      // nothing is reached yet.
      const reached = step.full ? -1 : keys.indexOf(step.at);
      const active = step.activeTags || [];
      const chat = step.chat;

      element.classList.toggle("is-full", Boolean(step.full));
      full.panel.classList.toggle("is-on", Boolean(step.full));
      full.key.textContent = step.full ? String(current + 1) : "";
      full.body.textContent = step.full ? step.text : "";

      nodes.forEach((node, position) => {
        const isActive = keys[position] === step.at;
        node.classList.toggle("is-on", position <= reached);
        node.classList.toggle("is-active", isActive);
        node.classList.toggle("is-flow-on", position < reached);
        says[position].panel.classList.toggle("is-on", isActive);
        says[position].key.textContent = isActive ? String(current + 1) : "";
        says[position].body.textContent = isActive ? step.text : "";
      });
      tags.forEach((tag) => tag.classList.toggle("is-on", active.includes(tag.dataset.tag)));
      // The tone is set before the chat pass, which owns the is-on class
      // this shares with the messages — reversing the two would wipe it.
      status.className = step.status ? `status ${step.status.tone}` : "status";
      statusIcon.replaceChildren(step.status ? icon(step.status.icon) : "");
      statusText.textContent = step.status ? step.status.text : "";
      chats.forEach((one) => one.classList.toggle("is-on", chat.includes(one.dataset.chat)));

      keyButtons.forEach((button, index_) => {
        button.classList.toggle("is-on", index_ === current);
        button.classList.toggle("is-done", index_ < current);
        if (index_ === current) button.setAttribute("aria-current", "true");
        else button.removeAttribute("aria-current");
      });
      previous.disabled = current === 0;
      const last = current === steps.length - 1;
      next.replaceChildren(textIcon(
        last ? data.restartLabel : data.nextLabel,
        last ? "rotate-right" : "chevron-left"
      ));

      const node = nodes[keys.indexOf(step.at)];
      if (node) {
        view.scrollTo({
          top: node.offsetTop - (view.clientHeight - node.offsetHeight) / 2,
          behavior: animate && !REDUCED_MOTION ? "smooth" : "auto"
        });
      }
    }

    previous.addEventListener("click", () => apply(current - 1, true));
    next.addEventListener("click", () => apply(current === steps.length - 1 ? 0 : current + 1, true));
    keyButtons.forEach((button, index) => button.addEventListener("click", () => apply(index, true)));

    apply(0, false);
    return element;
  }


  return { appTour, note, partCards, requestJourney };
};

SAMAI.mount(Object.assign({ module: 1, moduleTitle: "الذكاء الاصطناعي في قطاع التعليم", lesson: 2, lessonTitle: meta.title }, content(SAMAI)));
})();
    </script>
