/* Design tokens. Every colour, space and radius in the system starts here. */
:root{
  --samai-primary:#243771;
  --samai-primary-2:#2b4785;
  --samai-teal:#3fae9a;
  --samai-teal-dark:#167866;
  --samai-green:#73c267;
  --samai-ink:#2a3344;
  --samai-muted:#5d6875;
  --samai-page:#f4f8fb;
  --samai-surface:#fff;
  --samai-surface-soft:#f7fafc;
  --samai-border:#2437711c;
  --samai-danger:#c0392b;
  --samai-warning:#e0a128;
  --samai-success:#1e8a6b;
  --samai-dark:#0c1828;
  --samai-space-1:4px;
  --samai-space-2:8px;
  --samai-space-3:12px;
  --samai-space-4:16px;
  --samai-space-5:20px;
  --samai-space-6:24px;
  --samai-space-7:28px;
  --samai-space-8:32px;
  --samai-space-10:40px;
  --samai-space-12:48px;
  --samai-space-16:64px;
  --samai-radius-sm:12px;
  --samai-radius-md:18px;
  --samai-radius-lg:24px;
  --samai-shadow:0 14px 30px #24377112,0 2px 8px #06111d08;
  --samai-shadow-hover:0 22px 46px #24377124;
  --samai-width:1120px;
  --samai-gutter:clamp(20px,4vw,48px);
}

/* Document defaults, focus handling and the skip link. */

*,
*::before,
*::after{box-sizing:border-box}

html{scroll-behavior:smooth}

html,
body{min-height:100%;margin:0;overflow-x:clip}

body{
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  color:var(--samai-ink);
  line-height:1.85;
  background:
    radial-gradient(1100px 560px at 92% -12%,#3fae9a12,transparent 60%),
    radial-gradient(900px 500px at -8% 34%,#73c2670f,transparent 55%),
    linear-gradient(180deg,#fbfdff 0%,var(--samai-page) 100%);
}

button,
input,
textarea,
select{font:inherit}

button,
a,
[role="button"]{
  touch-action:manipulation;
  -webkit-tap-highlight-color:#2437711f;
}

button:not([hidden]),
[role="button"]{min-height:44px}

a{color:var(--samai-primary)}

:focus-visible{
  outline:3px solid #3fae9a73;
  outline-offset:3px;
}

[hidden]{display:none!important}

.samai-skip-link{
  position:fixed;
  inset-block-start:var(--samai-space-2);
  inset-inline-start:var(--samai-space-2);
  z-index:1000;
  padding:9px 14px;
  border-radius:10px;
  background:#fff;
  color:var(--samai-primary);
  font-weight:900;
  text-decoration:none;
  transform:translateY(-180%);
  box-shadow:var(--samai-shadow);
}

.samai-skip-link:focus{transform:none}

/* Design primitives for lesson-local custom components.
   Pairs with core/primitives.js. A lesson composes these and writes bespoke CSS
   only for what they cannot express. */

/* ── tones ───────────────────────────────────────────────────────────────── */

.s-tone-primary{--s-accent:var(--samai-primary);--s-accent-2:var(--samai-teal)}
.s-tone-teal{--s-accent:var(--samai-teal);--s-accent-2:var(--samai-green)}
.s-tone-green{--s-accent:var(--samai-green);--s-accent-2:var(--samai-teal)}
.s-tone-warning{--s-accent:var(--samai-warning);--s-accent-2:#d9614f}
.s-tone-danger{--s-accent:var(--samai-danger);--s-accent-2:#8f3327}
.s-tone-neutral{--s-accent:var(--samai-muted);--s-accent-2:var(--samai-ink)}

/* ── panel ───────────────────────────────────────────────────────────────── */

.s-panel{
  --s-accent:var(--samai-primary);
  --s-accent-2:var(--samai-teal);
  position:relative;
  padding:var(--samai-space-6);
  overflow:hidden;
  border:1.5px solid var(--samai-border);
  border-radius:var(--samai-radius-lg);
  background:var(--samai-surface);
  box-shadow:var(--samai-shadow);
}

.s-panel--soft{background:linear-gradient(180deg,var(--samai-surface),var(--samai-surface-soft))}

.s-panel--dark{
  border-color:#ffffff24;
  background:linear-gradient(140deg,#0d1b2f,#16344f);
  color:#fff;
  box-shadow:0 16px 36px #0d1b2f33;
}

.s-panel--dark::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(520px 250px at 88% -10%,#3fae9a38,transparent 65%),
    radial-gradient(420px 220px at 5% 110%,#73c26721,transparent 65%);
}

.s-panel--dark>*{position:relative;z-index:2}

.s-rule-top::before{
  content:"";
  position:absolute;
  inset-block-start:0;
  inset-inline:0;
  height:4px;
  background:linear-gradient(90deg,var(--samai-green),var(--samai-teal),var(--samai-primary));
}

.s-lift{transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}
.s-lift:hover{border-color:#3fae9a73;box-shadow:var(--samai-shadow-hover);transform:translateY(-6px)}

.s-center{text-align:center}

/* ── icon tile ───────────────────────────────────────────────────────────── */

.s-icon-tile{
  display:grid;
  place-items:center;
  border-radius:var(--samai-radius-sm);
  background:linear-gradient(135deg,var(--s-accent,var(--samai-primary)),var(--s-accent-2,var(--samai-teal)));
  color:#fff;
  box-shadow:0 8px 18px #2437712e;
}

.s-icon-tile--sm{width:38px;height:38px;font-size:15px}
.s-icon-tile--md{width:48px;height:48px;font-size:19px}
.s-icon-tile--lg{width:58px;height:58px;border-radius:var(--samai-radius-md);font-size:22px}

/* ── stat ────────────────────────────────────────────────────────────────── */

.s-stat{display:grid;justify-items:center;gap:var(--samai-space-2)}
.s-stat .s-icon-tile{margin-block-end:var(--samai-space-1)}

.s-stat-value{
  color:var(--samai-primary);
  font-size:clamp(22px,2.4vw,30px);
  font-weight:900;
  line-height:1.15;
  letter-spacing:-.01em;
}

.s-stat-label{color:var(--samai-muted);font-size:12.5px;font-weight:800;line-height:1.75}

.s-sep{
  width:34px;
  height:3px;
  border-radius:2px;
  background:linear-gradient(90deg,var(--samai-green),var(--samai-teal));
}

/* ── layout ──────────────────────────────────────────────────────────────── */

.s-grid{display:grid;gap:var(--samai-space-3)}
.s-grid--1{grid-template-columns:minmax(0,1fr)}
.s-grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.s-grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.s-grid--4{grid-template-columns:repeat(4,minmax(0,1fr))}
.s-grid--compact{gap:var(--samai-space-2)}

.s-cluster{display:flex;flex-wrap:wrap;align-items:center;gap:var(--samai-space-3)}
.s-cluster--between{justify-content:space-between}
.s-cluster--center{justify-content:center}

.s-stack{display:grid;gap:var(--samai-space-4)}
.s-stack--tight{gap:var(--samai-space-2)}
.s-stack--loose{gap:var(--samai-space-6)}

/* ── media and type ──────────────────────────────────────────────────────── */

.s-media{width:100%;height:auto;display:block;margin-inline:auto}

.s-note{
  margin:var(--samai-space-3) 0 0;
  color:var(--samai-muted);
  font-size:11.5px;
  font-weight:700;
  line-height:1.85;
  text-align:center;
}

.s-heading{display:grid;gap:var(--samai-space-2);margin-block-end:var(--samai-space-3)}
.s-heading-title{margin:0;color:var(--samai-primary);font-size:16.5px;font-weight:900;line-height:1.85}
.s-heading-lead{margin:0;color:var(--samai-muted);font-size:14.5px;font-weight:700;line-height:1.9}

/* ── narrow screens ──────────────────────────────────────────────────────── */

@media (max-width:720px){
  .s-panel{padding:var(--samai-space-5)}
  .s-grid--2,
  .s-grid--3,
  .s-grid--4{grid-template-columns:minmax(0,1fr)}
}

/* Built-in component styles. One block per component, in registry order. */
.samai-brand-bar{
  position:relative;
  z-index:80;
  width:min(var(--samai-width),calc(100% - (var(--samai-gutter) * 2)));
  min-height:72px;
  margin:0 auto;
  padding:14px 28px;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:var(--samai-space-4);
  overflow:hidden;
  border-block-end:1px solid #ffffff0f;
  border-radius:0 0 22px 22px;
  background:var(--samai-dark);
  color:#fff;
  box-shadow:0 8px 24px #0000004d;
}

.samai-brand-bar::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(420px 180px at 80% 50%,#3fae9a33,transparent 70%),
    radial-gradient(420px 180px at 20% 50%,#73c2671f,transparent 70%);
}

.samai-brand-bar>*{position:relative;z-index:1}

.samai-brand-action{display:flex;align-items:center}
.samai-brand-logo-wrap{display:flex;align-items:center}
.samai-brand-spacer{display:none}

.samai-brand-heading{
  min-width:0;
  text-align:center;
  line-height:1.35;
}

.samai-brand-title{
  overflow:hidden;
  color:#fff;
  font-size:15px;
  font-weight:900;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.samai-brand-subtitle{
  margin-block-start:2px;
  overflow:hidden;
  color:#ffffffa3;
  font-size:11.5px;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.samai-brand-logo{
  width:auto;
  height:44px;
  display:block;
  filter:drop-shadow(0 4px 12px #00000066);
}

.samai-fullscreen{
  appearance:none;
  width:44px;
  height:44px;
  padding:0;
  display:grid;
  place-items:center;
  border:1px solid #ffffff29;
  border-radius:11px;
  background:#ffffff1f;
  color:#fff;
  cursor:pointer;
  transition:background .2s ease,transform .2s ease;
}

.samai-fullscreen:hover{background:#ffffff38;transform:scale(1.06)}

.samai-nav-shell{
  position:sticky;
  inset-block-start:0;
  z-index:70;
  width:min(var(--samai-width),calc(100% - (var(--samai-gutter) * 2)));
  margin:16px auto 0;
}

.samai-nav{
  padding:7px;
  display:flex;
  gap:5px;
  overflow:hidden;
  border:1px solid var(--samai-border);
  border-radius:17px;
  background:#fffffffa;
  box-shadow:0 8px 22px #24377117;
  backdrop-filter:blur(10px);
  scrollbar-width:thin;
}

.samai-nav-link{
  min-width:0;
  min-height:auto;
  flex:1 1 0;
  padding:10px 8px;
  display:block;
  border-radius:12px;
  color:var(--samai-muted);
  font-size:clamp(11.5px,1.05vw,13.5px);
  font-weight:900;
  text-align:center;
  text-decoration:none;
  white-space:nowrap;
  overflow:hidden;
  line-height:normal;
  text-overflow:ellipsis;
  transition:background .3s ease,color .3s ease,box-shadow .3s ease;
}

.samai-nav-link[href]:hover{background:#2437710f;color:var(--samai-primary)}

.samai-nav-link.is-active,
.samai-nav-link[aria-current="location"]{
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  box-shadow:0 6px 16px #2437712e;
}

.samai-page-progress{
  position:fixed;
  inset-inline:0;
  inset-block-end:0;
  z-index:120;
  width:100%;
  height:4px;
  pointer-events:none;
}

.samai-page-progress i{
  width:0;
  height:100%;
  display:block;
  background:linear-gradient(90deg,var(--samai-primary),var(--samai-teal),var(--samai-green));
  box-shadow:0 -2px 12px #3fae9a47;
  transition:width .12s linear;
}

#lesson-content{padding-block-end:0}

.samai-section{
  scroll-margin-block-start:88px;
  width:min(var(--samai-width),calc(100% - (var(--samai-gutter) * 2)));
  margin:22px auto;
  padding:30px;
  border:1px solid var(--samai-border);
  border-radius:22px;
  background:var(--samai-surface);
  box-shadow:var(--samai-shadow);
}

.samai-section[data-reveal]{
  opacity:0;
  transform:translateY(14px);
}

.samai-section[data-reveal].is-visible{
  animation:samai-reveal .55s ease both;
}

@keyframes samai-reveal{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}

.samai-section-header{margin-block-end:24px}
.samai-section-header-tight{margin-block-end:8px}

.samai-section-title{
  position:relative;
  margin:0 0 8px;
  padding-inline-start:0;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--samai-primary);
  font-size:clamp(21px,2.3vw,27px);
  font-weight:900;
  letter-spacing:-.01em;
  line-height:1.35;
}

.samai-section-title::before{content:none}

.samai-section-title>i{color:var(--samai-teal);font-size:.72em}

.samai-section-subtitle{
  margin:0;
  color:var(--samai-muted);
  font-size:14.5px;
  font-weight:700;
  line-height:1.9;
}

.samai-section-soft{background:linear-gradient(180deg,#fff,#f7fafc)}
.samai-section-accent{border-color:#3fae9a38;background:linear-gradient(145deg,#fff,#f2faf8)}
.samai-section-contrast{border-color:#ffffff14;background:linear-gradient(135deg,var(--samai-dark),var(--samai-primary));color:#fff}
.samai-section-contrast .samai-section-title,
.samai-section-contrast .samai-section-subtitle{color:#fff}

.samai-stack{display:grid;gap:var(--samai-space-4)}
.samai-stack>*{min-width:0}
.samai-stack-gap-none{gap:0}
.samai-stack-gap-none>.samai-paragraph-lead{margin-block-end:24px}

.samai-hero-section{
  margin-block-start:18px;
  padding:0;
  overflow:hidden;
  border:0;
  background:transparent;
  box-shadow:none;
}

.samai-hero{
  position:relative;
  padding:38px 32px;
  overflow:hidden;
  border-radius:22px;
  background:linear-gradient(125deg,var(--samai-primary) 0%,var(--samai-primary-2) 48%,var(--samai-teal) 100%);
  color:#fff;
  box-shadow:0 16px 36px #24377133;
}

.samai-hero::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(500px 250px at 95% -20%,#73c26747,transparent 60%);
}

.samai-hero>*{position:relative;z-index:1}

.samai-hero-layout{
  max-width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  align-items:center;
  gap:var(--samai-space-7);
}

.samai-hero-section-narrow .samai-hero-copy{max-width:900px}

.samai-hero-section-split .samai-hero-layout{grid-template-columns:minmax(0,1.18fr) minmax(280px,.82fr)}
.samai-hero-copy{min-width:0;max-width:930px}

.samai-hero-kicker{
  width:fit-content;
  margin-block-end:13px;
  padding:5px 13px;
  display:flex;
  align-items:center;
  gap:var(--samai-space-2);
  border:1px solid #ffffff33;
  border-radius:999px;
  background:#ffffff24;
  color:#fff;
  font-size:11.5px;
  font-weight:900;
}

.samai-hero h1{
  position:relative;
  margin:0 0 12px;
  padding-inline-start:0;
  color:#fff;
  font-size:clamp(27px,3.3vw,40px);
  font-weight:900;
  letter-spacing:-.02em;
  line-height:1.2;
  text-shadow:0 2px 10px #00000026;
}

.samai-hero h1::before{content:none}

.samai-hero-copy>p{
  margin:0;
  color:#fffffff2;
  font-size:clamp(14.5px,1.25vw,16.5px);
  font-weight:500;
  line-height:1.95;
}

.samai-hero-panel{
  min-width:0;
  padding:var(--samai-space-5);
  border:1px solid #ffffff38;
  border-radius:22px;
  background:#ffffff1f;
  box-shadow:inset 0 1px 0 #ffffff29,0 18px 36px #0c182829;
  backdrop-filter:blur(10px);
}

.samai-hero-stack{display:grid;gap:var(--samai-space-3)}
.samai-hero-stack>.samai-paragraph{color:#fff;font-size:14px}
.samai-hero-stack>.samai-list{color:#fff}
.samai-hero-stack>.samai-callout{background:#ffffffeb}

.samai-paragraph{
  margin:0;
  color:var(--samai-ink);
  font-size:16px;
  font-weight:600;
  line-height:1.95;
}

.samai-paragraph-lead{color:var(--samai-muted);font-size:14.5px;font-weight:700;line-height:1.9}
.samai-paragraph-muted{color:var(--samai-muted)}
.samai-paragraph-small{font-size:13px;color:var(--samai-muted)}

.samai-grid{
  display:grid;
  grid-template-columns:repeat(var(--samai-columns,2),minmax(0,1fr));
  gap:var(--samai-space-4);
}

.samai-grid[style*="--samai-columns:2"]>:last-child:nth-child(odd):not(:first-child){
  width:min(100%,calc(50% - (var(--samai-space-4) / 2)));
  grid-column:1/-1;
  justify-self:center;
}

.samai-card{
  position:relative;
  min-width:0;
  padding:var(--samai-space-5);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid var(--samai-border);
  border-radius:20px;
  background:linear-gradient(180deg,#fff,#f9fbfd);
  color:inherit;
  box-shadow:var(--samai-shadow);
  text-decoration:none;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
}

.samai-card::before{
  content:"";
  position:absolute;
  inset-block-start:0;
  inset-inline:0;
  height:4px;
  background:linear-gradient(90deg,var(--samai-primary),var(--samai-teal),var(--samai-green));
  opacity:.75;
}

.samai-card:hover{
  border-color:#3fae9a33;
  box-shadow:var(--samai-shadow-hover);
  transform:translateY(-4px);
}

/* Opt-in hover treatments, each off unless the lesson sets its flag, so every existing
   card is untouched. The global reduced-motion block already stills the transitions. */
.samai-card-glow:hover{box-shadow:0 28px 58px #24377129,0 0 0 1px #3fae9a33,0 0 30px #3fae9a2b}

/* The viewer is RTL, so `right` is the inline start the bar should wipe out from. */

.samai-card-reveal-bar:hover::before{transform:scaleX(1)}

.samai-card-tilt .samai-card-badge,
.samai-card-tilt .samai-card-icon{transition:transform .4s cubic-bezier(.4,0,.2,1)}
.samai-card-tilt:hover .samai-card-badge,
.samai-card-tilt:hover .samai-card-icon{transform:rotate(-8deg) scale(1.15)}

/* Gloss is the badge's alone: `.samai-card-icon` can carry an overhanging

.samai-card-gloss .samai-card-badge{position:relative;overflow:hidden}
.samai-card-gloss .samai-card-badge::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent 30%,#ffffff59 50%,transparent 70%);
  transform:translateX(100%);
  transition:transform .8s ease;
}

.samai-card-soft{background:linear-gradient(180deg,#fff,#f5f8fb);box-shadow:0 10px 24px #2437710d}

.samai-card-badge{

     width instead of sitting as a chip in the top corner. */

  margin-block-end:var(--samai-space-3);
  padding-inline:10px;
  display:inline-grid;
  place-items:center;

.samai-card-eyebrow{

.samai-card h3{

.samai-card .samai-grid>.samai-card .samai-card-icon,

.samai-card-tech{

.samai-tech-examples-label::after{background:linear-gradient(90deg,#3fae9a61,transparent)}
.samai-tech-examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
