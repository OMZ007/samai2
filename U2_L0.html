    <script type="samai/module" data-id="core/dom.js">
// Element construction and tree helpers shared by every component.

let uid = 0;

export function resetIds() {
  uid = 0;
}

export function nextId(prefix) {
  uid += 1;
  return `${prefix}-${uid}`;
}

export function opts(node) {
  return node && node.opts && typeof node.opts === "object" && !Array.isArray(node.opts) ? node.opts : {};
}

export function nest(node) {
  return node && Array.isArray(node.nest) ? node.nest : [];
}

export function asArray(value) {
  return Array.isArray(value) ? value : [];
}

export function asText(value, fallback) {
  if (value === undefined || value === null) return fallback || "";
  return String(value);
}

export function iconName(value, fallback) {
  const name = asText(value || fallback).trim();
  if (!name) return "";
  if (/\s/.test(name)) return name;
  return `fa-solid ${name.startsWith("fa-") ? name : `fa-${name}`}`;
}

export function icon(value, fallback) {
  return el("i", {
    className: iconName(value, fallback),
    attrs: { "aria-hidden": "true" }
  });
}

export function interpolate(template, values) {
  return asText(template).replace(/\{([a-zA-Z0-9_]+)\}/g, (_, key) => (
    values[key] === undefined ? "" : values[key]
  ));
}

export function validClassNames(value) {
  return asText(value)
    .split(/\s+/)
    .filter((name) => /^[a-zA-Z][a-zA-Z0-9_-]*$/.test(name))
    .join(" ");
}

export function append(parent, items) {
  const list = Array.isArray(items) ? items.flat(Infinity) : [items];
  list.forEach((item) => {
    if (item === undefined || item === null || item === false) return;
    parent.append(item instanceof Node ? item : document.createTextNode(String(item)));
  });
  return parent;
}

export function el(tagName, options, items) {
  const node = document.createElement(tagName);
  const settings = options || {};
  if (settings.id) node.id = settings.id;
  if (settings.className) node.className = settings.className;
  if (settings.text !== undefined) node.textContent = settings.text;
  if (settings.type) node.type = settings.type;
  if (settings.hidden) node.hidden = true;
  Object.entries(settings.attrs || {}).forEach(([name, value]) => {
    if (value === undefined || value === null || value === false) return;
    node.setAttribute(name, value === true ? "" : String(value));
  });
  append(node, items || []);
  return node;
}

export function fragment(items) {
  return append(document.createDocumentFragment(), items || []);
}

export function iconText(iconValue, text, fallback) {
  return fragment([icon(iconValue, fallback), el("span", { text: asText(text) })]);
}

/**
 * Label first, icon after it. Forward controls read this way — the arrow trails the label
 * in the direction of travel, and in RTL that puts it on the leading edge of the button.
 */
export function textIcon(text, iconValue, fallback) {
  return fragment([el("span", { text: asText(text) }), icon(iconValue, fallback)]);
}

export function safeMarkup(html) {
  const template = document.createElement("template");
  template.innerHTML = asText(html);
  template.content.querySelectorAll("script, style, link, iframe, object, embed, form").forEach((node) => node.remove());
  template.content.querySelectorAll("*").forEach((node) => {
    Array.from(node.attributes).forEach((attribute) => {
      const name = attribute.name.toLowerCase();
      const value = attribute.value.trim().toLowerCase();
      if (name.startsWith("on") || ((name === "href" || name === "src") && value.startsWith("javascript:"))) {
        node.removeAttribute(attribute.name);
      }
    });
  });
  return template.content.cloneNode(true);
}

export function findChildren(node, componentName) {
  return nest(node).filter((child) => child && child.name === componentName);
}

    <script type="samai/module" data-id="core/digits.js">
// Arabic-Indic digit display. Lessons always author ASCII 0-9; this layer
// decides what the learner sees.

let useArabicIndicDigits = false;

export function setDigitMode(enabled) {
  useArabicIndicDigits = enabled === true;
}

export function formatDigits(value) {
  const text = String(value);
  if (!useArabicIndicDigits) return text;
  return toArabicIndicDigits(text);
}

export function toArabicIndicDigits(value) {
  return String(value).replace(/[0-9]/g, (digit) => "٠١٢٣٤٥٦٧٨٩"[Number(digit)]);
}

export const RAW_DIGIT_SELECTOR = "code, pre, samp, kbd, style, script, [dir='ltr'], .samai-raw-digits";

export function formatDigitTextNode(textNode) {
  const parent = textNode.parentElement;
  if (parent && parent.closest(RAW_DIGIT_SELECTOR)) return;
  const localized = formatDigits(textNode.nodeValue);
  if (localized !== textNode.nodeValue) textNode.nodeValue = localized;
}

export function applyDigitDisplay(scope) {
  if (!useArabicIndicDigits) return;
  const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT);
  let textNode = walker.nextNode();
  while (textNode) {
    formatDigitTextNode(textNode);
    textNode = walker.nextNode();
  }
}

// Interactive components render their bodies after mount, so the initial
// walk never sees that text. Keep localizing nodes as they are added.
export function observeDigitDisplay(scope) {
  if (!useArabicIndicDigits || typeof MutationObserver !== "function") return;
  const observer = new MutationObserver((records) => {
    records.forEach((record) => {
      record.addedNodes.forEach((node) => {
        if (node.nodeType === Node.ELEMENT_NODE) applyDigitDisplay(node);
        else if (node.nodeType === Node.TEXT_NODE) formatDigitTextNode(node);
      });
    });
  });
  // childList only: rewriting nodeValue never re-triggers this observer.
  observer.observe(scope, { childList: true, subtree: true });
}

    <script type="samai/module" data-id="core/lifecycle.js">
// Per-render component state and teardown bookkeeping.

export const state = new WeakMap();

let cleanups = [];

export function pushCleanup(fn) {
  cleanups.push(fn);
}

export function runCleanups() {
  cleanups.splice(0).forEach((fn) => {
    try {
      fn();
    } catch (error) {
      window.setTimeout(() => { throw error; }, 0);
    }
  });
}

export function listen(target, eventName, handler, options) {
  target.addEventListener(eventName, handler, options);
  pushCleanup(() => target.removeEventListener(eventName, handler, options));
}

    <script type="samai/module" data-id="core/primitives.js">
// Design primitives for lesson-local custom components.
//
// A custom component should compose these instead of hand-rolling panels,
// icon tiles and gradient rules in its own <style> block. Everything here maps
// onto the `s-*` classes in css/primitives.css, so a lesson only writes CSS for
// what these cannot express. If a lesson needs the same bespoke shape twice,
// promote it to a primitive rather than copying it.

import { append, el, icon, validClassNames } from "./dom.js";

const TONES = ["primary", "teal", "green", "warning", "danger", "neutral"];
const SIZES = ["sm", "md", "lg"];

function tone(value, fallback) {
  return TONES.includes(value) ? value : (fallback || "primary");
}

function size(value, fallback) {
  return SIZES.includes(value) ? value : (fallback || "md");
}

function classes(base, options) {
  return [base, ...options].filter(Boolean).join(" ");
}

/**
 * Surface with the shared border, radius and shadow.
 * @param {{tone?: string, variant?: "soft"|"dark", rule?: boolean, lift?: boolean,
 *          center?: boolean, tag?: string, className?: string, attrs?: object}} options
 */
export function panel(options, children) {
  const o = options || {};
  return el(o.tag || "article", {
    className: classes("s-panel", [
      o.variant === "dark" ? "s-panel--dark" : "",
      o.variant === "soft" ? "s-panel--soft" : "",
      o.rule ? "s-rule-top" : "",
      o.lift ? "s-lift" : "",
      o.center ? "s-center" : "",
      o.tone ? `s-tone-${tone(o.tone)}` : "",
      validClassNames(o.className)
    ]),
    attrs: o.attrs || null
  }, children || []);
}

/** Gradient rounded square holding a single icon. */
export function iconTile(name, options) {
  const o = options || {};
  return el("span", {
    className: classes("s-icon-tile", [
      `s-icon-tile--${size(o.size)}`,
      `s-tone-${tone(o.tone)}`,
      validClassNames(o.className)
    ])
  }, icon(name, o.fallback));
}

/** Oversized figure with a caption underneath, optionally over a separator. */
export function stat(options) {
  const o = options || {};
  return el("div", { className: classes("s-stat", [validClassNames(o.className)]) }, [
    o.icon ? iconTile(o.icon, { size: o.iconSize || "md", tone: o.tone }) : null,
    el("b", { className: "s-stat-value", text: o.value }),
    o.separator === false ? null : el("span", { className: "s-sep", attrs: { "aria-hidden": "true" } }),
    o.label ? el("span", { className: "s-stat-label", text: o.label }) : null
  ]);
}

/** Equal-width responsive columns; collapses to one column on narrow screens. */
export function gridOf(items, renderItem, options) {
  const o = options || {};
  const list = Array.isArray(items) ? items : [];
  const columns = Math.max(1, Math.min(4, Number(o.columns) || Math.min(4, list.length) || 1));
  return el("div", {
    className: classes(`s-grid s-grid--${columns}`, [
      o.density === "compact" ? "s-grid--compact" : "",
      validClassNames(o.className)
    ]),
    attrs: { role: o.role || null }
  }, list.map((item, index) => renderItem(item, index)));
}

/** Horizontal run of items that wraps. */
export function cluster(children, options) {
  const o = options || {};
  return el(o.tag || "div", {
    className: classes("s-cluster", [o.align ? `s-cluster--${validClassNames(o.align)}` : "", validClassNames(o.className)])
  }, children || []);
}

/** Vertical rhythm container. */
export function stack(children, options) {
  const o = options || {};
  return el(o.tag || "div", {
    className: classes("s-stack", [o.gap ? `s-stack--${validClassNames(o.gap)}` : "", validClassNames(o.className)])
  }, children || []);
}

/**
 * Lesson image or inline SVG sized to its container.
 * `alt` is required; pass an empty string only for decoration.
 */
export function media(src, alt, options) {
  const o = options || {};
  return el("img", {
    className: classes("s-media", [validClassNames(o.className)]),
    attrs: {
      src,
      alt,
      loading: o.loading || "lazy",

/** Short muted line used under a panel or rail. */
export function note(text, options) {
  const o = options || {};

/** Heading + optional lead paragraph, used above a custom block. */
export function heading(options) {

  return append(el("header", { className: classes("s-heading", [validClassNames(o.className)]) }), [
    o.icon ? iconTile(o.icon, { size: "sm", tone: o.tone }) : null,

  ]);
}

    <script type="samai/module" data-id="core/render.js">
// Component registry plus the node-to-element renderer. Components register
// themselves here; nothing in core imports a component module.

import { append, el, fragment, icon, iconText, nest, opts, safeMarkup, textIcon, validClassNames } from "./dom.js";
import { formatDigits } from "./digits.js";
import * as primitives from "./primitives.js";

const registry = new Map();

/**
 * @param {string} name
 * @param {{render?: Function, meta?: object, init?: {selector: string, setup: Function}}} definition
 */
export function register(name, definition) {
  if (registry.has(name)) throw new Error(`Component "${name}" is already registered.`);
  registry.set(name, Object.freeze(Object.assign({ meta: {} }, definition)));
}

export function getComponent(name) {
  return registry.get(name);
}

export function componentNames() {
  return Array.from(registry.keys());
}

export function componentMeta(name) {
  return registry.get(name)?.meta || null;
}

export function initializers() {
  return Array.from(registry.values()).map((entry) => entry.init).filter(Boolean);
}

let customComponents = Object.freeze(Object.create(null));
let customMountQueue = [];

export function customComponentNames() {
  return Object.keys(customComponents);
}

export function hasCustomComponent(name) {
  return Boolean(customComponents[name]);
}

export function drainCustomMounts() {
  return customMountQueue.splice(0);
}

export function resetCustomMounts() {
  customMountQueue = [];
}

export function isCustomName(name) {
  return typeof name === "string" && /^:[a-z][a-z0-9_-]*$/.test(name);
}

export function configureCustomComponents(source) {
  const defined = source || {};
  if (typeof defined !== "object" || Array.isArray(defined)) {
    throw new Error("A lesson's components export must be an object.");
  }
  const custom = Object.create(null);
  Object.entries(defined).forEach(([name, candidate]) => {
    if (!isCustomName(name)) throw new Error(`Invalid custom component name: ${name}`);
    const definition = typeof candidate === "function" ? { render: candidate } : candidate;
    if (!definition || typeof definition.render !== "function") {
      throw new Error(`Custom component ${name} must define render().`);
    }
    if (definition.mount !== undefined && typeof definition.mount !== "function") {
      throw new Error(`Custom component ${name} mount must be a function.`);
    }
    custom[name] = definition;
  });
  customComponents = Object.freeze(custom);
}

export const ui = Object.freeze({
  el,
  append,
  fragment,
  icon,
  iconText,
  textIcon,
  render: renderNode,
  renderChildren,
  safeMarkup,
  formatDigits,
  ...primitives
});

export function renderChildren(nodes, context) {
  return fragment(nest({ nest: nodes }).map((node, index) => (
    renderNode(node, Object.assign({}, context, { index }))
  )));
}

export function renderStack(nodes, context, className) {
  return el("div", { className: className || "samai-stack" }, renderChildren(nodes, context));
}

export function renderCustom(node, context) {
  const definition = customComponents[node.name];
  if (!definition) throw new Error(`Unknown custom component: ${node.name}`);
  const p = opts(node);
  const host = el(definition.tag || "div", {
    id: p.id,
    className: [
      "samai-custom",
      `samai-custom-${node.name.slice(1)}`,
      validClassNames(definition.className),
      validClassNames(p.className)
    ].filter(Boolean).join(" "),
    attrs: Object.assign({ "data-component": node.name }, definition.attributes || {}, p.attributes || {})
  });
  const result = definition.render({
    element: host,
    opts: p,
    nest: nest(node),
    context,
    ui
  });
  if (result !== undefined && result !== null && result !== host) {
    append(host, typeof result === "string" ? safeMarkup(result) : result);
  }
  if (definition.mount) customMountQueue.push({ definition, host, node, context });
  return host;
}

export function renderNode(node, context) {
  if (typeof node === "string") {
    return registry.get("paragraph").render({ name: "paragraph", opts: { text: node } }, context || {});
  }
  if (!node || typeof node !== "object" || Array.isArray(node)) {
    throw new Error("Every component-tree node must be an object or string.");
  }
  let rendered;
  if (isCustomName(node.name)) {
    rendered = renderCustom(node, context || {});
  } else {
    const entry = registry.get(node.name);
    if (entry?.meta?.value) {
      throw new Error(`${node.name} can only be used inside its parent component.`);
    }
    const renderer = entry?.render;
    if (!renderer) throw new Error(`Unsupported component: ${node.name}`);
    rendered = renderer(node, context || {});
  }
  if (rendered instanceof Element) rendered.dataset.samaiComponent = node.name;
  return rendered;
}

    <script type="samai/module" data-id="components/chrome.js">
// Lesson chrome: brand bar, section navigation, hero, and section shells.

import { DEFAULTS } from "../core/contract.js";
import { asArray, asText, el, icon, iconName, iconText, nest, nextId, opts, validClassNames } from "../core/dom.js";
import { toArabicIndicDigits } from "../core/digits.js";
import { listen, state } from "../core/lifecycle.js";
import { register, renderStack } from "../core/render.js";

function renderBrandBar(node, context) {
  const p = opts(node);
  const meta = context?.lesson?.meta || {};
  const title = p.title === undefined ? meta.moduleTitle : p.title;
  const subtitle = p.subtitle === undefined
    ? meta.lesson === "0"
    ? `الوحدة ${meta.module} | ${meta.lessonTitle}`
    : `الوحدة ${meta.module} - الدرس ${meta.lesson} | ${meta.lessonTitle}`
    : p.subtitle;
  const localizeDigits = p.digitStyle === "arabic-indic" ? toArabicIndicDigits : asText;
  const button = el("button", {
    className: "samai-fullscreen",
    type: "button",
    attrs: {
      "aria-label": p.fullscreenLabel || DEFAULTS.fullscreen,
      title: p.fullscreenLabel || DEFAULTS.fullscreen,
      "aria-keyshortcuts": "F"
    }
  }, icon("expand"));
  const heading = el("div", { className: "samai-brand-heading" }, [
    el("div", { className: "samai-brand-title", text: localizeDigits(title) }),
    subtitle ? el("div", { className: "samai-brand-subtitle", text: localizeDigits(subtitle) }) : null
  ]);
  const logo = el("img", {
    className: "samai-brand-logo",
    attrs: {
      src: p.logo || DEFAULTS.logo,
      alt: p.logoAlt === undefined ? DEFAULTS.logoAlt : p.logoAlt
    }
  });
  const bar = el("header", { className: "samai-brand-bar" }, [
    el("div", { className: "samai-brand-action" }, button),
    heading,
    el("span", { className: "samai-brand-spacer", attrs: { "aria-hidden": "true" } }),
    el("div", { className: "samai-brand-logo-wrap" }, logo)
  ]);
  state.set(bar, {
    fullscreenLabel: p.fullscreenLabel || DEFAULTS.fullscreen,
    exitFullscreenLabel: p.exitFullscreenLabel || DEFAULTS.exitFullscreen
  });
  return bar;
}

function renderLessonNav(node) {
  const p = opts(node);
  const clickable = p.clickable === true;
  const links = asArray(p.items).map((item, index) => el(clickable ? "a" : "span", {
    className: "samai-nav-link",
    text: item.label,
    attrs: {
      href: clickable ? `#${item.target}` : null,
      "data-target": item.target,
      "aria-current": index === 0 ? "location" : null
    }
  }));
  const progress = el("div", {
    className: "samai-page-progress",
    attrs: {
      role: "progressbar",
      "aria-label": p.progressLabel || DEFAULTS.progressLabel,
      "aria-valuemin": "0",
      "aria-valuemax": "100",
      "aria-valuenow": "0"
    }
  }, el("i"));
  const shell = el("div", { className: "samai-nav-shell" }, [
    el("nav", {
      className: "samai-nav",
      attrs: { "aria-label": p.ariaLabel || DEFAULTS.navLabel }
    }, links),
    progress
  ]);
  state.set(shell, { items: asArray(p.items) });
  return shell;
}

function renderHero(node, context) {
  const p = opts(node);
  const title = p.title === undefined ? context?.lesson?.meta?.lessonTitle : p.title;
  const children = nest(node);
  return el("section", {
    id: p.id || "intro",
    className: `samai-section samai-hero-section${children.length ? " samai-hero-section-split" : ""}${p.copyWidth === "narrow" ? " samai-hero-section-narrow" : ""}`,
    attrs: { "data-reveal": "" }
  }, el("div", { className: "samai-hero" }, el("div", { className: "samai-hero-layout" }, [
    el("div", { className: "samai-hero-copy" }, [
      p.kicker ? el("div", { className: "samai-hero-kicker" }, iconText(p.kickerIcon, p.kicker, "sparkles")) : null,
      el("h1", { text: title }),
      p.description ? el("p", { text: p.description }) : null
    ]),
    children.length ? el("aside", {
      className: "samai-hero-panel",
      attrs: { "aria-label": p.panelLabel || title || "ملخص الدرس" }
    }, renderStack(children, context, "samai-hero-stack")) : null
  ])));
}

function renderSection(node, context) {
  const p = opts(node);
  const id = p.id || nextId("section");
  const extra = validClassNames(p.className);
  const section = el("section", {
    id,
    className: `samai-section${p.tone ? ` samai-section-${validClassNames(p.tone)}` : ""}${extra ? ` ${extra}` : ""}`,
    attrs: {
      "aria-labelledby": p.title ? `${id}-title` : null,
      "data-reveal": ""
    }
  });
  if (p.title || p.subtitle) {
    section.append(el("header", {
      className: `samai-section-header${p.headerGap === "tight" ? " samai-section-header-tight" : ""}`
    }, [
      p.title ? el("h2", { id: `${id}-title`, className: "samai-section-title" }, [
        p.icon ? icon(p.icon) : null,
        el("span", { text: p.title })
      ]) : null,
      p.subtitle ? el("p", { className: "samai-section-subtitle", text: p.subtitle }) : null
    ]));
  }
  section.append(renderStack(
    nest(node),
    Object.assign({}, context, { section: node }),
    `samai-stack${p.contentGap === "none" ? " samai-stack-gap-none" : ""}`
  ));
  return section;
}

function fullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}

function initializeBrandBar(bar) {
  const config = state.get(bar);
  const button = bar.querySelector(".samai-fullscreen");
  const update = () => {
    const active = Boolean(fullscreenElement());
    button.setAttribute("aria-label", active ? config.exitFullscreenLabel : config.fullscreenLabel);
    button.title = active ? config.exitFullscreenLabel : config.fullscreenLabel;
    const iconNode = button.querySelector("i");
    iconNode.className = iconName(active ? "compress" : "expand");
  };
  const toggle = () => {
    const active = Boolean(fullscreenElement());
    const target = active ? document : document.documentElement;
    const action = active
      ? (document.exitFullscreen || document.webkitExitFullscreen)
      : (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
    if (!action) {
      update();
      return;
    }
    try {
      const pending = action.call(target);
      if (pending && typeof pending.catch === "function") pending.catch(update);
    } catch (error) {
      update();
    }
  };
  listen(button, "click", toggle);
  listen(document, "fullscreenchange", update);
  listen(document, "webkitfullscreenchange", update);
  const keydown = (event) => {
    const target = event.target instanceof Element ? event.target : document.activeElement;
    const editable = target && target.closest("input, textarea, select, [contenteditable]:not([contenteditable='false'])");
    if (
      event.defaultPrevented
      || event.ctrlKey
      || event.metaKey
      || event.altKey
      || event.repeat
      || editable
      || (event.key.toLowerCase() !== "f" && event.key !== "ب")
    ) return;
    event.preventDefault();
    toggle();
  };
  listen(document, "keydown", keydown);
  update();
}

function initializeNav(shell) {
  const links = Array.from(shell.querySelectorAll(".samai-nav-link"));
  const progress = shell.querySelector(".samai-page-progress");
  const fill = progress.querySelector("i");
  const targets = links.map((link) => document.getElementById(link.dataset.target)).filter(Boolean);
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  links.filter((link) => link.matches("a[href]")).forEach((link) => {
    listen(link, "click", (event) => {
      const target = document.getElementById(link.dataset.target);
      if (!target) return;
      event.preventDefault();
      target.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
      history.replaceState(null, "", `#${link.dataset.target}`);
    });
  });

  const update = () => {
    const top = window.scrollY;
    const height = document.documentElement.scrollHeight - window.innerHeight;
    const percent = height > 0 ? Math.min(100, Math.max(0, (top / height) * 100)) : 100;
    fill.style.width = `${percent}%`;
    progress.setAttribute("aria-valuenow", String(Math.round(percent)));
    const activationOffset = 150;
    let active = 0;
    let fullyVisible = -1;
    let fullyVisibleDistance = Number.POSITIVE_INFINITY;
    targets.forEach((target, index) => {
      const rect = target.getBoundingClientRect();
      if (rect.top <= activationOffset) active = index;
      if (rect.top >= activationOffset && rect.bottom <= window.innerHeight) {
        const distance = rect.top - activationOffset;
        if (distance < fullyVisibleDistance) {
          fullyVisible = index;
          fullyVisibleDistance = distance;
        }
      }
    });
    if (fullyVisible >= 0) active = fullyVisible;
    if (top >= height - 1 && targets.length) active = targets.length - 1;
    links.forEach((link, index) => {
      link.classList.toggle("is-active", index === active);
      if (index === active) link.setAttribute("aria-current", "location");
      else link.removeAttribute("aria-current");
    });
  };
  listen(window, "scroll", update, { passive: true });
  listen(window, "resize", update);
  update();
}

register("brandBar", {
  render: renderBrandBar,
  init: { selector: ".samai-brand-bar", setup: initializeBrandBar },
  meta: {
    doc: "Fixed header carrying the SAMAI2 logo, module title and fullscreen control.",
    topLevel: "only",
    leaf: true,
    opts: { title: "string?", subtitle: "string?", logo: "string?", logoAlt: "string?", digitStyle: '"arabic-indic"?' },
    check(node, v) {
      if (v.p.digitStyle !== undefined && v.p.digitStyle !== "arabic-indic") {
        v.fail(`${v.path}.opts.digitStyle must be "arabic-indic" when provided.`);
      }
    }
  }
});

register("lessonNav", {
  render: renderLessonNav,
  init: { selector: ".samai-nav-shell", setup: initializeNav },
  meta: {
    doc: "Sticky section rail with a reading-progress bar. Non-clickable by default.",
    topLevel: "only",
    leaf: true,
    opts: { items: "{target,label}[]", clickable: "boolean?", ariaLabel: "string?" },
    check(node, v) {
      if (v.p.clickable !== undefined && typeof v.p.clickable !== "boolean") {
        v.fail(`${v.path}.opts.clickable must be a boolean.`);
      }
      v.asArray(v.p.items).forEach((item) => v.navTargets.push(item.target));
    }
  }
});

register("hero", {
  render: renderHero,
  meta: {
    doc: "Opening block. Title defaults to meta.lessonTitle; nested children become a side panel.",
    topLevel: "only",
    surface: "static",
    opts: { id: "string?", title: "string?", description: "string?", copyWidth: '"narrow"?' },
    check(node, v) {
      if (v.p.copyWidth !== undefined && v.p.copyWidth !== "narrow") {
        v.fail(`${v.path}.opts.copyWidth must be "narrow" when provided.`);
      }
    }
  }
});

register("section", {
  render: renderSection,
  meta: {
    doc: "Titled band of lesson content. The unit lessonNav targets by id.",
    topLevel: "only",
    opts: { id: "string?", title: "string?", subtitle: "string?", headerGap: '"tight"?', contentGap: '"none"?' },
    check(node, v) {
      if (v.p.headerGap !== undefined && v.p.headerGap !== "tight") {
        v.fail(`${v.path}.opts.headerGap must be "tight" when provided.`);
      }
      if (v.p.contentGap !== undefined && v.p.contentGap !== "none") {
        v.fail(`${v.path}.opts.contentGap must be "none" when provided.`);
      }
    }
  }
});

    <script type="samai/module" data-id="components/content.js">
// Static content components.

import { append, asArray, asText, el, findChildren, icon, iconText, nest, opts, safeMarkup, validClassNames } from "../core/dom.js";
import { register, renderChildren, renderNode, renderStack } from "../core/render.js";

function renderParagraph(node) {
  const p = opts(node);
  const variant = ["lead", "muted", "small"].includes(p.variant) ? ` samai-paragraph-${p.variant}` : "";
  return el("p", { className: `samai-paragraph${variant}`, text: p.text });
}

function renderCallout(node) {
  const p = opts(node);
  const tone = ["teal", "navy", "green", "warning", "danger", "neutral"].includes(p.tone) ? p.tone : "teal";
  const variant = ["keyline", "focus"].includes(p.variant) ? ` samai-callout-${p.variant}` : "";
  const parts = asArray(p.parts);
  return el("aside", {
    className: `samai-callout samai-callout-${tone}${variant}`,
    attrs: { role: p.role || null }
  }, [
    icon(p.icon, tone === "warning" || tone === "danger" ? "triangle-exclamation" : "lightbulb"),
    el("div", { className: "samai-callout-content" }, [
      p.title ? el("strong", { text: p.title }) : null,
      parts.length ? el("span", {}, parts.map((part) => (
        part.strong ? el("strong", { text: part.text }) : document.createTextNode(asText(part.text))
      ))) : (p.text ? el("span", { text: p.text }) : null)
    ])
  ]);
}

function renderCard(node, context) {
  const p = opts(node);
  const isLink = Boolean(p.href);
  const tone = validClassNames(p.tone || "default");
  const variant = ["moment", "metric", "tech", "initiative", "layer", "use-case"].includes(p.variant) ? p.variant : "";
  const extra = validClassNames(p.className);
  const tagName = isLink ? "a" : "article";
  const children = nest(node);
  const visualChildren = children.filter((child) => (
    child && ["image", "markup"].includes(child.name) && opts(child).slot === "visual"
  ));
  const bodyChildren = children.filter((child) => !visualChildren.includes(child));
  const hasBadge = p.badge !== undefined && p.badge !== null && p.badge !== "";
  const hasIcon = Boolean(p.icon);
  const card = el(tagName, {
    className: [
      "samai-card",
      `samai-card-${tone}`,
      variant ? `samai-card-${variant}` : "",
      extra,
      isLink ? "samai-card-link" : "",
      p.gloss ? "samai-card-gloss" : "",
      p.glow ? "samai-card-glow" : "",
      p.revealBar ? "samai-card-reveal-bar" : "",
      p.tilt ? "samai-card-tilt" : "",
      hasBadge ? "samai-card-has-badge" : "",
      hasIcon ? "samai-card-has-icon" : "",
      hasBadge && hasIcon ? "samai-card-has-badge-icon" : "",
      children.length ? "samai-card-has-nest" : "",
      visualChildren.length ? "samai-card-has-visual" : ""
    ].filter(Boolean).join(" "),
    attrs: isLink ? {
      href: p.href,
      target: p.target || "_blank",
      rel: "noopener noreferrer",
      "aria-label": p.linkLabel || p.title
    } : null
  });
  if (variant === "initiative") {
    append(card, [
      p.icon ? el("span", { className: "samai-card-icon" }, icon(p.icon)) : null,
      el("div", { className: "samai-initiative-body" }, [
        p.title ? el("h3", { text: p.title }) : null,
        p.text ? el("p", { className: "samai-initiative-text", text: p.text }) : null,
        p.source ? el("span", { className: "samai-initiative-source" }, [
          icon("arrow-up-right-from-square"),
          el("span", { text: p.source })
        ]) : null
      ])
    ]);
    return card;
  }
  if (variant === "tech") {
    const examplesNode = bodyChildren.find((child) => child?.name === "enumerate");
    const examples = examplesNode ? asArray(opts(examplesNode).items) : [];
    const exampleIcons = asArray(p.exampleIcons);
    append(card, [
      p.title ? el("h3", { text: p.title }) : null,
      visualChildren.length ? renderStack(visualChildren, context, "samai-tech-visual") : null,
      bodyChildren.some((child) => child !== examplesNode)
        ? renderStack(bodyChildren.filter((child) => child !== examplesNode), context, "samai-card-stack")
        : null,
      examples.length ? el("div", { className: "samai-tech-examples-label", text: p.examplesLabel || "أمثلة شائعة" }) : null,
      examples.length ? el("div", { className: "samai-tech-examples" }, examples.map((example, index) => el("div", {
        className: "samai-tech-example"
      }, [icon(exampleIcons[index] || p.icon, "sparkles"), el("span", { text: example })]))) : null
    ]);
    return card;
  }
  if (visualChildren.length) card.append(renderStack(visualChildren, context, "samai-card-media"));
  if (hasBadge && !hasIcon) card.append(el("span", { className: "samai-card-badge", text: p.badge }));
  if (p.icon || p.title || p.eyebrow) {
    card.append(el("header", { className: "samai-card-header" }, [
      p.icon ? el("span", { className: "samai-card-icon" }, [
        icon(p.icon),
        hasBadge ? el("span", { className: "samai-card-icon-badge", text: p.badge }) : null
      ]) : null,
      el("div", { className: "samai-card-heading" }, [
        p.eyebrow ? el("span", { className: "samai-card-eyebrow", text: p.eyebrow }) : null,
        p.title ? el("h3", { text: p.title }) : null
      ]),
      isLink ? icon("arrow-up-right-from-square") : null
    ]));
  }
  if (p.text) card.append(el("p", { text: p.text }));
  if (bodyChildren.length) card.append(renderStack(bodyChildren, context, "samai-card-stack"));
  return card;
}

function renderGrid(node, context) {
  const p = opts(node);
  const children = nest(node);
  const columns = Math.max(1, Math.min(4, Number(p.columns) || 2));
  const density = p.density === "compact" ? " samai-grid-compact" : "";
  const layerGrid = children.some((child) => child?.name === "card" && opts(child).variant === "layer")
    ? " samai-grid-layer"
    : "";
  const variant = validClassNames(p.variant);
  const extra = validClassNames(p.className);
  return el("div", {
    className: `samai-grid${density}${layerGrid}${variant ? ` samai-grid-${variant}` : ""}${extra ? ` ${extra}` : ""}`,
    attrs: { style: `--samai-columns:${columns}` }
  }, renderChildren(children, context));
}

function renderEnumerate(node, context) {
  const p = opts(node);
  const highlight = p.variant === "highlight";
  const list = el(p.ordered === false ? "ul" : "ol", {
    className: highlight ? "samai-list samai-list-highlight" : "samai-list"
  });
  asArray(p.items).forEach((item) => list.append(highlight

    <script type="samai/module" data-id="components/timeline.js">
// Chronological or developmental stages.

import { icon, iconText, el, nest, opts } from "../core/dom.js";
import { findChildren } from "../core/dom.js";
import { register, renderStack } from "../core/render.js";

function renderTimelineItem(node, context) {
  const p = opts(node);
  const children = nest(node);
  const exampleVisual = children.length ? renderStack(children, context, "samai-timeline-example-visual") : null;
  const exampleCopy = p.exampleText ? el("div", { className: "samai-timeline-example-copy" }, [
    el("strong", {}, iconText(p.exampleIcon, p.exampleTitle || "مثال", "circle-check")),
    el("p", { text: p.exampleText })
  ]) : null;
  return el("li", { className: "samai-timeline-item" }, [
    el("span", { className: "samai-timeline-marker" }, icon(p.icon, "circle")),
    el("article", { className: "samai-timeline-card" }, [
      el("header", { className: "samai-timeline-head" }, [
        el("h3", { text: p.title }),
        p.period ? el("span", { className: "samai-timeline-period", text: p.period }) : null
      ]),
      p.text ? el("p", { className: "samai-timeline-text", text: p.text }) : null,
      p.exampleText || children.length ? el("aside", {
        className: `samai-timeline-example${exampleVisual && exampleCopy ? " has-visual" : ""}`
      }, [exampleVisual, exampleCopy]) : null
    ])
  ]);
}

function renderTimeline(node, context) {
  const p = opts(node);
  const items = findChildren(node, "timelineItem");
  return el("ol", {
    id: p.id,
    className: "samai-timeline",
    attrs: { "aria-label": p.ariaLabel || p.title || "خط زمني" }
  }, items.map((item, index) => renderTimelineItem(item, Object.assign({}, context, { index }))));
}

register("timeline", {
  render: renderTimeline,
  meta: {
    doc: "Ordered stages where each step adds to the one before it.",
    opts: { ariaLabel: "string?" },
    check(node, v) {
      if (v.findChildren(node, "timelineItem").length < 2) {
        v.fail("timeline must have at least two timelineItem children.");
      }
    }
  }
});

register("timelineItem", {
  render: renderTimelineItem,
  meta: {
    doc: "One timeline stage with an optional worked example and diagram.",
    value: true,
    parents: ["timeline"],
    surface: "static",
    opts: { title: "string", period: "string?", icon: "icon?", text: "string?", exampleText: "string?" }
  }
});

    <script type="samai/module" data-id="components/disclosure.js">
// Progressive-disclosure surfaces: accordion, tab set, flip card.

import { DEFAULTS } from "../core/contract.js";
import { asArray, asText, el, findChildren, icon, iconText, interpolate, nest, nextId, opts, validClassNames } from "../core/dom.js";
import { formatDigits } from "../core/digits.js";
import { listen, state } from "../core/lifecycle.js";
import { register, renderStack } from "../core/render.js";

function renderAccordionItem(node, context) {
  const p = opts(node);
  const bodyId = nextId("accordion-panel");
  const button = el("button", {
    className: "samai-accordion-toggle",
    type: "button",
    attrs: { "aria-expanded": "false", "aria-controls": bodyId }
  }, [
    el("span", { className: "samai-accordion-icon" }, icon(p.icon, "circle")),
    el("span", { className: "samai-accordion-title", text: p.title }),
    icon("chevron-down")
  ]);
  const body = el("div", {
    id: bodyId,
    className: "samai-accordion-panel",
    hidden: true
  }, [
    asArray(p.rows).map((row) => el("div", {
      className: `samai-accordion-row samai-row-${validClassNames(row.tone || "neutral")}`
    }, [
      el("strong", {}, iconText(row.icon, row.label, row.tone === "risk" ? "triangle-exclamation" : "circle-check")),
      el("p", { text: row.text })
    ])),
    nest(node).length ? renderStack(nest(node), context) : null
  ]);
  return el("article", { className: "samai-accordion-item" }, [button, body]);
}

function renderAccordion(node, context) {
  const p = opts(node);
  const items = findChildren(node, "accordionItem");
  const shell = el("div", { id: p.id, className: "samai-accordion" }, [
    el("div", { className: "samai-activity-head" }, [
      el("p", { text: p.instructions }),
      el("span", { className: "samai-activity-count", attrs: { "aria-live": "polite" } }, [
        icon("list-check"),
        document.createTextNode(interpolate(p.countTemplate || "اكتمل: {current} من {total}", {
          current: formatDigits(0),
          total: formatDigits(items.length)
        }))
      ])
    ]),
    el("div", { className: "samai-accordion-items" }, items.map((item, index) => (
      renderAccordionItem(item, Object.assign({}, context, { index }))
    ))),
    el("div", {
      className: "samai-activity-complete",
      hidden: true,
      attrs: { role: "status", tabindex: "-1" }
    }, iconText(p.completeIcon, p.completeText || DEFAULTS.complete, "circle-check"))
  ]);
  state.set(shell, { p, total: items.length });
  return shell;
}

function renderTabPanel(node, context, identifiers) {
  const p = opts(node);
  const introParts = asArray(p.introParts);
  const ids = identifiers || {};
  return el("section", {
    id: ids.panelId,
    className: "samai-tab-panel",
    hidden: context.index !== 0,
    attrs: {
      role: "tabpanel",
      tabindex: "0",
      "aria-labelledby": ids.tabId
    }
  }, [
    introParts.length ? el("p", { className: "samai-tab-intro" }, introParts.map((part) => (
      part.strong ? el("strong", { text: part.text }) : document.createTextNode(asText(part.text))
    ))) : (p.intro ? el("p", { className: "samai-tab-intro", text: p.intro }) : null),
    renderStack(nest(node), context, "samai-tab-stack")
  ]);
}

function renderTabSet(node, context) {
  const p = opts(node);
  const id = p.id || nextId("tab-set");
  const panels = findChildren(node, "tabPanel");
  const identifiers = panels.map((_, index) => ({
    tabId: `${id}-tab-${index + 1}`,
    panelId: `${id}-panel-${index + 1}`
  }));
  const variant = p.variant === "beneficiary" ? " samai-tab-set-beneficiary" : "";
  const shell = el("div", { id, className: `samai-tab-set${variant}` }, [
    p.instructions ? el("p", { className: "samai-activity-instructions", text: p.instructions }) : null,
    el("div", {
      className: "samai-tab-list",
      attrs: { role: "tablist", "aria-label": p.ariaLabel || "المحتوى المصنّف" }
    }, panels.map((panel, index) => {
      const panelOpts = opts(panel);
      return el("button", {
        id: identifiers[index].tabId,
        className: "samai-tab",
        type: "button",
        attrs: {
          role: "tab",
          "aria-selected": index === 0 ? "true" : "false",
          "aria-controls": identifiers[index].panelId,
          tabindex: index === 0 ? "0" : "-1",
          "data-tab": index
        }
      }, iconText(panelOpts.icon, panelOpts.title, "folder-open"));
    })),
    el("div", { className: "samai-tab-panels" }, panels.map((panel, index) => (
      renderTabPanel(panel, Object.assign({}, context, { index }), identifiers[index])
    )))
  ]);
  state.set(shell, { total: panels.length });
  return shell;
}

function renderFlipCard(node) {
  const p = opts(node);
  return el("button", {
    className: "samai-flip-card",
    type: "button",
    attrs: { "aria-label": p.ariaLabel || p.frontTitle, "aria-pressed": "false" }
  }, el("span", { className: "samai-flip-inner" }, [
    el("span", { className: "samai-flip-face samai-flip-front" }, [
      el("span", { className: "samai-flip-icon" }, icon(p.icon, "lightbulb")),
      el("strong", { text: p.frontTitle }),
      el("span", { text: p.frontText }),
      el("small", {}, iconText("hand-pointer", p.hint || "الإجراء المناسب"))
    ]),
    el("span", { className: "samai-flip-face samai-flip-back" }, [
      el("strong", {}, iconText(p.backIcon, p.backLabel || "الإجراء المناسب", "shield-halved")),
      el("span", { text: p.backText })
    ])
  ]));
}

function initializeAccordion(shell) {
  const config = state.get(shell);
  const items = Array.from(shell.querySelectorAll(".samai-accordion-item"));
  const count = shell.querySelector(".samai-activity-count");
  const complete = shell.querySelector(".samai-activity-complete");
  const visited = new Set();
  const update = () => {
    count.replaceChildren(icon("list-check"), document.createTextNode(interpolate(
      config.p.countTemplate || "اكتمل: {current} من {total}",
      { current: formatDigits(visited.size), total: formatDigits(config.total) }
    )));
    if (visited.size === config.total) {
      complete.hidden = false;
    }
  };
  items.forEach((item, index) => {
    const button = item.querySelector(".samai-accordion-toggle");
    const panel = item.querySelector(".samai-accordion-panel");
    listen(button, "click", () => {
      const opening = panel.hidden;
      panel.hidden = !opening;
      button.setAttribute("aria-expanded", String(opening));
      item.classList.toggle("is-open", opening);
      if (opening) {
        visited.add(index);
        item.classList.add("is-visited");
        update();
      }
    });
  });
  update();
}

function initializeTabSet(shell) {
  const tabs = Array.from(shell.querySelectorAll(".samai-tab"));
  const panels = Array.from(shell.querySelectorAll(".samai-tab-panel"));
  const rtl = document.documentElement.dir === "rtl";

  function show(index, moveFocus) {
    const current = Math.max(0, Math.min(tabs.length - 1, index));
    tabs.forEach((tab, tabIndex) => {
      const selected = tabIndex === current;
      tab.setAttribute("aria-selected", String(selected));
      tab.tabIndex = selected ? 0 : -1;
    });
    panels.forEach((panel, panelIndex) => { panel.hidden = panelIndex !== current; });
    if (moveFocus) tabs[current].focus();
  }

  tabs.forEach((tab, index) => listen(tab, "click", () => show(index, false)));
  const tabList = shell.querySelector(".samai-tab-list");
  listen(tabList, "keydown", (event) => {
    const index = tabs.indexOf(document.activeElement);
    if (index < 0) return;
    let target = null;
    const forwardKey = rtl ? "ArrowLeft" : "ArrowRight";
    const backwardKey = rtl ? "ArrowRight" : "ArrowLeft";
    if (event.key === forwardKey) target = (index + 1) % tabs.length;
    if (event.key === backwardKey) target = (index - 1 + tabs.length) % tabs.length;
    if (event.key === "Home") target = 0;
    if (event.key === "End") target = tabs.length - 1;
    if (target === null) return;
    event.preventDefault();
    show(target, true);
  });
  show(0, false);
}

function initializeFlipCard(card) {
  listen(card, "click", () => {
    const flipped = card.classList.toggle("is-flipped");
    card.setAttribute("aria-pressed", String(flipped));
  });
}

register("tabPanel", {

    opts: { title: "string", icon: "icon?", intro: "string?", introParts: "{text,strong}[]?" },
    check(node, v) {
      if (v.p.introParts !== undefined && (!Array.isArray(v.p.introParts) || v.p.introParts.some((part) => !part || typeof part.text !== "string" || (part.strong !== undefined && typeof part.strong !== "boolean")))) {
        v.fail(`${v.path}.opts.introParts must contain text and an optional boolean strong flag.`);

});

register("flipCard", {
  render: renderFlipCard,

  meta: {
    doc: "Short risk-to-action reveal on a single tap.",

    check(node, v) {
      if (v.asText(v.p.frontText).length > 180 || v.asText(v.p.backText).length > 240) {
        v.warn(`${v.path} has long flip-card text that may overflow at narrow widths.`);
      }
    }
  }
});

function renderProcessStage(node, context) {

function renderProcessStepper(node, context) {

        el("span", { text: stageProps.title })
      ]);
    })),
    el("div", { className: "samai-process-panels" }, stages.map((stage, index) => (
      renderProcessStage(stage, Object.assign({}, context, { index, total: stages.length }))
    )))
  ]);
  state.set(shell, { total: stages.length });

}

function renderRedaction(node) {
  const p = opts(node);
  const targetTotal = asArray(p.segments).filter((segment) => segment.target).length;
  const prompt = el("div", { className: "samai-redaction-prompt" }, [
    p.promptLabel ? el("strong", { text: `${p.promptLabel}: ` }) : null

      prompt.append(el("button", {

          "data-replacement": segment.replacement || `[${segment.label || "بيانات"}]`,

  const shell = el("div", { id: p.id, className: "samai-redaction" }, [

      ]) : null

  state.set(shell, Object.assign({}, p, { targetTotal }));

}

function renderInspection(node) {

      ))
    ]),

        el("div", { className: "samai-inspection-detail-head" }, [el("strong"), el("span")]),
        el("div", { className: "samai-inspection-row" }, [el("small"), el("p")]),

function initializeClassifier(shell) {
  const p = state.get(shell);
  const stage = shell.querySelector(".samai-classifier-stage");
  const stepLabel = shell.querySelector(".samai-classifier-step");
  const scoreLabel = shell.querySelector(".samai-classifier-score");
  const complete = shell.querySelector(".samai-classifier-complete");
  const restart = shell.querySelector(".samai-restart");
  let index = 0;
  let score = 0;

  function render(moveFocus) {
    const cases = asArray(p.cases);
    if (index >= cases.length) {
      stage.hidden = true;
      complete.hidden = false;
      if (moveFocus) complete.focus();
      return;
    }
    stage.hidden = false;
    complete.hidden = true;
    const item = cases[index];
    stepLabel.textContent = interpolate(p.stepTemplate || "الحالة {current} من {total}", {
      current: formatDigits(index + 1),
      total: formatDigits(cases.length)
    });
    scoreLabel.textContent = interpolate(p.scoreTemplate || "إجابات صحيحة: {score}", {
      score: formatDigits(score)
    });
    const feedback = el("div", { className: "samai-classifier-feedback", attrs: { role: "status" } });
    const next = el("button", { className: "samai-classifier-next", type: "button", hidden: true }, (
      textIcon(index === cases.length - 1 ? (p.finishLabel || "عرض الخلاصة") : (p.nextLabel || "الحالة التالية"), "arrow-left")
    ));
    const options = el("div", { className: "samai-classifier-options" }, asArray(p.categories).map((category) => (
      el("button", {
        className: "samai-classifier-option",
        type: "button",
        text: category.label,
        attrs: { "data-key": category.key }
      })
    )));
    const view = el("article", { className: "samai-classifier-case" }, [
      el("span", { className: "samai-classifier-case-title", text: item.title || `الحالة ${formatDigits(index + 1)}` }),
      el("h3", {}, iconText(item.icon, item.context, "file-lines")),
      item.prompt ? el("p", { text: item.prompt }) : null,
      options,
      feedback,
      next
    ]);
    stage.replaceChildren(view);
    options.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => {
        const correct = button.dataset.key === item.correctKey;
        if (correct) score += 1;
        options.querySelectorAll("button").forEach((option) => {
          option.disabled = true;
          if (option.dataset.key === item.correctKey) option.classList.add("is-correct");
        });
        button.classList.add(correct ? "is-selected-correct" : "is-selected-wrong");
        feedback.textContent = item.feedback || "";
        feedback.classList.add("is-visible", correct ? "is-correct" : "is-wrong");
        next.hidden = false;
        scoreLabel.textContent = interpolate(p.scoreTemplate || "إجابات صحيحة: {score}", {
          score: formatDigits(score)
        });
      }, { once: true });
    });
    next.addEventListener("click", () => {
      index += 1;
      render(true);
    });
    if (moveFocus) stage.focus();
  }

  listen(restart, "click", () => {
    index = 0;
    score = 0;
    render(true);
  });
  render(false);
}

function initializeGuidedSequence(shell) {
  const config = state.get(shell);
  const nodes = Array.from(shell.querySelectorAll(".samai-guided-node"));
  const count = shell.querySelector(".samai-guided-count");
  const meter = shell.querySelector(".samai-guided-meter");
  const fill = meter.querySelector("i");
  const stage = shell.querySelector(".samai-guided-stage");
  const dots = Array.from(shell.querySelectorAll(".samai-guided-dots button"));
  const previous = shell.querySelector(".samai-guided-previous");
  const next = shell.querySelector(".samai-guided-next");
  const play = shell.querySelector(".samai-guided-play");
  let current = 0;
  let timer = null;

  function setPlayState(running) {
    if (!play) return;
    play.setAttribute("aria-pressed", String(running));
    play.replaceChildren(
      icon(running ? "pause" : "play"),
      el("span", { text: running ? (config.p.pauseLabel || "إيقاف") : (config.p.playLabel || "تشغيل") })
    );
  }

  function stop() {
    if (timer !== null) window.clearInterval(timer);
    timer = null;
    setPlayState(false);
  }

  function show(index, moveFocus) {
    current = Math.max(0, Math.min(config.steps.length - 1, index));
    const step = config.steps[current];
    const activeKeys = asArray(step.activeKeys);
    const currentKey = activeKeys[activeKeys.length - 1];
    nodes.forEach((item) => {
      const active = activeKeys.includes(item.dataset.nodeKey);
      item.classList.toggle("is-active", active);
      if (active) item.setAttribute("data-active", "");
      else item.removeAttribute("data-active");
      if (item.dataset.nodeKey === currentKey) item.setAttribute("aria-current", "step");
      else item.removeAttribute("aria-current");
    });
    count.textContent = interpolate(config.p.stepTemplate || "الخطوة {current} من {total}", {
      current: formatDigits(current + 1),
      total: formatDigits(config.steps.length)
    });
    const percent = config.steps.length > 1 ? (current / (config.steps.length - 1)) * 100 : 100;
    fill.style.width = `${percent}%`;
    meter.setAttribute("aria-valuenow", String(current + 1));
    stage.querySelector("h3").textContent = step.title || "";
    stage.querySelector("p").textContent = step.text || "";
    dots.forEach((dot, dotIndex) => {
      const selected = dotIndex === current;
      dot.classList.toggle("is-active", selected);
      if (selected) dot.setAttribute("aria-current", "step");
      else dot.removeAttribute("aria-current");
    });
    previous.disabled = current === 0;
    next.replaceChildren(textIcon(
      current === config.steps.length - 1
        ? (config.p.restartLabel || DEFAULTS.restart)
        : (config.p.nextLabel || DEFAULTS.next),
      current === config.steps.length - 1 ? "rotate-right" : "chevron-left"
    ));
    if (moveFocus) stage.focus();
  }

  dots.forEach((dot, index) => listen(dot, "click", () => {
    stop();
    show(index, true);
  }));
  const dotGroup = shell.querySelector(".samai-guided-dots");
  listen(dotGroup, "keydown", (event) => {
    const active = document.activeElement;
    const index = dots.indexOf(active);
    if (index < 0) return;
    let target = null;
    if (event.key === "Home") target = 0;
    if (event.key === "End") target = dots.length - 1;
    if (event.key === "ArrowRight") target = (index + 1) % dots.length;
    if (event.key === "ArrowLeft") target = (index - 1 + dots.length) % dots.length;
    if (target === null) return;
    event.preventDefault();
    stop();
    show(target, false);
    dots[target].focus();
  });
  listen(previous, "click", () => {
    stop();
    show(current - 1, true);
  });
  listen(next, "click", () => {
    stop();
    show(current === config.steps.length - 1 ? 0 : current + 1, true);
  });
  if (play) listen(play, "click", () => {
    if (timer !== null) {
      stop();
      return;
    }
    if (current === config.steps.length - 1) show(0, false);
    setPlayState(true);
    timer = window.setInterval(() => {
      if (current === config.steps.length - 1) {
        stop();
        return;
      }
      show(current + 1, false);
    }, Math.max(1600, Number(config.p.autoplayMs) || 3400));
  });
  pushCleanup(stop);
  show(0, false);
}

function initializeProcess(shell) {
  const config = state.get(shell);
  const tabs = Array.from(shell.querySelectorAll(".samai-process-step"));
  const panels = Array.from(shell.querySelectorAll(".samai-process-panel"));
  let current = 0;
  let unlocked = 0;

  function show(index, moveFocus) {
    current = Math.max(0, Math.min(index, config.total - 1));
    tabs.forEach((tab, tabIndex) => {
      tab.disabled = tabIndex > unlocked;
      tab.classList.toggle("is-complete", tabIndex < unlocked);
      if (tabIndex === current) tab.setAttribute("aria-current", "step");
      else tab.removeAttribute("aria-current");
    });
    panels.forEach((panel, panelIndex) => { panel.hidden = panelIndex !== current; });
    if (moveFocus) panels[current].focus();
  }

  tabs.forEach((tab, index) => listen(tab, "click", () => show(index, true)));
  panels.forEach((panel, index) => {
    const previous = panel.querySelector("[data-action='previous']");
    const next = panel.querySelector("[data-action='next']");
    previous.disabled = index === 0;
    listen(previous, "click", () => show(index - 1, true));
    listen(next, "click", () => {
      if (index === config.total - 1) {
        unlocked = 0;
        show(0, true);
        return;
      }
      unlocked = Math.max(unlocked, index + 1);
      show(index + 1, true);
    });
  });
  show(0, false);
}

function initializeRedaction(shell) {
  const p = state.get(shell);
  const targets = Array.from(shell.querySelectorAll(".samai-redaction-target"));
  const count = shell.querySelector(".samai-redaction-count");
  const risk = shell.querySelector(".samai-redaction-risk");
  const meter = shell.querySelector(".samai-redaction-meter i");
  const feedback = shell.querySelector(".samai-redaction-feedback");
  const result = shell.querySelector(".samai-redaction-result");
  const reset = shell.querySelector(".samai-redaction-reset");
  const originals = targets.map((target) => target.textContent);

  function update() {
    const masked = targets.filter((target) => target.classList.contains("is-masked")).length;
    const remaining = p.targetTotal - masked;
    const percent = p.targetTotal ? (remaining / p.targetTotal) * 100 : 0;
    count.textContent = interpolate(p.countTemplate || "استُبدلت: {current} من {total}", {
      current: formatDigits(masked),
      total: formatDigits(p.targetTotal)
    });
    risk.textContent = remaining === 0 ? (p.safeLabel || "مستوى الخطر: منخفض") : interpolate(
      p.riskTemplate || "مستوى الخطر: {remaining} عناصر",
      { remaining: formatDigits(remaining) }
    );
    meter.style.width = `${percent}%`;
    if (remaining === 0) {
      feedback.textContent = p.completionFeedback || DEFAULTS.complete;
      result.hidden = false;
      reset.hidden = false;
    } else {
      feedback.textContent = interpolate(p.partialFeedbackTemplate || "بقي {remaining} من {total}", {
        current: formatDigits(masked),
        remaining: formatDigits(remaining),
        total: formatDigits(p.targetTotal)
      });
      result.hidden = true;
      reset.hidden = true;
    }
  }

  targets.forEach((target) => listen(target, "click", () => {
    if (target.classList.contains("is-masked")) return;
    target.classList.add("is-masked");
    target.textContent = target.dataset.replacement;
    target.setAttribute("aria-pressed", "true");
    update();
  }));
  listen(reset, "click", () => {
    targets.forEach((target, index) => {
      target.classList.remove("is-masked");
      target.textContent = originals[index];
      target.setAttribute("aria-pressed", "false");
    });
    update();
    targets[0]?.focus();
  });
  update();
}

function initializeInspection(shell) {
  const p = state.get(shell);
  const targets = Array.from(shell.querySelectorAll(".samai-inspection-target"));
  const count = shell.querySelector(".samai-inspection-count");
  const reset = shell.querySelector(".samai-inspection-reset");
  const placeholder = shell.querySelector(".samai-inspection-placeholder");
  const detail = shell.querySelector(".samai-inspection-detail");
  const complete = shell.querySelector(".samai-inspection-complete");
  const found = new Set();

  function updateCount() {
    count.replaceChildren(icon("magnifying-glass"), document.createTextNode(interpolate(
      p.countTemplate || "اكتُشِف: {current} من {total}",
      { current: formatDigits(found.size), total: formatDigits(p.issueTotal) }
    )));
    complete.hidden = found.size !== p.issueTotal;
  }

  targets.forEach((target, index) => listen(target, "click", () => {
    const segment = asArray(p.responseSegments)[index];
    target.setAttribute("aria-pressed", "true");
    target.classList.add(segment.issue ? "is-issue" : "is-valid");
    if (segment.issue) found.add(index);
    placeholder.hidden = true;
    detail.hidden = false;
    detail.querySelector(".samai-inspection-detail-head strong").textContent = segment.title || segment.text;
    detail.querySelector(".samai-inspection-detail-head span").textContent = segment.category || "";
    const rows = detail.querySelectorAll(".samai-inspection-row");
    rows[0].querySelector("small").textContent = segment.issue ? (p.issueWhyLabel || "لماذا يُعدّ مشكلة") : (p.validWhyLabel || "لماذا تُعدّ سليمة");
    rows[0].querySelector("p").textContent = segment.why || "";
    rows[1].querySelector("small").textContent = segment.issue ? (p.issueHowLabel || "كيف يُتحقَّق منه") : (p.validHowLabel || "كيف تُدعَم عند الحاجة");
    rows[1].querySelector("p").textContent = segment.how || "";
    updateCount();
  }));

  listen(reset, "click", () => {
    found.clear();
    targets.forEach((target) => {
      target.classList.remove("is-issue", "is-valid");
      target.setAttribute("aria-pressed", "false");
    });
    placeholder.hidden = false;
    detail.hidden = true;
    complete.hidden = true;
    updateCount();
    targets[0]?.focus();
  });
  updateCount();
}

register("classifier", {
  render: renderClassifier,
  init: { selector: ".samai-classifier", setup: initializeClassifier },
  meta: {
    doc: "Repeated category decision across a series of cases.",
    interactive: true,
    leaf: true,
    opts: { categories: "{key,label,description}[]", cases: "{context,prompt,correctKey,feedback}[]", instructions: "string?" },
    check(node, v) {
      const keys = new Set(v.asArray(v.p.categories).map((category) => category.key));
      v.asArray(v.p.cases).forEach((item, index) => {
        if (!keys.has(item.correctKey)) v.fail(`classifier case ${index + 1} has an unknown correctKey.`);
      });
    }
  }
});

register("guidedSequence", {
  render: renderGuidedSequence,
  init: { selector: ".samai-guided-sequence", setup: initializeGuidedSequence },
  meta: {
    doc: "One-at-a-time walkthrough that lights up nodes in a fixed topology.",
    interactive: true,
    leaf: true,
    opts: { nodes: "{key,title,icon,description}[]", steps: "{title,text,activeKeys}[]", autoplayMs: "number?" },
    check(node, v) {
      const nodes = v.asArray(v.p.nodes);
      const steps = v.asArray(v.p.steps);
      const keys = new Set(nodes.map((item) => item.key));
      if (nodes.length < 2 || keys.size !== nodes.length || Array.from(keys).some((key) => !/^[a-z][a-z0-9_-]*$/.test(v.asText(key)))) {
        v.fail("guidedSequence requires at least two nodes with unique semantic keys.");
      }
      if (steps.length < 2 || steps.some((step) => !v.asArray(step.activeKeys).length || v.asArray(step.activeKeys).some((key) => !keys.has(key)))) {
        v.fail("guidedSequence requires at least two steps whose activeKeys match node keys.");
      }
    }
  }
});

register("processStepper", {
  render: renderProcessStepper,
  init: { selector: ".samai-process", setup: initializeProcess },
  meta: {
    doc: "Learner-controlled procedure that unlocks stage by stage.",
    interactive: true,
    opts: { ariaLabel: "string?" },
    check(node, v) {
      const total = v.findChildren(node, "processStage").length;
      if (total < 2 || total > 6) v.fail("processStepper must have 2-6 processStage children.");
    }
  }
});

register("processStage", {
  render: renderProcessStage,
  meta: {
    doc: "One stage of a processStepper.",
    value: true,
    parents: ["processStepper"],
    surface: "static",
    opts: { title: "string", icon: "icon?", instruction: "string?", status: "string?" }
  }
});

register("redactionExercise", {
  render: renderRedaction,
  init: { selector: ".samai-redaction", setup: initializeRedaction },
  meta: {
    doc: "Remove unnecessary personal detail from a prompt before sending it.",
    interactive: true,
    leaf: true,
    opts: { segments: "{text,target,label,replacement}[]", instruction: "string?", cleanPrompt: "string?" },
    check(node, v) {
      const segments = v.asArray(v.p.segments);
      if (!segments.some((segment) => segment.target) || !segments.some((segment) => !segment.target)) {
        v.fail("redactionExercise requires target and non-target segments.");
      }
    }
  }
});

register("inspectionExercise", {
  render: renderInspection,
  init: { selector: ".samai-inspection", setup: initializeInspection },
  meta: {
    doc: "Inspect claims in a generated response and separate issues from sound statements.",
    interactive: true,
    leaf: true,
    opts: { userPrompt: "string", responseSegments: "{text,issue,why,how}[]", instruction: "string?" },
    check(node, v) {
      const segments = v.asArray(v.p.responseSegments);
      if (!segments.some((segment) => segment.issue) || !segments.some((segment) => !segment.issue)) {
        v.fail("inspectionExercise requires issue and valid response segments.");
      }
    }
  }
});

    </script>
    <script type="samai/module" data-id="components/simulator.js">
// A mock AI application window: the parts a learner meets in a real product —
// the agent toggle in the title bar, the tools behind the plus button, the model
// and thinking pickers inside the composer, the rail with its destinations, the
// account at its foot.
//
// Everything the window shows has a default, and the defaults together are the
// plain assistant window of module 1. A lesson that needs that window writes
// `{ name: "appSimulator" }` and overrides only what differs; a lesson that needs
// a narrower one turns parts off through `chrome`.
//
// Beyond the chat, a rail destination can open a `screen`, and a screen is built
// from one small vocabulary of blocks — tiles, rows, columns, a document, an
// upload queue, a notice, a popup menu, form fields, choices, actions. The same
// vocabulary fills a `modal`, so a product's dialogs need no second grammar.
// Blocks nest, which is how a two-panel layout is expressed without a layout
// language.
//
// `fields` gives the window state the learner can change: a block binds to a
// field, `{name}` in any authored string reads it back, and an action can set
// it. That is what turns the walkthrough into something the learner operates
// rather than watches.
//
// A `tour` walks a spotlight across those parts and can compose a request as it
// goes: typing the prompt, attaching a file, choosing a model, moving to a
// screen, opening a dialog, sending, and showing the reply. Each step declares
// the state it wants, and the window is rebuilt by replaying every step up to
// the current one, so jumping backwards or straight to a dot lands on exactly
// the same picture. With `journey` the window narrows and the components working
// behind it are shown alongside, step by step. Without a tour the window is live
// and the learner operates it.

import {
  asArray, asText, el, icon, iconText, interpolate, nextId, opts, textIcon, validClassNames
} from "../core/dom.js";
import { DEFAULTS } from "../core/contract.js";
import { formatDigits } from "../core/digits.js";
import { listen, pushCleanup, state } from "../core/lifecycle.js";
import { register } from "../core/render.js";

// Parts a tour step can spotlight. Nav items, pickers and every keyed block add
// their own name to this set.
const PARTS = [
  "app", "agent", "threads", "account", "chat", "messages", "status",
  "composer", "field", "tools", "send", "screen", "modal", "engine"
];

const CHAT = "chat";
const NAME = /^[a-z][a-z0-9_-]*$/;
const BLOCK_TYPES = [
  "hero", "tiles", "rows", "columns", "panel", "note", "empty",
  "upload", "notice", "doc", "menu", "field", "choices", "actions"
];
const CONTROLS = ["text", "textarea", "select", "time"];

// The plain assistant window, in words. A lesson overrides a key to change it and
// passes an empty array or `chrome: {…}` to remove it.
const TEXT = {
  appName: "تطبيق ذكاء اصطناعي",
  agentsLabel: "الوكيل",
  toolsLabel: "الأدوات",
  sendLabel: "إرسال",
  newChat: "محادثة جديدة",
  threadsLabel: "المحادثات السابقة",
  placeholder: "اكتب الأمر هنا...",
  emptyText: "ابدأ بكتابة الأمر",
  stepsLabel: "خطوات الجولة",
  step: "الخطوة",
  close: "إغلاق",
  engineLabel: "خلف الواجهة"
};

const DEFAULT_AGENTS = [
  { key: "chat", label: "محادثة" },
  { key: "work", label: "عمل" }
];

const DEFAULT_TOOLS = [
  { icon: "paperclip", label: "إرفاق ملف" },
  { icon: "globe", label: "البحث في الويب" },
  { icon: "image", label: "توليد الصور" },
  { icon: "code", label: "تنفيذ برمجي" }
];

const DEFAULT_PICKERS = [
  {
    key: "model",
    label: "النموذج",
    value: "صغير (سريع)",
    options: [
      { label: "صغير (سريع)", chip: "نموذج صغير" },
      { label: "متوسط (متوازن)", chip: "نموذج متوسط" },
      { label: "كبير (ذكي)", chip: "نموذج كبير" }
    ]
  },
  {
    key: "thinking",
    label: "التفكير",
    value: "لحظي (بدون تفكير)",
    options: [
      { label: "لحظي (بدون تفكير)", chip: "تفكير لحظي" },
      { label: "متوسّط (يفكر قبل الإجابة)", chip: "تفكير متوسّط" },
      { label: "مرتفع (للمهام الصعبة)", chip: "تفكير مرتفع" }
    ]
  }
];

const DEFAULT_ACCOUNT = { name: "حسابي", detail: "اشتراك مجاني" };

// Every surface the window can show, and whether it shows by default. The two
// that default to off are the ones the plain window has no use for: a product's
// contextual title bar and its overflow button.
const CHROME = {
  titleBar: true,
  dots: true,
  appName: true,
  agents: true,
  screenTitle: false,
  overflow: false,
  sidebar: true,
  newChat: true,
  threads: true,
  account: true,
  composer: true,
  tools: true,
  pickers: true,
  send: true
};

function flags(p) {
  const given = p.chrome && typeof p.chrome === "object" ? p.chrome : {};
  const result = Object.assign(Object.create(null), CHROME);
  Object.keys(CHROME).forEach((key) => {
    if (given[key] !== undefined) result[key] = Boolean(given[key]);
  });
  return result;
}

/** A default that a lesson replaces by naming it, and removes by emptying it. */
function orDefault(value, fallback) {
  return value === undefined ? fallback : asArray(value);
}

/** `{field}` in any authored string reads the current field values back. */
function fill(value, values) {
  const text = asText(value);
  return text.includes("{") ? interpolate(text, values) : text;
}

function partAttrs(item) {
  return { "data-part": item && item.key ? asText(item.key) : null };
}

function isObject(value) {
  return Boolean(value) && typeof value === "object" && !Array.isArray(value);
}

/** An option is a bare string, or a menu label with a shorter chip label. */
function toOption(option) {
  if (isObject(option)) {
    const label = asText(option.label);
    return { label, chip: asText(option.chip, label) };
  }
  const label = asText(option);
  return { label, chip: label };
}

function toPicker(picker) {
  const options = asArray(picker.options).map(toOption);
  return {
    key: asText(picker.key),
    label: asText(picker.label),
    options,
    value: asText(picker.value, options.length ? options[0].label : "")
  };
}

function toolList(p) {
  return orDefault(p.tools, DEFAULT_TOOLS);
}

function pickerList(p) {
  return orDefault(p.pickers, DEFAULT_PICKERS).map(toPicker);
}

function agentList(p) {
  return orDefault(p.agents, DEFAULT_AGENTS);
}

function screenEntries(p) {
  return Object.entries(isObject(p.screens) ? p.screens : {}).filter(([, screen]) => isObject(screen));
}

function modalEntries(p) {
  return Object.entries(isObject(p.modals) ? p.modals : {}).filter(([, modal]) => isObject(modal));
}

function fieldDefaults(p) {
  const values = Object.create(null);
  if (isObject(p.fields)) {
    Object.entries(p.fields).forEach(([key, value]) => { values[key] = asText(value); });
  }
  return values;
}

/**
 * Keys a tour step may open, in the order they appear in the window. A surface
 * `chrome` has switched off is not among them, so a step cannot point at
 * something the learner will never see.
 */
function menuKeys(p) {
  const chrome = flags(p);
  return [
    chrome.composer && chrome.tools && toolList(p).length ? "tools" : null,
    ...(chrome.composer && chrome.pickers ? pickerList(p).map((picker) => picker.key) : [])
  ].filter(Boolean);
}

/** Blocks nest, so a screen's named parts are collected the same way at any depth. */
function blockKeys(blocks) {
  return asArray(blocks).filter(isObject).flatMap((block) => [
    block.key,
    ...asArray(block.items).flatMap((item) => [
      item && item.key,
      item && item.action && item.action.key,
      ...blockKeys(item && item.blocks)
    ]),
    ...blockKeys(block.blocks),
    block.action && block.action.key
  ]).filter(Boolean).map(asText);
}

function surfaceKeys(surface) {
  const menu = isObject(surface.menu) ? surface.menu : {};
  return [
    surface.action && surface.action.key,
    ...asArray(menu.items).map((item) => item && item.key),
    ...blockKeys(surface.blocks),
    ...asArray(surface.actions).map((item) => item && item.key)
  ].filter(Boolean).map(asText);
}

/**
 * Parts the whole window offers a tour: the built-ins plus everything named.
 * Journey nodes are deliberately absent — a step reaches them through `at`, and
 * keeping them out of this namespace is what lets a track name its nodes after
 * the components they stand for without colliding with the window's own parts.
 */
function partKeys(p) {
  const chrome = flags(p);
  return [
    ...PARTS,
    ...(chrome.sidebar ? asArray(p.nav).map((item) => item.key).filter(Boolean).map(asText) : []),
    ...(chrome.composer && chrome.pickers ? pickerList(p).map((picker) => picker.key) : []),
    ...screenEntries(p).flatMap(([, screen]) => surfaceKeys(screen)),
    ...modalEntries(p).flatMap(([, modal]) => surfaceKeys(modal))
  ];
}

// ─── Blocks ──────────────────────────────────────────────────────────────────
// One renderer per block type. Each takes the authored block and the live field
// values, and returns an element. Nothing here reads tour state: a block is a
// pure function of what the lesson wrote and what the learner has typed.

function renderState(value, values) {
  const status = isObject(value) ? value : { label: asText(value) };
  const label = fill(status.label, values);
  if (!label) return null;
  return el("span", {
    className: `samai-sim-state${status.tone ? ` is-${validClassNames(status.tone)}` : ""}`
  }, [icon(status.icon, "circle-check"), el("span", { text: label })]);
}

/** An action is a button when it does something, and a label when it only shows. */
function renderAction(action, values, className) {
  if (!isObject(action)) return null;
  const live = action.set || action.go || action.screen || action.modal || action.close || action.nav;
  const parts = [
    action.icon ? icon(action.icon) : null,
    el("span", { text: fill(action.label, values) })
  ];
  const attrs = Object.assign(partAttrs(action), {
    "data-set": action.set ? JSON.stringify(action.set) : null,
    "data-go": action.go === undefined ? null : String(action.go),
    "data-screen": action.screen ? asText(action.screen) : null,
    "data-modal": action.modal ? asText(action.modal) : null,
    "data-nav": action.nav ? asText(action.nav) : null,
    "data-close": action.close ? "" : null,
    disabled: action.disabled ? "" : null
  });
  const name = `${className}${action.variant ? ` is-${validClassNames(action.variant)}` : ""}`;
  return live
    ? el("button", { className: name, type: "button", attrs }, parts)
    : el("span", { className: name, attrs }, parts);
}

function renderHero(block, values) {
  return el("div", { className: "samai-sim-hero", attrs: partAttrs(block) }, [
    el("span", { className: "samai-sim-hero-icon" }, icon(block.icon, "wand-magic-sparkles")),
    el("b", { text: fill(block.title, values) }),
    block.text ? el("p", { text: fill(block.text, values) }) : null
  ]);
}

function renderTiles(block, values) {
  return el("div", {
    className: `samai-sim-tiles${block.columns ? ` is-${Math.max(1, Math.min(4, Number(block.columns) || 3))}` : ""}`,
    attrs: partAttrs(block)
  }, asArray(block.items).map((tile) => el("span", {
    className: `samai-sim-tile${tile.on ? " is-on" : ""}`,
    attrs: partAttrs(tile)
  }, [
    icon(tile.icon, "folder"),
    el("b", { text: fill(tile.title, values) }),
    tile.meta ? el("small", { text: fill(tile.meta, values) }) : null
  ])));
}

function renderRow(row, values) {
  const chips = asArray(row.chips);
  return el("span", { className: "samai-sim-line", attrs: partAttrs(row) }, [
    row.icon ? el("span", { className: "samai-sim-line-icon" }, icon(row.icon)) : null,
    el("span", { className: "samai-sim-line-text" }, [
      row.title ? el("b", { text: fill(row.title, values) }) : null,
      row.text ? el("small", { text: fill(row.text, values) }) : null,
      chips.length ? el("span", { className: "samai-sim-chips" }, chips.map((chip) => el("span", {
        className: "samai-sim-chip",
        text: fill(chip, values)
      }))) : null
    ]),
    row.meta ? el("span", { className: "samai-sim-line-meta", text: fill(row.meta, values) }) : null,
    renderState(row.state, values),
    row.toggle === undefined ? null : el("span", {
      className: `samai-sim-toggle${row.toggle ? " is-on" : ""}`,
      attrs: { "aria-hidden": "true" }
    }),
    renderAction(row.action, values, "samai-sim-line-action")
  ]);
}

function renderRows(block, values) {
  return el("span", { className: "samai-sim-lines", attrs: partAttrs(block) },
    asArray(block.items).map((row) => renderRow(row, values)));
}

function renderNote(block, values) {
  return el("span", { className: "samai-sim-screen-note", attrs: partAttrs(block) }, [
    el("b", {}, iconText(block.icon, fill(block.title, values), "list-check")),
    block.text ? el("small", { text: fill(block.text, values) }) : null
  ]);
}

function renderEmpty(block, values) {
  return el("div", { className: "samai-sim-empty-state", attrs: partAttrs(block) }, [
    icon(block.icon, "folder-open"),
    el("b", { text: fill(block.title, values) }),
    block.text ? el("small", { text: fill(block.text, values) }) : null,
    renderAction(block.action, values, "samai-sim-button")
  ]);
}

// The queue settles on its own: every row shows as working, then the whole set
// turns ready and the action that was waiting on it becomes pressable. That wait
// is the point of the block — files are not part of a project until it ends.
function renderUpload(block, values) {
  return el("div", {
    className: "samai-sim-upload",
    attrs: Object.assign(partAttrs(block), {
      "data-delay": Number(block.delay) > 0 ? String(Number(block.delay)) : null
    })
  }, [
    el("span", { className: "samai-sim-upload-rows" }, asArray(block.items).map((item) => el("span", {
      className: "samai-sim-upload-row",
      attrs: partAttrs(item)
    }, [
      el("span", { className: "samai-sim-upload-icon" }, icon(item.icon, "file-lines")),
      el("span", { className: "samai-sim-line-text" }, [
        el("b", { text: fill(item.title, values) }),
        item.meta ? el("small", { text: fill(item.meta, values) }) : null
      ]),
      el("span", {
        className: "samai-sim-upload-state",
        text: fill(block.busyLabel, values),
        attrs: { "data-done": fill(block.doneLabel, values) }
      }),
      el("span", { className: "samai-sim-upload-bar" }, el("i"))
    ]))),
    block.action ? el("span", { className: "samai-sim-upload-action" },
      renderAction(Object.assign({ disabled: true }, block.action), values, "samai-sim-button")) : null
  ]);
}

function renderNotice(block, values) {
  return el("div", { className: "samai-sim-notice", attrs: partAttrs(block) }, [
    el("span", { className: "samai-sim-notice-icon" }, icon(block.icon, "bell")),
    el("span", { className: "samai-sim-line-text" }, [
      el("b", { text: fill(block.title, values) }),
      block.text ? el("small", { text: fill(block.text, values) }) : null
    ]),
    block.meta ? el("span", { className: "samai-sim-line-meta", text: fill(block.meta, values) }) : null,
    renderAction(block.action, values, "samai-sim-button")
  ]);
}

// A written result rather than a listing: what a scheduled run produced, what a
// memory summary holds, what a reply says at length.
function renderDoc(block, values) {
  return el("div", { className: "samai-sim-doc", attrs: partAttrs(block) }, [
    block.meta ? el("span", { className: "samai-sim-doc-meta", text: fill(block.meta, values) }) : null,
    ...asArray(block.items).map((item) => (isObject(item) ? el("p", {
      className: item.tone ? `is-${validClassNames(item.tone)}` : null
    }, [
      item.title ? el("b", { text: fill(item.title, values) }) : null,
      item.text ? el("span", { text: fill(item.text, values) }) : null
    ]) : el("p", { text: fill(item, values) })))
  ]);
}

function renderMenuBlock(block, values) {
  return el("div", { className: "samai-sim-popup", attrs: partAttrs(block) },
    asArray(block.items).map((item) => el("span", {
      className: `samai-sim-popup-item${item.tone ? ` is-${validClassNames(item.tone)}` : ""}`,
      attrs: partAttrs(item)
    }, [icon(item.icon, "circle"), el("span", { text: fill(item.label, values) })])));
}

// The learner's own text. The control writes straight into the field values and
