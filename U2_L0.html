.samai-card-stack .samai-table-scroll,
.samai-timeline-stack .samai-table-scroll,
.samai-tab-stack .samai-table-scroll,
.samai-process-panel .samai-table-scroll{box-shadow:none}

.samai-case-study{
  position:relative;
  padding:30px 28px;
  overflow:hidden;
  border-radius:var(--samai-radius-lg);
  background:linear-gradient(135deg,var(--samai-dark) 0%,var(--samai-primary) 58%,var(--samai-primary-2) 100%);
  color:#fff;
  box-shadow:0 18px 40px #0c18284d;
}

.samai-case-study::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(460px 240px at 92% -10%,#f0b42929,transparent 62%),
    radial-gradient(420px 220px at 0% 110%,#3fae9a2e,transparent 60%);
}

.samai-case-study>*{position:relative;z-index:1}

.samai-case-kicker{
  width:fit-content;
  margin-block-end:var(--samai-space-4);
  padding:6px 13px;
  display:block;
  border:1px solid #f0b42966;
  border-radius:999px;
  background:#f0b4292e;
  color:#ffd88a;
  font-size:12px;
  font-weight:900;
}

.samai-case-layout{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  align-items:center;
  gap:26px;
}

.samai-case-visual{min-width:130px;text-align:center}

.samai-case-visual>i{
  width:100px;
  height:100px;
  margin:auto;
  display:grid;
  place-items:center;
  border:1px solid #ffffff47;
  border-radius:28px;
  background:#2f5d9f;
  color:#fff;
  font-size:43px;
  box-shadow:inset 0 1px 0 #ffffff2e,0 12px 24px #00000029;
}

.samai-case-visual strong{display:block;margin-block-start:7px;color:#a3d98f;font-size:34px;font-weight:900}
.samai-case-visual span{display:block;color:#ffffffc7;font-size:12px;font-weight:800}

.samai-case-body h3{margin:0 0 10px;color:#fff;font-size:20px;font-weight:900}

.samai-case-body p{
  margin:0 0 var(--samai-space-3);
  color:#fffffff2;
  font-size:16px;
  font-weight:500;
  line-height:2.05;
}

.samai-case-source{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#ffffff94;
  font-size:12.5px;
  font-weight:800;
}

.samai-activity-head,
.samai-inspection-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--samai-space-3);
  flex-wrap:wrap;
}

.samai-activity-head>p,
.samai-activity-instructions{
  margin:0;
  color:var(--samai-muted);
  font-size:14px;
  font-weight:700;
  line-height:1.85;
}

.samai-activity-count,
.samai-inspection-count{
  padding:8px 14px;
  display:inline-flex;
  align-items:center;
  gap:var(--samai-space-2);
  border:1px solid var(--samai-border);
  border-radius:999px;
  background:#fff;
  color:var(--samai-primary);
  font-size:12.5px;
  font-weight:900;
  box-shadow:var(--samai-shadow);
}

.samai-activity-count>i,
.samai-inspection-count>i{color:var(--samai-teal)}

.samai-activity-complete{
  padding:14px 16px;
  border:1px solid #3fae9a4d;
  border-radius:15px;
  background:#3fae9a17;
  color:#155e51;
  font-size:14px;
  font-weight:900;
  text-align:center;
}

.samai-accordion{display:grid;gap:14px}
.samai-accordion-items{display:grid;gap:var(--samai-space-3)}

.samai-accordion-item{
  overflow:hidden;
  border:1px solid var(--samai-border);
  border-radius:var(--samai-radius-md);
  background:#fff;
  box-shadow:var(--samai-shadow);
  transition:border-color .2s ease,box-shadow .2s ease;
}

.samai-accordion-item.is-open{
  border-color:#3fae9a66;
  box-shadow:0 0 0 3px #3fae9a1f,var(--samai-shadow);
}

.samai-accordion-toggle{
  width:100%;
  padding:14px 16px;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:var(--samai-space-3);
  border:0;
  background:#fff;
  color:var(--samai-primary);
  cursor:pointer;
  text-align:start;
}

.samai-accordion-toggle:hover{background:#f7fafc}

.samai-accordion-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
}

.samai-accordion-title{font-size:15.5px;font-weight:900}
.samai-accordion-toggle>i{color:var(--samai-teal);transition:transform .2s ease}
.samai-accordion-item.is-open .samai-accordion-toggle>i{transform:rotate(180deg)}

.samai-accordion-panel{
  padding:var(--samai-space-4);
  display:grid;
  gap:10px;
  border-block-start:1px solid var(--samai-border);
  background:#f8fafc;
}

.samai-accordion-row{
  padding:12px 14px;
  border:1px solid var(--samai-border);
  border-radius:var(--samai-radius-sm);
  background:#fff;
}

.samai-accordion-row strong{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--samai-primary);
  font-size:12.5px;
  font-weight:900;
}

.samai-accordion-row p{margin:5px 0 0;color:var(--samai-ink);font-size:13.5px;font-weight:650;line-height:1.8}
.samai-row-risk{border-color:#c0392b33;background:#fff7f6}
.samai-row-risk strong{color:#9e2f25}
.samai-row-commitment{border-color:#3fae9a3d;background:#f4fbf9}
.samai-row-commitment strong{color:#155e51}
.samai-row-impact{border-color:#24377129;background:#f6f8fc}

.samai-classifier{display:grid;gap:var(--samai-space-4)}

.samai-classifier-legend{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:var(--samai-space-2);
}

.samai-classifier-key{
  padding:10px 12px;
  display:flex;
  align-items:flex-start;
  gap:var(--samai-space-2);
  border:1px solid var(--samai-border);
  border-radius:var(--samai-radius-sm);
  background:#fff;
  box-shadow:var(--samai-shadow);
}

.samai-key-dot{
  width:11px;
  height:11px;
  flex:none;
  margin-block-start:5px;
  border-radius:50%;
  background:var(--samai-teal);
}

.samai-key-remove .samai-key-dot,
.samai-key-warning .samai-key-dot{background:var(--samai-warning)}

.samai-key-never .samai-key-dot,
.samai-key-danger .samai-key-dot{background:var(--samai-danger)}

.samai-classifier-key strong{display:block;color:var(--samai-primary);font-size:12.5px;font-weight:900}
.samai-classifier-key small{display:block;margin-block-start:2px;color:var(--samai-muted);font-size:11px;font-weight:700;line-height:1.45}

.samai-classifier-status{
  display:flex;
  justify-content:space-between;
  gap:var(--samai-space-3);
  color:var(--samai-muted);
  font-size:12.5px;
  font-weight:900;
}

.samai-classifier-stage{
  padding:var(--samai-space-5);
  border:1px solid var(--samai-border);
  border-radius:var(--samai-radius-md);
  background:#fff;
  box-shadow:var(--samai-shadow);
}

.samai-classifier-case-title,
.samai-decision-tag{
  width:fit-content;
  margin-block-end:var(--samai-space-3);
  padding:5px 11px;
  display:block;
  border-radius:999px;
  background:#24377114;
  color:var(--samai-primary);
  font-size:11.5px;
  font-weight:900;
}

.samai-classifier-case h3{
  margin:0 0 var(--samai-space-2);
  display:flex;
  align-items:flex-start;
  gap:10px;
  color:var(--samai-primary);
  font-size:17px;
  line-height:1.65;
}

.samai-classifier-case h3 i{margin-block-start:5px;color:var(--samai-teal)}
.samai-classifier-case>p{margin:0 0 var(--samai-space-4);font-size:14px;font-weight:650;line-height:1.9}

.samai-classifier-options{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:var(--samai-space-2);
}

.samai-classifier-option,
.samai-decision-option{
  padding:11px 12px;
  border:1.5px solid var(--samai-border);
  border-radius:var(--samai-radius-sm);
  background:#fff;
  color:var(--samai-primary);
  cursor:pointer;
  font-size:13px;
  font-weight:900;
  transition:background .2s ease,border-color .2s ease,transform .2s ease;
}

.samai-classifier-option:hover:not(:disabled),
.samai-decision-option:hover:not(:disabled){border-color:var(--samai-teal);background:#3fae9a14;transform:translateY(-2px)}

.samai-classifier-option.is-correct,
.samai-classifier-option.is-selected-correct,
.samai-decision-option.is-correct,
.samai-decision-option.is-selected-correct{border-color:var(--samai-success);background:#1e8a6b1f;color:#155e51}

.samai-classifier-option.is-selected-wrong,
.samai-decision-option.is-selected-wrong{border-color:var(--samai-danger);background:#c0392b1a;color:#9e2f25}

.samai-classifier-feedback,
.samai-decision-feedback{
  margin-block-start:var(--samai-space-3);
  padding:12px 14px;
  display:none;
  border-radius:var(--samai-radius-sm);
  font-size:13.5px;
  font-weight:800;
  line-height:1.8;
}

.samai-classifier-feedback.is-visible,
.samai-decision-feedback.is-visible{display:block}
.samai-classifier-feedback.is-correct,
.samai-decision-feedback.is-correct{background:#1e8a6b17;color:#155e51}
.samai-classifier-feedback.is-wrong,
.samai-decision-feedback.is-wrong{background:#c0392b14;color:#8e2a22}

.samai-classifier-next,
.samai-decision-next,
.samai-restart{
  margin-block-start:var(--samai-space-3);
  padding:10px 17px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:var(--samai-space-2);
  border:0;
  border-radius:var(--samai-radius-sm);
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  cursor:pointer;
  font-weight:900;
}

.samai-classifier-complete{text-align:center}

.samai-comparison{
  display:grid;
  grid-template-columns:repeat(var(--samai-columns,2),minmax(0,1fr));
  gap:var(--samai-space-4);
}

.samai-comparison-card{
  padding:22px;
  border:1px solid var(--samai-border);
  border-radius:20px;
  background:#fff;
  box-shadow:var(--samai-shadow);
  transition:transform .25s ease,box-shadow .25s ease;
}

.samai-comparison-card:hover{box-shadow:var(--samai-shadow-hover);transform:translateY(-3px)}

.samai-comparison-icon{
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  border-radius:16px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font-size:21px;
}

.samai-comparison-card h3{margin:12px 0 7px;color:var(--samai-primary);font-size:17px;font-weight:900}

.samai-comparison-card h3 small{
  margin-inline-start:7px;
  padding:2px 8px;
  display:inline-block;
  border-radius:999px;
  background:#3fae9a1c;
  color:#155e51;
  font-size:11px;
  direction:ltr;
}

.samai-comparison-card>p{margin:0 0 14px;color:var(--samai-muted);font-size:13.5px;font-weight:700;line-height:1.8}

.samai-before-after{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:9px;
}

.samai-before-after>div{min-width:0;padding:11px;border-radius:var(--samai-radius-sm);background:#c0392b12}
.samai-before-after>.samai-after{background:#3fae9a1a}
.samai-before-after small{display:block;color:var(--samai-muted);font-size:10.5px;font-weight:900}
.samai-before-after strong{display:block;overflow-wrap:anywhere;color:var(--samai-primary);font-size:12.5px;font-weight:900;line-height:1.55}
.samai-before-after>i{color:var(--samai-teal)}

.samai-timeline{
  position:relative;
  margin:8px 0 0;
  padding:0 38px 0 0;
  list-style:none;
}
.samai-section>.samai-stack>.samai-timeline{margin-block-start:0}

.samai-timeline::before{
  content:"";
  position:absolute;
  inset-block:22px;
  inset-inline-start:19px;
  width:3px;
  border-radius:999px;
  background:linear-gradient(180deg,#24377133,var(--samai-teal),var(--samai-green));
}

.samai-timeline-item{
  position:relative;
  min-width:0;
  margin-block-end:14px;
}
.samai-timeline-item:last-child{margin-block-end:0}

.samai-timeline-marker{
  position:absolute;
  inset-block-start:20px;
  inset-inline-start:-38px;
  z-index:2;
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font-size:15px;
  box-shadow:0 0 0 5px #fff,0 6px 14px #24377129;
}
.samai-timeline-item:last-child .samai-timeline-marker{background:linear-gradient(135deg,var(--samai-teal),var(--samai-green))}

.samai-timeline-card{
  min-width:0;
  padding:20px 22px;
  border:1.5px solid var(--samai-border);
  border-radius:18px;
  background:linear-gradient(180deg,#fff,#f8fbfb);
  transition:border-color .25s ease,box-shadow .25s ease;
}
.samai-timeline-card:hover{border-color:#3fae9a66;box-shadow:var(--samai-shadow)}

.samai-timeline-head{
  display:flex;
  align-items:center;
  gap:11px;
  flex-wrap:wrap;
  margin-block-end:10px;
}

.samai-timeline-head h3{margin:0;color:var(--samai-primary);font-size:19px;font-weight:900;line-height:1.4}

.samai-timeline-period{
  padding:5px 14px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font-size:12px;
  font-weight:900;
  letter-spacing:.02em;
  white-space:nowrap;
}
.samai-timeline-item:last-child .samai-timeline-period{background:linear-gradient(135deg,var(--samai-teal),var(--samai-green))}

.samai-timeline-text{margin:0 0 15px;color:var(--samai-ink);font-size:14.5px;font-weight:700;line-height:2}

.samai-timeline-example{
  padding:14px 16px;
  display:grid;
  gap:18px;
  align-items:center;
  border:1.5px solid #3fae9a38;
  border-radius:15px;
  background:#fff;
}
.samai-timeline-example.has-visual{grid-template-columns:250px minmax(0,1fr)}
.samai-timeline-example-visual{display:grid;gap:8px}
.samai-timeline-example-visual .samai-markup-diagram{margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}
.samai-timeline-example-visual svg{width:100%;height:auto;display:block}
.samai-timeline-example-copy{min-width:0;color:var(--samai-ink);font-size:13.5px;font-weight:700;line-height:1.9}

.samai-timeline-example strong{display:flex;align-items:center;gap:7px;color:var(--samai-teal);font-size:11.5px;font-weight:900}
.samai-timeline-example p{margin:5px 0 0;color:var(--samai-ink);font-size:13.5px;font-weight:700;line-height:1.9}

.samai-guided-sequence{
  padding:var(--samai-space-5);
  display:grid;
  gap:var(--samai-space-4);
  border:1px solid var(--samai-border);
  border-radius:22px;
  background:linear-gradient(180deg,#fff,#f6fafb);
  box-shadow:var(--samai-shadow);
}

.samai-guided-nodes{
  margin:0;
  padding:0;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:var(--samai-space-3);
  list-style:none;
}

.samai-guided-node{
  min-width:0;
  padding:var(--samai-space-4);
  display:flex;
  align-items:flex-start;
  gap:var(--samai-space-3);
  border:1px solid var(--samai-border);
  border-radius:var(--samai-radius-md);
  background:#fff;
  color:var(--samai-muted);
  opacity:.68;
  transition:opacity .25s ease,transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}

.samai-guided-node.is-active{
  border-color:#3fae9a70;
  color:var(--samai-ink);
  opacity:1;
  transform:translateY(-3px);
  box-shadow:0 12px 24px #24377117,0 0 0 2px #3fae9a12;
}

.samai-guided-node-icon{
  width:44px;
  height:44px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:#24377112;
  color:var(--samai-primary);
}

.samai-guided-node.is-active .samai-guided-node-icon{background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));color:#fff}
.samai-guided-node>div{min-width:0;display:grid;gap:3px}
.samai-guided-node strong{color:var(--samai-primary);font-size:14.5px;font-weight:900}
.samai-guided-node>div>span{font-size:12.5px;font-weight:700;line-height:1.65}
.samai-guided-node ul{margin:5px 0 0;padding-inline-start:18px;display:grid;gap:2px;font-size:11.5px;font-weight:700;line-height:1.55}

.samai-guided-progress{display:flex;align-items:center;gap:var(--samai-space-3)}
.samai-guided-count{color:var(--samai-muted);font-size:12px;font-weight:900;white-space:nowrap}

.samai-guided-meter{
  height:8px;
  flex:1;
  overflow:hidden;
  border-radius:999px;
  background:#24377112;
}

.samai-guided-meter i{width:0;height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,var(--samai-primary),var(--samai-teal),var(--samai-green));transition:width .3s ease}

.samai-guided-stage{
  min-height:126px;
  padding:var(--samai-space-5);
  border:1px solid #3fae9a33;
  border-radius:var(--samai-radius-md);
  background:#fff;
  box-shadow:0 10px 22px #2437710d;
}

.samai-guided-stage h3{margin:0;color:var(--samai-primary);font-size:18px;font-weight:900}
.samai-guided-stage p{margin:var(--samai-space-2) 0 0;color:var(--samai-ink);font-size:14px;font-weight:700;line-height:1.9}

.samai-guided-dots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

.samai-guided-dots button{
  width:44px;
  min-height:44px;
  padding:0;
  display:grid;
  place-items:center;
  border:1px solid var(--samai-border);
  border-radius:50%;
  background:#fff;
  color:var(--samai-muted);
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}

.samai-guided-dots button.is-active{border-color:var(--samai-teal);background:var(--samai-teal);color:#fff;box-shadow:0 6px 16px #3fae9a3d}

/* Equal side columns keep the dots dead centre when the next label swaps to
   the restart label, which is wider. */
.samai-guided-actions{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:12px;
}
.samai-guided-previous{justify-self:start}
.samai-guided-next{justify-self:end}

.samai-guided-actions>button{
  padding:9px 16px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid #3fae9a40;
  border-radius:12px;
  background:var(--samai-surface);
  color:var(--samai-primary);
  font:inherit;
  font-size:12.5px;
  font-weight:900;
  cursor:pointer;
  transition:border-color .2s ease,background .2s ease;
}
.samai-guided-actions>button:hover:not(:disabled){border-color:var(--samai-teal);background:#f2faf8}
.samai-guided-actions>button:disabled{opacity:.45;cursor:default}
.samai-guided-print{display:none}

.samai-tab-set{display:grid;gap:var(--samai-space-4)}

.samai-tab-list{
  padding:var(--samai-space-2);
  display:flex;
  gap:var(--samai-space-2);
  overflow-x:auto;
  border:1px solid var(--samai-border);
  border-radius:var(--samai-radius-md);
  background:var(--samai-surface-soft);
  scrollbar-width:thin;
}

.samai-tab{
  min-width:160px;
  flex:1 0 auto;
  padding:10px 14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:1px solid transparent;
  border-radius:13px;
  background:transparent;
  color:var(--samai-muted);
  font-weight:900;
  cursor:pointer;
}

.samai-tab:hover{background:#fff;color:var(--samai-primary)}
/* The trailing `border-box` is the gradient's origin, and it matters: a gradient defaults
   to the padding box, so behind the tab's see-through border it tiles and shows its far
   end again — a mismatched hairline all the way round the selected tab. */
.samai-tab[aria-selected="true"]{border-color:#3fae9a33;background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal)) border-box;color:#fff;box-shadow:0 8px 18px #24377129}

.samai-tab-panel{
  min-width:0;
  padding:var(--samai-space-5);
  border:1px solid var(--samai-border);
  border-radius:20px;
  background:linear-gradient(180deg,#fff,#f9fbfd);
}

.samai-tab-intro{margin:0 0 var(--samai-space-4);color:var(--samai-primary);font-size:15px;font-weight:800;line-height:1.9}
.samai-tab-stack{display:grid;gap:var(--samai-space-4)}

.samai-tab-set-beneficiary{gap:0}
.samai-tab-set-beneficiary>.samai-activity-instructions{order:1;margin:0 0 20px;color:var(--samai-muted);font-size:14px;font-weight:700;line-height:1.9}
.samai-tab-set-beneficiary>.samai-tab-list{order:2;margin:0 0 20px;padding:0;gap:9px;overflow:visible;border:0;border-radius:0;background:transparent}
/* The transition list is deliberate, not `.22s` for everything: background-image cannot
   animate, so the gradient lands in a single frame while a transitioned colour is still
   mid-fade — a grey label on the dark gradient coming in, a white label on white going
   out. Colour and background now switch together and the label stays legible. */
.samai-tab-set-beneficiary .samai-tab{min-width:0;min-height:auto;padding:13px 20px;flex:0 1 auto;gap:10px;border:1.5px solid var(--samai-border);border-radius:14px;background:#fff;color:var(--samai-muted);font-size:14px;line-height:normal;transition:border-color .22s ease,box-shadow .22s ease}
.samai-tab-set-beneficiary .samai-tab:hover{border-color:var(--samai-teal);color:var(--samai-primary)}
.samai-tab-set-beneficiary .samai-tab[aria-selected="true"]{border-color:transparent;background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal)) border-box;color:#fff;box-shadow:0 8px 20px #2437712e}
.samai-tab-set-beneficiary>.samai-tab-panels{order:3}
.samai-tab-set-beneficiary .samai-tab-panel{padding:0;border:0;border-radius:0;background:transparent}
.samai-tab-set-beneficiary .samai-tab-intro{margin:0 0 16px;padding:16px 20px;border:1px solid #3fae9a3d;border-radius:16px;background:linear-gradient(135deg,#2437710d,#3fae9a14);color:var(--samai-primary);font-size:14.5px;font-weight:800;line-height:1.9}
.samai-tab-set-beneficiary .samai-tab-stack{gap:13px}
.samai-tab-set-beneficiary .samai-tab-stack>.samai-grid{gap:13px}

.samai-reference-list{
  width:min(var(--samai-width),calc(100% - (var(--samai-gutter) * 2)));
  margin:var(--samai-space-4) auto var(--samai-space-6);
  overflow:hidden;
  border:1px solid var(--samai-border);
  border-radius:var(--samai-radius-md);
  background:#fff;
  box-shadow:var(--samai-shadow);
}

.samai-stack>.samai-reference-list,
.samai-card-stack>.samai-reference-list,
.samai-tab-stack>.samai-reference-list,
.samai-timeline-stack>.samai-reference-list{width:100%;margin:0;box-shadow:none}

.samai-reference-list summary{
  min-height:52px;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--samai-primary);
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  list-style:none;
}

.samai-reference-list summary::-webkit-details-marker{display:none}
.samai-reference-list summary>.fa-chevron-down{margin-inline-start:auto;color:var(--samai-teal);font-size:10px;transition:transform .25s ease}
.samai-reference-list[open] summary>.fa-chevron-down{transform:rotate(180deg)}

.samai-reference-body{padding:0 var(--samai-space-5) var(--samai-space-5);border-block-start:1px solid var(--samai-border)}
.samai-reference-body ul{margin:var(--samai-space-4) 0 0;padding:0;display:grid;gap:var(--samai-space-2);list-style:none}

.samai-reference-body a{
  min-height:44px;
  padding:10px 12px;
  display:flex;
  align-items:flex-start;
  gap:10px;
  border-radius:11px;
  color:var(--samai-primary);
  text-decoration:none;
}

.samai-reference-body a:hover{background:#3fae9a0f;color:var(--samai-teal-dark)}
.samai-reference-body a>i{margin-block-start:5px;color:var(--samai-teal);font-size:12px}
.samai-reference-body a span{display:grid;gap:2px}
.samai-reference-body a strong{font-size:13px;font-weight:850;line-height:1.7}
.samai-reference-body a small{color:var(--samai-muted);font-size:11.5px;font-weight:700;line-height:1.65}
.samai-reference-note{margin:var(--samai-space-4) 0 0;padding:var(--samai-space-3);border-radius:11px;background:var(--samai-surface-soft);color:var(--samai-muted);font-size:12px;font-weight:700;line-height:1.8}

.samai-process{
  overflow:hidden;
  border:1px solid var(--samai-border);
  border-radius:22px;
  background:#fff;
  box-shadow:var(--samai-shadow);
}

.samai-process-steps{
  padding:var(--samai-space-3);
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:var(--samai-space-2);
  background:#f2f6fa;
}

.samai-process-step{
  padding:9px 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:var(--samai-space-2);
  border:1px solid transparent;
  border-radius:var(--samai-radius-sm);
  background:transparent;
  color:var(--samai-muted);
  cursor:pointer;
  font-size:12px;
  font-weight:900;
}

.samai-process-step>span:first-child{
  width:28px;
  height:28px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#dbe4ee;
  color:var(--samai-primary);
}

.samai-process-step[aria-current="step"]{
  border-color:#3fae9a47;
  background:#fff;
  color:var(--samai-primary);
  box-shadow:var(--samai-shadow);
}

.samai-process-step[aria-current="step"]>span:first-child,
.samai-process-step.is-complete>span:first-child{background:var(--samai-teal);color:#fff}

.samai-process-step:disabled{cursor:not-allowed;opacity:.55}

.samai-process-panel{padding:var(--samai-space-6)}

.samai-process-panel-head{
  margin-block-end:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--samai-space-3);
}

.samai-process-panel-head>div{display:flex;align-items:center;gap:10px;color:var(--samai-primary)}

.samai-process-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
}

.samai-process-panel-head h3{margin:0;font-size:18px;font-weight:900}

.samai-process-panel-head>span{
  padding:5px 10px;
  border-radius:999px;
  background:#3fae9a1a;
  color:#155e51;
  font-size:11.5px;
  font-weight:900;
}

.samai-process-instruction{margin:0 0 var(--samai-space-4);font-size:14.5px;font-weight:650;line-height:1.9}

.samai-process-actions{
  margin-block-start:var(--samai-space-5);
  display:flex;
  justify-content:space-between;
  gap:var(--samai-space-3);
}

.samai-process-actions button{
  padding:10px 18px;
  border:1px solid var(--samai-border);
  border-radius:var(--samai-radius-sm);
  background:#fff;
  color:var(--samai-primary);
  cursor:pointer;
  font-weight:900;
}

.samai-process-actions .samai-process-next{border:0;background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));color:#fff}
.samai-process-actions button:disabled{cursor:not-allowed;opacity:.45}

.samai-redaction{
  padding:var(--samai-space-5);
  display:grid;
  gap:var(--samai-space-3);
  border:1px solid var(--samai-border);
  border-radius:20px;
  background:linear-gradient(180deg,#fff,#f7fafc);
  box-shadow:var(--samai-shadow);
}

.samai-redaction-status{
  display:flex;
  justify-content:space-between;
  gap:var(--samai-space-3);
  color:var(--samai-muted);
  font-size:12.5px;
  font-weight:900;
}

.samai-redaction-risk{color:#9e2f25}

.samai-redaction-meter{
  height:7px;
  overflow:hidden;
  border-radius:999px;
  background:#e3e9ef;
}

.samai-redaction-meter i{
  width:100%;
  height:100%;
  display:block;
  background:linear-gradient(90deg,var(--samai-teal),var(--samai-warning),var(--samai-danger));
  transition:width .3s ease;
}

.samai-redaction-prompt{
  padding:18px;
  border:1px solid var(--samai-border);
  border-radius:15px;
  background:#fff;
  font-size:15px;
  font-weight:650;
  line-height:2.25;
}

.samai-redaction-target{
  min-height:44px!important;
  margin:2px;
  padding:1px 5px;
  border:0;
  border-block-end:2px dashed var(--samai-danger);
  border-radius:5px;
  background:#c0392b12;
  color:#8e2a22;
  cursor:pointer;
  font-weight:900;
}

.samai-redaction-target.is-masked{border-block-end-color:var(--samai-teal);background:#3fae9a1f;color:#155e51}

.samai-redaction-feedback{
  padding:11px 14px;
  border-radius:var(--samai-radius-sm);
  background:#2437710f;
  color:var(--samai-primary);
  font-size:13.5px;
  font-weight:800;
}

.samai-redaction-result{
  padding:var(--samai-space-4);
  border:1px solid #3fae9a4d;
  border-radius:15px;
  background:#f4fbf9;
}

.samai-redaction-result>strong{color:#155e51}
.samai-redaction-result>p{margin:7px 0 0;font-weight:650;line-height:1.8}

.samai-redaction-output{margin-block-start:var(--samai-space-3);padding:13px;border-radius:var(--samai-radius-sm);background:#fff}
.samai-redaction-output strong{display:flex;align-items:center;gap:7px;color:var(--samai-primary)}
.samai-redaction-output p{margin:5px 0 0}

.samai-inspection{display:grid;gap:var(--samai-space-4)}

.samai-chat{
  overflow:hidden;
  border:1px solid #d7e5f2;
  border-radius:22px;
  background:#fff;
  box-shadow:var(--samai-shadow);
}

.samai-chat-head{
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:9px;
  background:linear-gradient(135deg,var(--samai-dark),#1c2f52);
  color:#fff;
  font-size:13.5px;
  font-weight:900;
}

.samai-chat-body{padding:var(--samai-space-4) var(--samai-space-4) 18px;background:linear-gradient(180deg,#f6f9fd,#eef4fa)}

.samai-chat-note{
  margin-block-end:var(--samai-space-4);
  padding:9px 13px;
  display:flex;
  align-items:center;
  gap:var(--samai-space-2);
  border:1px solid #f39c124d;
  border-radius:var(--samai-radius-sm);
  background:#ffc1071f;
  color:#755300;
  font-size:12.5px;
  font-weight:900;
}

.samai-chat-turn{margin-block-end:var(--samai-space-4)}
.samai-chat-turn:last-child{margin-block-end:0}
.samai-chat-turn>strong{display:flex;align-items:center;gap:var(--samai-space-2);margin-block-end:7px;color:var(--samai-muted);font-size:13px;font-weight:900}

.samai-chat-user>p{
  max-width:90%;
  margin:0;
  padding:13px 16px;
  border-radius:16px 16px 16px 5px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-primary-2));
  color:#fff;
  font-size:15px;
  font-weight:600;
}

.samai-inspection-response{
  padding:17px 19px;
  border:1px solid var(--samai-border);
  border-radius:16px 16px 5px 16px;
  background:#fff;
  box-shadow:var(--samai-shadow);
  font-size:16px;
  font-weight:600;
  line-height:2.15;
}

.samai-inspection-target{
  min-height:44px!important;
  margin:2px;
  padding:1px 3px 2px;
  border:0;
  border-block-end:2px dashed #2437718c;
  border-radius:3px;
  background:transparent;
  color:inherit;
  cursor:pointer;
  font-weight:700;
}

.samai-inspection-target:hover{border-block-end-color:var(--samai-teal);background:#2437710f}
.samai-inspection-target.is-issue{border-block-end-style:solid;border-block-end-color:var(--samai-danger);background:#c0392b1a;color:#9e2f25}
.samai-inspection-target.is-valid{border-block-end-style:solid;border-block-end-color:var(--samai-primary);background:#24377114;color:var(--samai-primary)}

.samai-inspection-panel{
  overflow:hidden;
  border:1px solid var(--samai-border);
  border-radius:22px;
  background:#fff;
  box-shadow:var(--samai-shadow);
}

.samai-inspection-placeholder{margin:0;padding:24px 18px;color:var(--samai-muted);font-size:15px;font-weight:700;text-align:center}

.samai-inspection-detail-head{
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font-size:16px;
  font-weight:900;
}

.samai-inspection-detail-head span{
  margin-inline-start:auto;
  padding:4px 11px;
  border:1px solid #ffffff66;
  border-radius:999px;
  background:#ffffff38;
  font-size:12px;
}

.samai-inspection-row{padding:15px 18px;border-block-end:1px solid var(--samai-border)}
.samai-inspection-row:last-child{border-block-end:0}
.samai-inspection-how{background:#f4fbf9}
.samai-inspection-row small{display:block;margin-block-end:5px;color:var(--samai-teal);font-size:12px;font-weight:900}
.samai-inspection-row p{margin:0;font-size:15px;font-weight:600;line-height:1.9}

.samai-flip-card:not([hidden]){
  min-height:308px;
  height:auto;
  padding:0;
  border:0;
  border-radius:22px;
  background:transparent;
  color:inherit;
  cursor:pointer;
  perspective:1200px;
  transition:transform .25s ease;
}

.samai-flip-card:hover{transform:translateY(-5px)}

.samai-flip-inner{
  position:relative;
  width:100%;
  height:100%;
  display:block;
  transform-style:preserve-3d;
  transition:transform .6s ease;
}

.samai-flip-card.is-flipped .samai-flip-inner{transform:rotateY(180deg)}

.samai-flip-face{
  position:absolute;
  inset:0;
  padding:24px 22px;
  display:flex;
  flex-direction:column;
  border:1px solid var(--samai-border);
  border-radius:22px;
  background:#fff;
  box-shadow:var(--samai-shadow);
  backface-visibility:hidden;
}

.samai-flip-front{text-align:center}

.samai-flip-icon{
  width:56px;
  height:56px;
  margin:2px auto var(--samai-space-3);
  display:grid;
  place-items:center;
  border-radius:16px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font-size:22px;
}

.samai-flip-front>strong{margin-block-end:10px;color:var(--samai-primary);font-size:17px;font-weight:900}
.samai-flip-front>span:not(.samai-flip-icon){color:var(--samai-muted);font-size:13.5px;font-weight:700;line-height:1.9}
.samai-flip-front small{margin-block-start:auto;padding-block-start:var(--samai-space-3);color:var(--samai-teal);font-size:11.5px;font-weight:900}

.samai-flip-back{
  justify-content:center;
  transform:rotateY(180deg);
  background:linear-gradient(135deg,#f8fbff,#eef6fb);
}

.samai-flip-back strong{
  width:fit-content;
  margin-block-end:14px;
  padding:6px 12px;
  border:1px solid #3fae9a4d;
  border-radius:999px;
  background:#3fae9a24;
  color:#155e51;
  font-size:12px;
  font-weight:900;
}

.samai-flip-back>span{font-size:14px;font-weight:750;line-height:2}

.samai-decision{
  padding:var(--samai-space-5);
  display:grid;
  gap:var(--samai-space-4);
  border:1px solid var(--samai-border);
  border-radius:22px;
  background:linear-gradient(180deg,#fff,#f7fafc);
  box-shadow:var(--samai-shadow);
}

.samai-decision-progress{
  display:flex;
  align-items:center;
  gap:var(--samai-space-3);
}

.samai-decision-count{
  min-width:max-content;
  color:var(--samai-primary);
  font-size:12.5px;
  font-weight:900;
}

.samai-decision-meter{
  height:8px;
  flex:1;
  overflow:hidden;
  border-radius:999px;
  background:#dfe7ef;
}

.samai-decision-meter i{
  width:0;
  height:100%;
  display:block;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--samai-primary),var(--samai-teal),var(--samai-green));
  transition:width .3s ease;
}

.samai-decision-card{
  padding:var(--samai-space-5);
  border:1px solid var(--samai-border);
  border-radius:var(--samai-radius-md);
  background:#fff;
  box-shadow:var(--samai-shadow);
}

.samai-decision-card h3{
  margin:0 0 var(--samai-space-4);
  color:var(--samai-primary);
  font-size:18px;
  font-weight:900;
  line-height:1.75;
}

.samai-decision-context{margin:0 0 var(--samai-space-2);color:var(--samai-muted);font-size:13px;font-weight:700}
.samai-decision-options{display:grid;gap:10px}

.samai-decision-option{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  align-items:center;
  gap:var(--samai-space-3);
  text-align:start;
}

.samai-choice-marker{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border:1px solid var(--samai-border);
  border-radius:9px;
  background:#f5f8fb;
}

.samai-decision-complete{padding:var(--samai-space-5);text-align:center}
.samai-complete-icon{width:66px;height:66px;margin:0 auto var(--samai-space-3);display:grid;place-items:center;border-radius:50%;background:#3fae9a1a;color:var(--samai-teal);font-size:30px}
.samai-decision-complete h3{margin:0;color:var(--samai-primary);font-size:21px;font-weight:900}
.samai-decision-complete p{margin:var(--samai-space-2) 0 0;color:var(--samai-muted)}

.samai-quiz{
  margin-block-start:24px;
  padding:24px;
  gap:0;
  border:1.5px solid var(--samai-border);
  border-radius:20px;
  background:linear-gradient(180deg,#fff,#f7fbfa);
  box-shadow:var(--samai-shadow);
}

.samai-quiz-head{
  margin-block-end:18px;
  display:flex;
  align-items:center;
  gap:13px;
}

.samai-quiz-head-icon{
  width:44px;
  height:44px;
  display:grid;
  flex:0 0 44px;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,var(--samai-green),var(--samai-teal));
  color:#fff;
  box-shadow:0 7px 18px #1e8a6b33;
}

.samai-quiz-head-icon svg{width:21px;height:21px}
.samai-quiz-head h3{margin:0;color:var(--samai-primary);font-size:15.5px;font-weight:900;line-height:1.6}

.samai-quiz .samai-decision-progress{
  margin-block-end:18px;
  gap:14px;
}

.samai-quiz .samai-decision-meter{
  height:7px;
  order:1;
  background:#e5eceb;
}

.samai-quiz .samai-decision-count{
  order:2;
  color:var(--samai-muted);
  font-size:12px;
  font-weight:800;
}

.samai-quiz .samai-decision-card{
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
}

.samai-quiz .samai-decision-context{margin:0 0 8px}

.samai-quiz .samai-decision-card h3{
  margin:0 0 16px;
  padding:18px 20px;
  border:1.5px solid #3fae9a38;
  border-radius:16px;
  background:#fff;
  color:var(--samai-ink);
  font-size:15.5px;
  font-weight:900;
  line-height:1.9;
}

.samai-quiz .samai-decision-options{gap:9px}

.samai-quiz .samai-decision-option{
  min-height:53px;
  padding:13px 16px;
  gap:11px;
  border-width:1.5px;
  border-radius:14px;
  color:var(--samai-ink);
  font-size:14px;
  font-weight:800;
  line-height:1.6;
}

.samai-quiz .samai-choice-marker{
  width:27px;
  height:27px;
  border:0;
  border-radius:9px;
  background:#edf3f2;
  color:var(--samai-primary);
  font-size:12.5px;
  font-weight:900;
}

.samai-quiz .samai-decision-feedback{
  margin-block-start:12px;
  padding:12px 14px;
  border-radius:12px;
  font-size:13px;
}

.samai-decision-actions{
  height:58.6667px;
  margin-block-start:18px;
  padding-block-start:16px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  border-block-start:1px dashed var(--samai-border);
}

.samai-decision-previous,
.samai-quiz .samai-decision-next{
  height:42px;
  margin:0;
  padding:9px 17px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1.5px solid var(--samai-border);
  border-radius:999px;
  background:#fff;
  color:var(--samai-primary);
  font:inherit;
  font-size:13px;
  font-weight:900;
  line-height:1.2;
  cursor:pointer;
}

.samai-quiz .samai-decision-next{border-color:var(--samai-primary);background:var(--samai-primary);color:#fff}
.samai-decision-previous:disabled{opacity:.42;cursor:not-allowed}
.samai-decision-previous svg,
.samai-quiz .samai-decision-next svg{width:16px;height:16px}

.samai-summary .samai-section-header{margin-block-end:22px}

.samai-summary-body{
  display:grid;
  gap:18px;
}

.samai-summary-body>*{min-width:0}

.samai-summary-rule{
  margin:0;
  padding:24px 26px;
  border-radius:22px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-primary-2),var(--samai-teal));
  color:#fff;
  font-size:19px;
  font-weight:900;
  text-align:center;
  box-shadow:0 18px 40px #24377138;
}

.samai-summary-grid{
  display:grid;
  grid-template-columns:repeat(var(--samai-columns,3),minmax(0,1fr));
  gap:14px;
}

.samai-summary-item{
  padding:20px;
  display:block;
  border:1px solid var(--samai-border);
  border-radius:18px;
  background:#fff;
  box-shadow:var(--samai-shadow);
  text-align:center;
  transition:transform .25s ease,box-shadow .25s ease;
}

.samai-summary-item:hover{box-shadow:var(--samai-shadow-hover);transform:translateY(-3px)}

.samai-summary-copy{
  min-width:0;
  display:block;
}

.samai-summary-icon{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font-size:18px;
}
.samai-summary-item>.samai-summary-icon{margin:0 auto 13px}

.samai-summary-item strong{margin-block-end:6px;display:block;color:var(--samai-primary);font-size:15.5px;font-weight:900;line-height:1.45}
.samai-summary-item p{margin:0;color:var(--samai-primary);font-size:14.5px;font-weight:900;line-height:1.6}
.samai-summary-item-titled p{color:var(--samai-muted);font-size:13px;font-weight:700;line-height:1.85}
.samai-summary-text{margin:0;color:var(--samai-ink);font-size:15px;font-weight:700;line-height:1.9;text-align:center}

.samai-summary .samai-callout{
  padding:16px 21px;
  align-items:center;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-primary-2));
  color:#fff;
  font-size:14px;
  font-weight:800;
  line-height:1.8;
  box-shadow:none;
}
.samai-summary .samai-callout>i{margin:0;color:#a3d98f;font-size:17px}
.samai-summary .samai-callout-content{display:block}
.samai-summary .samai-callout-content>strong{margin-inline-end:5px;color:#a3d98f}
.samai-summary .samai-callout-content>span{display:block}

.samai-summary .samai-reference-list{
  width:100%;
  margin:8px 0 0;
  padding-block-start:16px;
  overflow:visible;
  border:0;
  border-block-start:1px dashed var(--samai-border);
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.samai-summary .samai-reference-list summary{
  width:fit-content;
  min-height:0;
  padding:9px 16px;
  display:inline-flex;
  gap:9px;
  border:1px solid #3fae9a52;
  border-radius:999px;
  background:#3fae9a0f;
  color:var(--samai-teal-dark);
  font-size:12.5px;
}
.samai-summary .samai-reference-list summary>.fa-chevron-down{margin-inline-start:0}
.samai-summary .samai-reference-body{
  margin-block-start:13px;
  padding:0;
  border:0;
}
.samai-summary .samai-reference-body ul{margin:0}
.samai-summary .samai-reference-body a{padding:6px 0;min-height:36px;color:var(--samai-teal-dark);font-size:12.5px}

.samai-load-error{
  width:min(760px,calc(100% - 32px));
  margin:40px auto;
  padding:28px;
  border:1px solid #c0392b3d;
  border-radius:20px;
  background:#fff;
  box-shadow:var(--samai-shadow);
}

.samai-load-error h1{margin:0;color:#8e2a22}
.samai-load-error p{margin:10px 0}
.samai-load-error code{display:block;padding:12px;border-radius:10px;background:#f7f8fa;direction:ltr;text-align:left;overflow:auto}

.samai-simulator{
  padding:20px;
  border:1.5px solid var(--samai-border);
  border-radius:var(--samai-radius-lg);
  background:linear-gradient(180deg,#fff,#f7fbfd);
  box-shadow:var(--samai-shadow);
}

/* The extra headroom is where a spotlight label sits without being clipped. */
.samai-sim-stage{
  position:relative;
  overflow:hidden;
  padding:40px 18px 18px;
  border-radius:var(--samai-radius-md);
  background:linear-gradient(180deg,#e9f0f7,#f6fafc);
}

.samai-sim-window{
  overflow:hidden;
  border:1px solid #6b7a9933;
  border-radius:14px;
  background:var(--samai-surface);
  box-shadow:0 10px 24px #24377114;
}
.samai-sim-window[inert]{pointer-events:none}

.samai-sim-top{
  padding:9px 14px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:12px;
  border-block-end:1px solid var(--samai-border);
  background:var(--samai-surface-soft);
}

.samai-sim-brand{min-width:0;display:flex;align-items:center;gap:10px}
.samai-sim-dots-window{flex:none;display:flex;gap:5px}
.samai-sim-dots-window i{width:9px;height:9px;border-radius:50%}
.samai-sim-dots-window i:nth-child(1){background:var(--samai-danger)}
.samai-sim-dots-window i:nth-child(2){background:var(--samai-warning)}
.samai-sim-dots-window i:nth-child(3){background:var(--samai-success)}

.samai-sim-name{
  overflow:hidden;
  color:var(--samai-primary);
  font-size:12.5px;
  font-weight:900;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.samai-sim-top-end{min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:10px}

/* Where the product puts the name of what you are looking at. Off by default:
   the plain window has one surface and needs no label for it. */
.samai-sim-screen-name{
  overflow:hidden;
  padding:5px 10px;
  border-radius:8px;
  background:var(--samai-surface);
  color:var(--samai-muted);
  font-size:10.5px;
  font-weight:900;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.samai-sim-screen-name:empty{display:none}
.samai-sim-overflow{flex:none;color:#9aa6b6;font-size:12px}

.samai-sim-agents{
  padding:3px;
  display:inline-flex;
  gap:2px;
  border:1px solid var(--samai-border);
  border-radius:999px;
  background:#eaeff7;
}

/* The mock chrome is scaled to the window it imitates, so these override the
   44px floor that base.css sets for real lesson controls. */
.samai-simulator .samai-sim-agent{
  min-height:32px;
  padding:6px 18px;
  border:0;
  border-radius:999px;
  background:none;
  color:var(--samai-muted);
  font:inherit;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  cursor:pointer;
  transition:background .2s ease,color .2s ease;
}
.samai-sim-agent.is-on{background:var(--samai-surface);color:var(--samai-primary);box-shadow:0 2px 6px #2437711f}

/* `position` is the dialog overlay's anchor: a product's dialogs sit over the
   whole window body, rail included. */
.samai-sim-body{position:relative;min-height:266px;display:grid;grid-template-columns:154px minmax(0,1fr)}
.samai-sim-body.is-bare{grid-template-columns:minmax(0,1fr)}
/* Chat and the screen host share this cell; one is shown at a time. */
.samai-sim-main{min-width:0;display:grid}

.samai-sim-side{
  padding:12px 10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  border-inline-end:1px solid var(--samai-border);
  background:#fbfdfe;
}

.samai-sim-new{
  min-height:32px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font-size:11px;
  font-weight:900;
}
.samai-sim-new i{font-size:9px}
.samai-sim-thread{flex:none;height:10px;border-radius:5px;background:#e6ecf5}
.samai-sim-thread.is-current{background:#3fae9a4d}

/* Named rail destinations replace the anonymous thread bars. */
.samai-sim-side.has-nav{gap:3px}

.samai-simulator .samai-sim-nav{
  min-height:28px;
  padding:7px 9px;
  display:flex;
  align-items:center;
  gap:8px;
  border:0;
  border-radius:9px;
  background:none;
  color:var(--samai-muted);
  font:inherit;
  font-size:10.5px;
  font-weight:800;
  text-align:start;
  cursor:pointer;
  transition:background .2s ease,color .2s ease;
}
.samai-sim-nav>i{flex:none;width:13px;font-size:10px;text-align:center}
.samai-sim-nav>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.samai-sim-nav:hover{background:#eef4fa}
.samai-sim-nav.is-on{background:#3fae9a1f;color:var(--samai-teal-dark);font-weight:900}

.samai-sim-nav-heading{
  margin-block-start:7px;
  padding:6px 9px 2px;
  border-block-start:1px solid var(--samai-border);
  color:#9aa6b6;
  font-size:9px;
  font-weight:900;
}

.samai-sim-account{
  margin-block-start:auto;
  padding:7px 8px;
  display:flex;
  align-items:center;
  gap:8px;
  border-block-start:1px solid var(--samai-border);
  border-radius:10px;
  color:var(--samai-muted);
}

.samai-sim-avatar{
  flex:none;
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font-size:10px;
}

.samai-sim-account-text{min-width:0;display:grid}
.samai-sim-account-text b{overflow:hidden;color:var(--samai-primary);font-size:10.5px;font-weight:900;text-overflow:ellipsis;white-space:nowrap}
.samai-sim-account-text small{overflow:hidden;font-size:9.5px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.samai-sim-account>i:last-child{margin-inline-start:auto;font-size:10px}
.samai-sim-chat{padding:14px;display:grid;align-content:space-between;gap:14px}
.samai-sim-chat[hidden]{display:none}
.samai-sim-messages{display:grid;align-content:start;gap:10px}
.samai-sim-empty{margin:22px 0;color:#9aa6b6;font-size:12px;font-weight:800;text-align:center}

.samai-sim-message{
  margin:0;
  padding:10px 13px;
  border-radius:14px;
  font-size:11.5px;
  font-weight:800;
  line-height:1.75;
}

.samai-sim-message p{margin:0}

.samai-sim-message.is-user{
  justify-self:start;
  max-width:82%;
  border:1px solid #3fae9a52;
  background:#eaf6f3;
  color:var(--samai-teal-dark);
}

.samai-sim-message.is-assistant{
  justify-self:end;
  width:86%;
  border:1px solid var(--samai-border);
  background:var(--samai-surface-soft);
}

.samai-sim-message.is-pending{display:grid;gap:7px;padding:13px}
.samai-sim-message.is-pending i{height:7px;border-radius:4px;background:#dbe3ef}
.samai-sim-message.is-pending i:last-child{width:58%}
.samai-sim-message-files{margin-block-end:8px;display:flex;flex-wrap:wrap;gap:6px}
.samai-sim-message .samai-sim-file{border-color:#3fae9a4d;background:#ffffffb8}
.samai-sim-message .samai-sim-doc{margin-block-start:8px}

.samai-sim-points{
  margin:8px 0 0;
  padding-inline-start:18px;
  color:var(--samai-muted);
  font-size:11px;
  font-weight:700;
  line-height:2;
}

/* What the window is doing, and that it has not finished doing it, on one line.
   It holds the height it has once it carries words, so the surface does not
   resize under the learner on a step that reports none. */
.samai-sim-working{
  min-height:38px;
  max-width:88%;
  padding:8px 13px;
  justify-self:start;
  display:flex;
  align-items:center;
  gap:9px;
  border:1.4px solid var(--samai-border);
  border-radius:14px;
  background:var(--samai-surface-soft);
  color:var(--samai-muted);
  font-size:11.5px;
  font-weight:900;
  line-height:1.7;
  transition:border-color .35s ease,background .35s ease,color .35s ease;
}
.samai-sim-working[hidden]{display:none}
.samai-sim-working.is-agent{border-color:#3fae9a52;background:#3fae9a17;color:var(--samai-teal-dark)}
.samai-sim-working.is-tools{border-color:#e8a53f66;background:#e8a53f1c;color:#8a5510}
.samai-sim-working.is-model{border-color:#7a5cc659;background:#7a5cc61a;color:#4d3a86}
.samai-sim-working-icon{display:grid;place-items:center;font-size:11px}
.samai-sim-working-icon:empty,
.samai-sim-working-text:empty{display:none}
.samai-sim-working-dots{flex:none;display:flex;gap:5px}

.samai-sim-working-dots i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor;
  animation:samai-sim-bob 1.1s infinite;
}
.samai-sim-working-dots i:nth-child(2){animation-delay:.15s}
.samai-sim-working-dots i:nth-child(3){animation-delay:.3s}

@keyframes samai-sim-bob{
  0%,60%,100%{transform:translateY(0);opacity:.4}
  30%{transform:translateY(-5px);opacity:1}
}

.samai-sim-composer{
  padding:8px 10px;
  display:grid;
  gap:8px;
  border:1px solid var(--samai-border);
  border-radius:15px;
  background:var(--samai-surface);
  box-shadow:0 2px 8px #24377110;
}

.samai-sim-row{display:flex;align-items:center;gap:8px}
.samai-sim-files{display:flex;flex-wrap:wrap;gap:6px}

/* What the composer is for on this step, said once under it. */
.samai-sim-hint{
  margin:0;
  color:var(--samai-muted);
  font-size:10.5px;
  font-weight:750;
  line-height:1.8;
  text-align:center;
}
.samai-sim-hint[hidden]{display:none}

.samai-sim-file{
  padding:5px 9px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--samai-border);
  border-radius:9px;
  background:var(--samai-surface-soft);
  color:var(--samai-primary);
  font-size:10.5px;
  font-weight:800;
}
.samai-sim-file>i{color:var(--samai-primary-2);font-size:11px}

.samai-sim-field{
  flex:1 1 120px;
  min-width:0;
  display:flex;
  align-items:center;
  gap:1px;
  overflow:hidden;
  font-size:11.5px;
  font-weight:700;
  white-space:nowrap;
}

.samai-sim-placeholder{overflow:hidden;color:#9aa6b6;text-overflow:ellipsis}
.samai-sim-typed{overflow:hidden;color:var(--samai-ink);font-weight:800;text-overflow:ellipsis}
.samai-sim-caret{display:none;flex:none;width:1.5px;height:14px;background:var(--samai-primary)}
.samai-sim-field.is-typing .samai-sim-caret{display:block;animation:samai-sim-caret 1.06s steps(2,jump-none) infinite}

@keyframes samai-sim-caret{
  from{opacity:1}
  to{opacity:0}
}

.samai-sim-tools{position:relative;flex:none}

.samai-simulator .samai-sim-plus{
  width:34px;
  height:34px;
  min-height:34px;
  padding:0;
  display:grid;
  place-items:center;
  border:1px solid var(--samai-border);
  border-radius:50%;
  background:var(--samai-surface-soft);
  color:var(--samai-primary);
  font-size:12px;
  cursor:pointer;
  transition:background .2s ease,border-color .2s ease,transform .2s ease;
}
.samai-sim-plus:hover{border-color:#3fae9a80;background:#f2faf8}
.samai-sim-tools.is-open .samai-sim-plus{border-color:var(--samai-teal);background:#3fae9a1a;transform:rotate(45deg)}
.samai-sim-pickers{flex:none;display:flex;gap:6px}
.samai-sim-picker{position:relative}

.samai-simulator .samai-sim-picker-button{
  min-height:34px;
  padding:6px 12px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--samai-border);
  border-radius:999px;
  background:var(--samai-surface-soft);
  color:var(--samai-muted);
  font:inherit;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  cursor:pointer;
  transition:background .2s ease,border-color .2s ease;
}
.samai-sim-picker-button:hover{border-color:#3fae9a80;background:#f2faf8}
.samai-sim-picker-button>i{color:#9aa6b6;font-size:9px}
.samai-sim-picker-value{overflow:hidden;color:var(--samai-primary);font-weight:900;text-overflow:ellipsis}
.samai-sim-picker.is-open .samai-sim-picker-button{border-color:var(--samai-teal);background:#3fae9a14}

.samai-sim-menu{
  position:absolute;
  inset-block-end:calc(100% + 7px);
  inset-inline-start:0;
  z-index:3;
  min-width:172px;
  padding:6px;
  display:none;
  border:1px solid var(--samai-border);
  border-radius:13px;
  background:var(--samai-surface);
  box-shadow:0 14px 30px #24377126;
}
.samai-sim-picker .samai-sim-menu{inset-inline-start:auto;inset-inline-end:0;min-width:148px}
.is-open>.samai-sim-menu{display:grid;gap:2px}

.samai-sim-option{
  padding:8px 10px;
  display:flex;
  align-items:center;
  gap:9px;
  border-radius:9px;
  color:var(--samai-ink);
  font-size:11.5px;
  font-weight:800;
  white-space:nowrap;
}
.samai-sim-option>i{width:13px;color:var(--samai-teal-dark);font-size:11px;text-align:center}
.samai-sim-option[role="option"]>i{visibility:hidden}
.samai-sim-option[role="option"].is-current{background:#3fae9a1c;color:var(--samai-teal-dark)}
.samai-sim-option[role="option"].is-current>i{visibility:visible}
.samai-simulator:not(.is-guided) .samai-sim-option{cursor:pointer}
.samai-simulator:not(.is-guided) .samai-sim-option:hover{background:#3fae9a14}

.samai-simulator .samai-sim-send{
  width:34px;
  height:34px;
  min-height:34px;
  flex:none;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg,var(--samai-teal),var(--samai-green));
  color:#fff;
  font-size:12px;
  cursor:pointer;
}

/* What a reply leaned on — the pills an assistant shows under its answer. */
.samai-sim-cites{margin-block-start:8px;display:flex;flex-wrap:wrap;gap:6px}

.samai-sim-cite{
  padding:3px 9px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid #3fae9a3d;
  border-radius:999px;
  background:#ffffffb8;
  color:var(--samai-teal-dark);
  font-size:10px;
  font-weight:900;
}
.samai-sim-cite>i{font-size:9px}

/* ─── Screens ──────────────────────────────────────────────────────────────
   The surfaces an assistant app has beyond the chat. One host, refilled from
   the screen a step selects. */
.samai-sim-screen{min-width:0;display:grid;grid-template-columns:minmax(0,1fr)}
.samai-sim-screen[hidden]{display:none}
.samai-sim-screen.has-menu{grid-template-columns:118px minmax(0,1fr)}

.samai-sim-screen-menu{
  padding:12px 9px;
  display:flex;
  flex-direction:column;
  gap:3px;
  border-inline-end:1px solid var(--samai-border);
  background:#fbfdfe;
}
.samai-sim-screen-menu>b{padding:0 7px 6px;color:var(--samai-primary);font-size:10.5px;font-weight:900}

.samai-sim-screen-menu-item{
  padding:6px 8px;
  display:flex;
  align-items:center;
  gap:7px;
  border-radius:8px;
  color:var(--samai-muted);
  font-size:9.5px;
  font-weight:800;
}
.samai-sim-screen-menu-item>i{flex:none;width:12px;font-size:9px;text-align:center}
.samai-sim-screen-menu-item>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.samai-sim-screen-menu-item.is-on{background:#3fae9a1f;color:var(--samai-teal-dark);font-weight:900}

.samai-sim-screen-body{min-width:0;padding:14px;display:grid;align-content:start;gap:10px}

.samai-sim-screen-head{
  padding-block-end:10px;
  display:flex;
  align-items:center;
  gap:10px;
  border-block-end:1px solid var(--samai-border);
}

.samai-sim-screen-icon{
  flex:none;
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font-size:11px;
}

.samai-sim-screen-title{min-width:0;flex:1 1 auto;display:grid;gap:1px}
.samai-sim-screen-title b{color:var(--samai-primary);font-size:11.5px;font-weight:900}
.samai-sim-screen-title small{color:var(--samai-muted);font-size:9.5px;font-weight:700;line-height:1.6}

.samai-simulator .samai-sim-screen-action{
  margin-inline-start:auto;
  flex:none;
  min-height:0;
  padding:6px 11px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:0;
  border-radius:9px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font:inherit;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}
.samai-sim-screen-action>i{font-size:9px}

/* ─── Blocks ─────────────────────────────────────────────────────────────── */

.samai-sim-hero{padding:22px 14px;display:grid;justify-items:center;gap:6px;text-align:center}

.samai-sim-hero-icon{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font-size:15px;
}
.samai-sim-hero b{color:var(--samai-primary);font-size:13px;font-weight:900}
.samai-sim-hero p{margin:0;max-width:44ch;color:var(--samai-muted);font-size:10.5px;font-weight:750;line-height:1.85}

.samai-sim-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.samai-sim-tiles.is-1{grid-template-columns:minmax(0,1fr)}
.samai-sim-tiles.is-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.samai-sim-tiles.is-4{grid-template-columns:repeat(4,minmax(0,1fr))}

.samai-sim-tile{
  padding:10px;
  display:grid;
  justify-items:start;
  gap:3px;
  border:1px solid var(--samai-border);
  border-radius:10px;
  background:var(--samai-surface-soft);
}
.samai-sim-tile>i{color:var(--samai-teal-dark);font-size:12px}
.samai-sim-tile b{overflow:hidden;max-width:100%;color:var(--samai-primary);font-size:10px;font-weight:900;text-overflow:ellipsis;white-space:nowrap}
.samai-sim-tile small{color:var(--samai-muted);font-size:9px;font-weight:700}
.samai-sim-tile.is-on{border-color:#3fae9a66;background:#3fae9a14}

.samai-sim-lines{display:grid;gap:7px}

.samai-sim-line{
  padding:9px 11px;
  display:flex;
  align-items:center;
  gap:9px;
  border:1px solid var(--samai-border);
  border-radius:10px;
  background:var(--samai-surface);
}
.samai-sim-line-icon{flex:none;width:22px;height:22px;display:grid;place-items:center;border-radius:7px;background:#eef4fa;color:var(--samai-primary-2);font-size:10px}
.samai-sim-line-text{min-width:0;flex:1 1 auto;display:grid;gap:2px}
.samai-sim-line-text b{overflow:hidden;color:var(--samai-primary);font-size:10.5px;font-weight:900;text-overflow:ellipsis}
.samai-sim-line-text small{color:var(--samai-muted);font-size:9.5px;font-weight:700;line-height:1.65}
.samai-sim-line-meta{flex:none;color:var(--samai-muted);font-size:9px;font-weight:800;white-space:nowrap}

.samai-simulator .samai-sim-line-action{
  flex:none;
  min-height:0;
  padding:5px 11px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid #3fae9a52;
  border-radius:8px;
  background:var(--samai-surface);
  color:var(--samai-teal-dark);
  font:inherit;
  font-size:9.5px;
  font-weight:900;
  white-space:nowrap;
}

.samai-sim-state{
  flex:none;
  padding:4px 9px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  background:#e9f7f2;
  color:var(--samai-teal-dark);
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
}
.samai-sim-state>i{font-size:8px}
.samai-sim-state.is-warning{background:#fdf1e0;color:#a2660f}
.samai-sim-state.is-muted{background:#eef1f6;color:var(--samai-muted)}
.samai-sim-state.is-danger{background:#fbeceb;color:#a4342a}

/* The product's on/off — shown, never operated: what it is set to is the point,
   not the flipping of it. */
.samai-sim-toggle{
  position:relative;
  flex:none;
  width:30px;
  height:17px;
  border-radius:999px;
  background:#d6dfeb;
  transition:background .2s ease;
}
.samai-sim-toggle::after{
  content:"";
  position:absolute;
  inset-block-start:3px;
  inset-inline-start:3px;
  width:11px;
  height:11px;
  border-radius:50%;
  background:#fff;
  transition:inset-inline-start .2s ease;
}
.samai-sim-toggle.is-on{background:var(--samai-teal)}
.samai-sim-toggle.is-on::after{inset-inline-start:16px}

.samai-sim-chips{margin-block-start:3px;display:flex;flex-wrap:wrap;gap:4px}

.samai-sim-chip{
  padding:2px 8px;
  border:1px solid var(--samai-border);
  border-radius:999px;
  background:var(--samai-surface-soft);
  color:var(--samai-muted);
  font-size:8.5px;
  font-weight:800;
}

.samai-sim-screen-note{
  padding:10px 12px;
  display:grid;
  gap:4px;
  border:1px dashed #3fae9a52;
  border-radius:10px;
  background:#f2faf8;
}
.samai-sim-screen-note b{display:flex;align-items:center;gap:6px;color:var(--samai-teal-dark);font-size:10px;font-weight:900}
.samai-sim-screen-note b>i{font-size:9px}
.samai-sim-screen-note small{color:var(--samai-ink);font-size:9.5px;font-weight:700;line-height:1.75}

.samai-sim-empty-state{
  padding:22px 14px;
  display:grid;
  justify-items:center;
  gap:5px;
  border:1px dashed var(--samai-border);
  border-radius:12px;
  background:var(--samai-surface-soft);
  text-align:center;
}
.samai-sim-empty-state>i{color:#9aa6b6;font-size:17px}
.samai-sim-empty-state b{color:var(--samai-primary);font-size:11px;font-weight:900}
.samai-sim-empty-state small{max-width:40ch;color:var(--samai-muted);font-size:9.5px;font-weight:750;line-height:1.75}
.samai-sim-empty-state .samai-sim-button{margin-block-start:6px}

/* Two panels side by side is how a product lays out a detail page; a panel is
   any block list with a heading, so the pair nests rather than being a layout. */
.samai-sim-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
.samai-sim-columns.is-3{grid-template-columns:repeat(3,minmax(0,1fr))}

.samai-sim-panel{
  padding:11px 12px;
  display:grid;
  align-content:start;
  gap:8px;
  border:1px solid var(--samai-border);
  border-radius:11px;
  background:var(--samai-surface);
}
.samai-sim-panel>b{display:flex;align-items:center;gap:6px;color:var(--samai-primary);font-size:10px;font-weight:900}
.samai-sim-panel>b>i{color:var(--samai-teal-dark);font-size:9px}
.samai-sim-panel>p{margin:0;color:var(--samai-muted);font-size:9.5px;font-weight:750;line-height:1.8}

/* The wait that matters: files are not part of a project until this ends. */
.samai-sim-upload{display:grid;gap:8px}
.samai-sim-upload-rows{display:grid;gap:6px}

.samai-sim-upload-row{
  position:relative;
  overflow:hidden;
  padding:9px 11px;
  display:flex;
  align-items:center;
  gap:9px;
  border:1px solid var(--samai-border);
  border-radius:10px;
  background:var(--samai-surface);
}
.samai-sim-upload-icon{flex:none;width:22px;height:22px;display:grid;place-items:center;border-radius:7px;background:#eef4fa;color:var(--samai-primary-2);font-size:10px}
.samai-sim-upload-state{flex:none;color:var(--samai-muted);font-size:9px;font-weight:900;white-space:nowrap}
.samai-sim-upload-bar{position:absolute;inset-block-end:0;inset-inline:0;height:2px;background:#e6ecf5}

.samai-sim-upload-bar>i{
  display:block;
  width:15%;
  height:100%;
  background:var(--samai-teal);
  animation:samai-sim-fill 1.5s ease-in-out infinite;
}

@keyframes samai-sim-fill{
  from{width:8%}
  to{width:92%}
}

.samai-sim-upload.is-done .samai-sim-upload-icon{background:#e9f7f2;color:var(--samai-teal-dark)}
.samai-sim-upload.is-done .samai-sim-upload-state{color:var(--samai-teal-dark)}
.samai-sim-upload.is-done .samai-sim-upload-bar>i{width:100%;animation:none}
.samai-sim-upload-action{display:flex;justify-content:center}

.samai-sim-notice{
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:9px;
  border:1px solid #3fae9a3d;
  border-radius:11px;
  background:#f2faf8;
}
.samai-sim-notice-icon{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:8px;background:var(--samai-teal);color:#fff;font-size:10px}

.samai-sim-doc{
  padding:11px 13px;
  display:grid;
  gap:7px;
  border:1px solid var(--samai-border);
  border-radius:11px;
  background:var(--samai-surface-soft);
}
.samai-sim-doc-meta{color:#9aa6b6;font-size:8.5px;font-weight:800}
.samai-sim-doc p{margin:0;color:var(--samai-ink);font-size:10px;font-weight:700;line-height:1.9}
.samai-sim-doc p b{display:block;color:var(--samai-primary);font-size:10px;font-weight:900}
.samai-sim-doc p.is-muted{color:var(--samai-muted)}
.samai-sim-doc p.is-warning{color:#8a5510}

.samai-sim-popup{
  width:180px;
  padding:5px;
  display:grid;
  gap:1px;
  border:1px solid var(--samai-border);
  border-radius:11px;
  background:var(--samai-surface);
  box-shadow:0 14px 30px #24377126;
}

.samai-sim-popup-item{
  padding:7px 9px;
  display:flex;
  align-items:center;
  gap:8px;
  border-radius:8px;
  color:var(--samai-ink);
  font-size:9.5px;
  font-weight:800;
}
.samai-sim-popup-item>i{width:12px;color:var(--samai-muted);font-size:9px;text-align:center}
.samai-sim-popup-item.is-danger,
.samai-sim-popup-item.is-danger>i{color:#a4342a}

.samai-sim-field-row{display:grid;gap:5px}
.samai-sim-field-label{color:var(--samai-muted);font-size:9.5px;font-weight:900}

/* Real controls: the learner's own words are what later steps read back. */
.samai-simulator .samai-sim-input{
  width:100%;
  min-height:0;
  padding:9px 11px;
  border:1px solid #d9dfe9;
  border-radius:9px;
  background:var(--samai-surface);
  color:var(--samai-ink);
  font:inherit;
  font-size:10.5px;
  font-weight:800;
  line-height:1.7;
}
.samai-simulator .samai-sim-input.is-area{min-height:64px;resize:vertical}
.samai-simulator .samai-sim-input:focus-visible{border-color:var(--samai-teal);outline:2px solid #3fae9a4d;outline-offset:1px}

.samai-sim-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

.samai-simulator .samai-sim-choice{
  min-height:0;
  padding:10px 11px;
  display:flex;
  align-items:center;
  gap:9px;
  border:1px solid var(--samai-border);
  border-radius:10px;
  background:var(--samai-surface);
  font:inherit;
  text-align:start;
  cursor:pointer;
  transition:border-color .2s ease,background .2s ease;
}
.samai-sim-choice>i{flex:none;color:#9aa6b6;font-size:12px}
.samai-sim-choice:hover{border-color:#3fae9a80;background:#f5fbfa}
.samai-sim-choice.is-on{border-color:var(--samai-teal);background:#3fae9a14}
.samai-sim-choice.is-on>i{color:var(--samai-teal-dark)}

.samai-sim-actions{display:flex;flex-wrap:wrap;gap:7px}
.samai-sim-actions.is-center{justify-content:center}
.samai-sim-actions.is-end{justify-content:flex-end}

.samai-simulator .samai-sim-button{
  min-height:0;
  padding:8px 14px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid transparent;
  border-radius:9px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font:inherit;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
  cursor:pointer;
  transition:filter .2s ease,border-color .2s ease,background .2s ease;
}
.samai-sim-button>i{font-size:9px}
.samai-sim-button:hover:not(:disabled){filter:brightness(1.06)}
.samai-sim-button:disabled{opacity:.5;cursor:default}
.samai-simulator .samai-sim-button.is-quiet{border-color:var(--samai-border);background:#eef1f6;color:var(--samai-muted)}
.samai-simulator .samai-sim-button.is-outline{border-color:#3fae9a52;background:var(--samai-surface);color:var(--samai-teal-dark)}

/* ─── Dialogs ─────────────────────────────────────────────────────────────── */

.samai-sim-overlay{
  position:absolute;
  inset:0;
  z-index:2;
  padding:16px;
  display:grid;
  place-items:center;
  background:#0d1b2f4d;
}
.samai-sim-overlay[hidden]{display:none}

.samai-sim-dialog{
  overflow:hidden;
  width:min(420px,100%);
  max-height:100%;
  display:flex;
  flex-direction:column;
  border-radius:14px;
  background:var(--samai-surface);
  box-shadow:0 20px 44px #0d1b2f38;
}

.samai-sim-dialog-head{
  padding:11px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  border-block-end:1px solid var(--samai-border);
}
.samai-sim-dialog-head b{flex:1 1 auto;color:var(--samai-primary);font-size:11.5px;font-weight:900}

.samai-simulator .samai-sim-dialog-close{
  flex:none;
  width:24px;
  height:24px;
  min-height:0;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  border-radius:7px;
  background:none;
  color:var(--samai-muted);
  font-size:11px;
  cursor:pointer;
}
.samai-sim-dialog-body{min-height:0;padding:14px;display:grid;align-content:start;gap:10px;overflow-y:auto}
.samai-sim-dialog-lead{margin:0;color:var(--samai-muted);font-size:10px;font-weight:750;line-height:1.8}

/* ─── Spotlight and controls ─────────────────────────────────────────────── */

.samai-sim-spotlight{
  position:absolute;
  top:0;
  left:0;
  z-index:3;
  border:2px solid var(--samai-teal);
  border-radius:12px;
  background:#3fae9a14;
  box-shadow:0 0 0 9999px #0d1b2f30;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease,top .3s ease,left .3s ease,width .3s ease,height .3s ease;
}
.samai-sim-spotlight.is-on{opacity:1}
/* The ring is the way forward, so it takes the press the inert control beneath
   it cannot. Only once it is actually over something. */
.samai-simulator.has-hotspots .samai-sim-spotlight.is-on{pointer-events:auto;cursor:pointer}

/* Placed from measured pixels, so `left` is physical; the translate keeps the
   label anchored to the reading edge of the spotlight in either direction. */
.samai-sim-callout{
  position:absolute;
  top:0;
  left:0;
  z-index:4;
  padding:4px 11px;
  border-radius:8px;
  background:var(--samai-teal);
  color:#fff;
  font-size:11px;
  font-weight:900;
  line-height:1.6;
  white-space:nowrap;
  opacity:0;
  transform:translateX(-100%);
  pointer-events:none;
  transition:opacity .25s ease;
}
.samai-sim-callout.is-on{opacity:1}

.samai-sim-caption{
  margin-block-start:18px;
  display:grid;
  grid-template-columns:34px minmax(0,1fr);
  align-items:start;
  gap:12px;
}

.samai-sim-number{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font-size:14px;
  font-weight:900;
}

.samai-sim-text{
  margin:0;
  min-height:62px;
  color:var(--samai-ink);
  font-size:14.5px;
  font-weight:700;
  line-height:1.9;
}

/* Equal side columns keep the dots dead centre when the next label swaps to
   the restart label, which is wider. */
.samai-sim-controls{
  margin-block-start:14px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:12px;
}
.samai-sim-previous{justify-self:start}
.samai-sim-next{justify-self:end}

.samai-sim-controls>button{
  padding:9px 16px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid #3fae9a40;
  border-radius:12px;
  background:var(--samai-surface);
  color:var(--samai-primary);
  font:inherit;
  font-size:12.5px;
  font-weight:900;
  cursor:pointer;
  transition:border-color .2s ease,background .2s ease;
}
.samai-sim-controls>button:hover:not(:disabled){border-color:var(--samai-teal);background:#f2faf8}
.samai-sim-controls>button:disabled{opacity:.45;cursor:default}
.samai-sim-dots{display:flex;gap:7px}

.samai-sim-dots .samai-sim-dot{
  width:11px;
  height:11px;
  min-height:0;
  padding:0;
  border:0;
  border-radius:50%;
  background:#d6dfeb;
  cursor:pointer;
  transition:background .2s ease,transform .2s ease;
}
.samai-sim-dot.is-on{background:var(--samai-teal);transform:scale(1.25)}
.samai-sim-print{display:none}
.samai-sim-note{margin:14px 0 0;color:var(--samai-muted);font-size:11.5px;font-weight:700;line-height:1.85;text-align:center}

/* ─── Journey ─────────────────────────────────────────────────────────────
   The window opens full width and narrows on the first press, letting the
   components working behind it into the pane alongside. Only the first column
   changes, so the pair of track values stays interpolable. */
.samai-sim-split{
  display:grid;
  grid-template-columns:var(--samai-sim-pane,380px) minmax(0,1fr);
  gap:var(--samai-sim-gap,22px);
  align-items:stretch;
  transition:grid-template-columns .75s cubic-bezier(.4,0,.2,1),gap .75s ease;
}
.samai-sim-split.is-full{--samai-sim-pane:100%;--samai-sim-gap:0px}

.samai-sim-screen-pane{min-width:0;display:flex;flex-direction:column}
.samai-sim-screen-pane .samai-sim-stage{flex:1;display:flex;flex-direction:column;padding:18px}
.samai-sim-screen-pane .samai-sim-window{flex:1;display:flex;flex-direction:column}
.samai-sim-screen-pane .samai-sim-body{flex:1}
.samai-sim-screen-pane .samai-sim-name{overflow:visible;text-overflow:clip}

/* The rail and the agent switcher are the interface being minimised: they
   collapse as the panes split, leaving the conversation and the prompt field.
   The switcher leaves the layout as well as the eye, or it keeps its share of
   the top bar and the app name gets ellipsised in the narrow column. */
.samai-sim-screen-pane .samai-sim-body{grid-template-columns:auto minmax(0,1fr)}
.samai-sim-screen-pane .samai-sim-side{
  max-width:154px;
  overflow:hidden;
  transition:max-width .75s cubic-bezier(.4,0,.2,1),padding .75s ease,opacity .4s ease,border-width .4s ease;
}
.samai-sim-split:not(.is-full) .samai-sim-side{max-width:0;padding-inline:0;border-inline-end-width:0;opacity:0}
.samai-sim-split:not(.is-full) .samai-sim-agents{display:none}
.samai-sim-split:not(.is-full) .samai-sim-top{grid-template-columns:minmax(0,1fr) auto}

.samai-sim-engine{
  position:relative;
  min-height:520px;
  padding:22px;
  border:1.5px solid var(--samai-border);
  border-radius:var(--samai-radius-lg);
  background:var(--samai-surface);
  box-shadow:var(--samai-shadow);
  transition:opacity .45s ease .3s;
}
.samai-sim-split.is-full .samai-sim-engine{opacity:0;overflow:hidden;transition-delay:0s}

.samai-sim-engine-title{
  margin:0 0 16px;
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--samai-muted);
  font-size:13px;
  font-weight:900;
}
.samai-sim-engine-title::after{content:"";flex:1;height:1px;background:var(--samai-border)}

/* The track scrolls inside the panel rather than moving the page, and the mask
   keeps the nodes at either end from ending abruptly at the edge. */
.samai-sim-view{
  position:relative;
  height:430px;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);
}

.samai-sim-track{margin:0;padding:6px 2px;display:grid;gap:28px;list-style:none}

.samai-sim-node{
  position:relative;
  padding:16px 18px;
  border:1.7px solid var(--samai-border);
  border-radius:20px;
  background:var(--samai-surface);
  opacity:.38;
  transform:scale(.985);
  transition:opacity .45s ease,transform .45s ease,box-shadow .45s ease,border-color .45s ease;
}
.samai-sim-node.is-on{opacity:1;transform:none;box-shadow:0 16px 34px #2437711a}
.samai-sim-node.is-active{border-color:var(--samai-teal)}

/* The connector to the next node, drawn as a rotated corner so it needs no icon
   font. The borders are physical on purpose: `border-inline-start` resolves to
   the right edge in RTL, which turns the chevron a quarter turn sideways. */
.samai-sim-node:not(:last-child)::after{
  content:"";
  position:absolute;
  bottom:-20px;
  left:50%;
  width:9px;
  height:9px;
  border-right:2.5px solid #24377129;
  border-bottom:2.5px solid #24377129;
  transform:translateX(-50%) rotate(45deg);
  transition:border-color .4s ease;
}
.samai-sim-node.is-flow-on::after{border-color:var(--samai-teal)}

.samai-sim-pulse{
  position:absolute;
  inset:-3px;
  border:2px solid var(--samai-teal);
  border-radius:22px;
  opacity:0;
  pointer-events:none;
}
.samai-sim-node.is-active .samai-sim-pulse{animation:samai-sim-pulse 1.8s ease-out infinite}

@keyframes samai-sim-pulse{
  0%{opacity:.55;transform:scale(1)}
  100%{opacity:0;transform:scale(1.035)}
}

.samai-sim-node-head{display:flex;align-items:center;gap:13px}

.samai-sim-node-icon{
  width:46px;
  height:46px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:15px;
  color:#fff;
  font-size:18px;
}
.samai-sim-node.is-app .samai-sim-node-icon{background:linear-gradient(135deg,var(--samai-primary),#3d5da8)}
.samai-sim-node.is-agent .samai-sim-node-icon{background:linear-gradient(135deg,#4fc3ac,var(--samai-teal))}
.samai-sim-node.is-tools .samai-sim-node-icon{background:linear-gradient(135deg,#f0b452,#e8952a)}
.samai-sim-node.is-model .samai-sim-node-icon{background:linear-gradient(135deg,#a186e0,#7a5cc6)}

.samai-sim-node-text{min-width:0;flex:1}
.samai-sim-node-text b{display:block;color:var(--samai-primary);font-size:16px;font-weight:900}
.samai-sim-node-text span{margin-block-start:2px;display:block;color:var(--samai-muted);font-size:12.5px;font-weight:700;line-height:1.7}

.samai-sim-tags{margin-block-start:13px;display:flex;flex-wrap:wrap;gap:8px}

.samai-sim-tag{
  padding:9px 12px;
  display:flex;
  align-items:center;
  gap:7px;
  border:1.4px solid var(--samai-border);
  border-radius:11px;
  background:var(--samai-surface);
  color:var(--samai-muted);
  font-size:12.5px;
  font-weight:900;
  opacity:.5;
  transition:opacity .35s ease,border-color .35s ease,background .35s ease,color .35s ease;
}
.samai-sim-tag.is-on{border-color:#e8952a;background:#e8a53f1c;color:#8a5510;opacity:1}

/* Each step's narration lands in the node it is about, so the words and the lit
   component are never in two different places. */
.samai-sim-say{
  margin-block-start:0;
  padding:0 15px;
  display:flex;
  align-items:flex-start;
  gap:11px;
  max-height:0;
  overflow:hidden;
  border-inline-start:4px solid var(--samai-teal);
  border-radius:13px;
  background:linear-gradient(180deg,#fff,#f3faf9);
  color:var(--samai-ink);
  font-size:14px;
  font-weight:800;
  line-height:1.95;
  opacity:0;
  transition:opacity .3s ease,max-height .45s ease,padding .3s ease,margin .3s ease;
}
.samai-sim-say.is-on{margin-block-start:13px;padding:13px 15px;max-height:260px;opacity:1}
.samai-sim-say p{margin:0}

.samai-sim-say-key{
  width:30px;
  height:30px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:linear-gradient(135deg,var(--samai-primary),var(--samai-teal));
  color:#fff;
  font-size:13px;
  font-weight:900;
}

.samai-sim-full-say{margin-block-start:0}
.samai-sim-full-say.is-on{margin-block-start:16px}
.samai-sim-split:not(.is-full) .samai-sim-full-say{display:none}

@media(max-width:960px){
  .samai-hero-section-split .samai-hero-layout{grid-template-columns:1fr}
  .samai-grid[style*="--samai-columns:3"],
