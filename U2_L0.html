// the screen is not rebuilt on the keystroke, so the caret stays where it is;
// everything reading `{field}` catches up at the next step.
function renderField(block, values) {
  const bind = asText(block.bind);
  const value = asText(values[bind]);
  const control = CONTROLS.includes(block.control) ? block.control : "text";
  const attrs = { "data-bind": bind, placeholder: block.placeholder ? fill(block.placeholder, values) : null };
  let input;
  if (control === "textarea") {
    input = el("textarea", { className: "samai-sim-input is-area", attrs, text: value });
  } else if (control === "select") {
    input = el("select", { className: "samai-sim-input", attrs }, asArray(block.options).map((option) => {
      const label = fill(isObject(option) ? option.label : option, values);
      return el("option", { text: label, attrs: { value: label, selected: label === value ? "" : null } });
    }));
  } else {
    input = el("input", {
      className: "samai-sim-input",
      type: control === "time" ? "time" : "text",
      attrs: Object.assign({ value }, attrs)
    });
  }
  return el("label", { className: "samai-sim-field-row", attrs: partAttrs(block) }, [
    block.label ? el("span", { className: "samai-sim-field-label", text: fill(block.label, values) }) : null,
    input
  ]);
}

/** Cards that set a field by being pressed — the pick a step then reads back. */
function renderChoices(block, values) {
  const bind = asText(block.bind);
  const current = asText(values[bind]);
  return el("div", { className: "samai-sim-choices", attrs: partAttrs(block) },
    asArray(block.items).map((item) => el("button", {
      className: `samai-sim-choice${asText(item.value) === current ? " is-on" : ""}`,
      type: "button",
      attrs: Object.assign(partAttrs(item), { "data-choice": bind, "data-value": asText(item.value) })
    }, [
      icon(item.icon, "circle-check"),
      el("span", { className: "samai-sim-line-text" }, [
        el("b", { text: fill(item.title, values) }),
        item.text ? el("small", { text: fill(item.text, values) }) : null
      ])
    ])));
}

function renderActions(block, values) {
  return el("div", {
    className: `samai-sim-actions${block.align ? ` is-${validClassNames(block.align)}` : ""}`,
    attrs: partAttrs(block)
  }, asArray(block.items).map((item) => renderAction(item, values, "samai-sim-button")));
}

function renderPanel(block, values) {
  return el("div", { className: "samai-sim-panel", attrs: partAttrs(block) }, [
    block.title ? el("b", {}, iconText(block.icon, fill(block.title, values), "square")) : null,
    block.text ? el("p", { text: fill(block.text, values) }) : null,
    // `renderBlocks` is declared below and hoisted: panels and columns recurse.
    ...renderBlocks(block.blocks, values)
  ]);
}

function renderColumns(block, values) {
  return el("div", {
    className: `samai-sim-columns${block.columns ? ` is-${Math.max(2, Math.min(3, Number(block.columns) || 2))}` : ""}`,
    attrs: partAttrs(block)
  }, renderBlocks(block.blocks, values));
}

const BLOCKS = {
  hero: renderHero,
  tiles: renderTiles,
  rows: renderRows,
  columns: renderColumns,
  panel: renderPanel,
  note: renderNote,
  empty: renderEmpty,
  upload: renderUpload,
  notice: renderNotice,
  doc: renderDoc,
  menu: renderMenuBlock,
  field: renderField,
  choices: renderChoices,
  actions: renderActions
};

function renderBlocks(blocks, values) {
  return asArray(blocks).filter(isObject).map((block) => {
    const render = BLOCKS[asText(block.type)];
    return render ? render(block, values) : null;
  }).filter(Boolean);
}

// ─── Surfaces ────────────────────────────────────────────────────────────────

function renderSurfaceHead(surface, values) {
  if (!surface.title && !surface.lead && !surface.action) return null;
  return el("div", { className: "samai-sim-screen-head" }, [
    surface.icon === false ? null : el("span", { className: "samai-sim-screen-icon" },
      icon(surface.icon, "window-maximize")),
    el("span", { className: "samai-sim-screen-title" }, [
      el("b", { text: fill(surface.title, values) }),
      surface.lead ? el("small", { text: fill(surface.lead, values) }) : null
    ]),
    renderAction(surface.action, values, "samai-sim-screen-action")
  ]);
}

function renderScreen(screen, values) {
  const menu = isObject(screen.menu) ? screen.menu : null;
  const body = el("div", { className: "samai-sim-screen-body" }, [
    renderSurfaceHead(screen, values),
    ...renderBlocks(screen.blocks, values)
  ]);
  if (!menu) return [body];
  return [
    el("aside", {
      className: "samai-sim-screen-menu",
      attrs: { "aria-label": asText(menu.label, asText(screen.title)) }
    }, [
      menu.label ? el("b", { text: fill(menu.label, values) }) : null,
      // `active` names an item by key when it has one, otherwise by label, so a
      // second screen can reuse the same menu without cloning its keys.
      ...asArray(menu.items).map((item) => el("span", {
        className: `samai-sim-screen-menu-item${(item.key || item.label) === menu.active ? " is-on" : ""}`,
        attrs: partAttrs(item)
      }, [icon(item.icon, "gear"), el("span", { text: fill(item.label, values) })]))
    ]),
    body
  ];
}

function renderModal(modal, values, closeLabel) {
  return el("div", { className: "samai-sim-dialog", attrs: { "data-part": "modal", role: "dialog" } }, [
    el("div", { className: "samai-sim-dialog-head" }, [
      el("b", { text: fill(modal.title, values) }),
      el("button", {
        className: "samai-sim-dialog-close",
        type: "button",
        attrs: { "data-close": "", "aria-label": asText(modal.closeLabel, closeLabel) }
      }, icon("xmark"))
    ]),
    el("div", { className: "samai-sim-dialog-body" }, [
      modal.lead ? el("p", { className: "samai-sim-dialog-lead", text: fill(modal.lead, values) }) : null,
      ...renderBlocks(modal.blocks, values),
      asArray(modal.actions).length ? el("div", { className: "samai-sim-actions" },
        asArray(modal.actions).map((item) => renderAction(item, values, "samai-sim-button"))) : null
    ])
  ]);
}

// ─── Chat ────────────────────────────────────────────────────────────────────

function renderFile(file) {
  return el("span", { className: "samai-sim-file" }, [
    icon(file.icon, "paperclip"),
    el("span", { text: asText(file.label) })
  ]);
}

function renderMessage(message, values) {
  const from = message.from === "assistant" ? "assistant" : "user";
  const files = asArray(message.files);
  const cites = asArray(message.cites);
  const body = asArray(message.body);
  const points = asArray(message.points);
  const text = fill(message.text, values);
  if (!text && !files.length && !body.length && !points.length) {
    const lines = Math.max(1, Math.min(6, Number(message.lines) || 4));
    return el("div", { className: `samai-sim-message is-${from} is-pending` },
      Array.from({ length: lines }, () => el("i")));
  }
  return el("div", { className: `samai-sim-message is-${from}` }, [
    files.length ? el("span", { className: "samai-sim-message-files" }, files.map(renderFile)) : null,
    text ? el("p", { text }) : null,
    points.length ? el("ul", { className: "samai-sim-points" },
      points.map((point) => el("li", { text: fill(point, values) }))) : null,
    body.length ? renderDoc({ items: body }, values) : null,
    cites.length ? el("span", { className: "samai-sim-cites" }, cites.map((cite) => el("span", {
      className: "samai-sim-cite"
    }, [icon(cite.icon, "quote-right"), el("span", { text: fill(cite.label, values) })]))) : null
  ]);
}

function renderMenu(items, role) {
  return el("div", { className: "samai-sim-menu", attrs: { role } }, items);
}

function renderTools(p, chrome) {
  const tools = toolList(p);
  if (!chrome.tools || !tools.length) return null;
  return el("div", {
    className: "samai-sim-tools",
    attrs: { "data-part": "tools", "data-menu": "tools" }
  }, [
    el("button", {
      className: "samai-sim-plus",
      type: "button",
      attrs: { "aria-expanded": "false", "aria-label": asText(p.toolsLabel, TEXT.toolsLabel) }
    }, icon("plus")),
    renderMenu(tools.map((tool) => el("span", {
      className: "samai-sim-option",
      attrs: { role: "menuitem" }
    }, [icon(tool.icon, "wrench"), el("span", { text: asText(tool.label) })])), "menu")
  ]);
}

function renderPicker(picker) {
  const current = picker.options.find((option) => option.label === picker.value);
  return el("div", {
    className: "samai-sim-picker",
    attrs: { "data-part": picker.key, "data-menu": picker.key }
  }, [
    el("button", {
      className: "samai-sim-picker-button",
      type: "button",
      attrs: { "aria-expanded": "false", "aria-haspopup": "listbox", "aria-label": picker.label }
    }, [
      el("span", { className: "samai-sim-picker-value", text: current ? current.chip : picker.value }),
      icon("chevron-down")
    ]),
    renderMenu(picker.options.map((option) => el("span", {
      className: `samai-sim-option${option.label === picker.value ? " is-current" : ""}`,
      attrs: { role: "option", "data-value": option.label, "aria-selected": String(option.label === picker.value) }
    }, [icon("check"), el("span", { text: option.label })])), "listbox")
  ]);
}

function renderAccount(account) {
  if (!account || !account.name) return null;
  return el("span", {
    className: "samai-sim-account",
    attrs: { "data-part": "account" }
  }, [
    el("span", { className: "samai-sim-avatar" }, icon(account.icon, "user")),
    el("span", { className: "samai-sim-account-text" }, [
      el("b", { text: asText(account.name) }),
      account.detail ? el("small", { text: asText(account.detail) }) : null
    ]),
    icon("gear")
  ]);
}

/** The rail: anonymous thread bars, or the named destinations a lesson declares. */
function renderRail(p, chrome, threads, activeNav) {
  const nav = asArray(p.nav);
  if (!nav.length) {
    if (!chrome.threads) return [];
    return Array.from({ length: threads }, (_, index) => el("span", {
      className: `samai-sim-thread${index === 0 ? " is-current" : ""}`
    }));
  }
  return nav.map((item) => (item.heading ? el("span", {
    className: "samai-sim-nav-heading",
    text: asText(item.heading)
  }) : el("button", {
    className: `samai-sim-nav${item.key === activeNav ? " is-on" : ""}`,
    type: "button",
    attrs: {
      "data-part": asText(item.key),
      "data-nav": asText(item.key),
      "aria-pressed": String(item.key === activeNav)
    }
  }, [icon(item.icon, "message"), el("span", { text: asText(item.label) })])));
}

// ─── Journey ─────────────────────────────────────────────────────────────────
// The components working behind the window, as a track beside it. A step lights
// one node, and the narration for that step lands inside the node it is about,
// so the words and the lit component are never in two different places.

function renderJourney(journey) {
  return el("div", { className: "samai-sim-engine", attrs: { "data-part": "engine" } }, [
    el("p", { className: "samai-sim-engine-title" }, [
      icon(journey.icon, "gears"),
      el("span", { text: asText(journey.label, TEXT.engineLabel) })
    ]),
    el("div", { className: "samai-sim-view" }, el("ol", { className: "samai-sim-track" },
      asArray(journey.nodes).map((item) => el("li", {
        className: `samai-sim-node is-${validClassNames(item.tone || "app")}`,
        attrs: { "data-node": asText(item.key) }
      }, [
        el("span", { className: "samai-sim-pulse", attrs: { "aria-hidden": "true" } }),
        el("div", { className: "samai-sim-node-head" }, [
          el("span", { className: "samai-sim-node-icon" }, icon(item.icon, "circle-nodes")),
          el("div", { className: "samai-sim-node-text" }, [
            el("b", { text: asText(item.title) }),
            item.description ? el("span", { text: asText(item.description) }) : null
          ])
        ]),
        asArray(item.tags).length ? el("div", { className: "samai-sim-tags" },
          asArray(item.tags).map((tag) => el("span", {
            className: "samai-sim-tag",
            attrs: { "data-tag": asText(tag.key) }
          }, [icon(tag.icon, "circle-check"), el("span", { text: asText(tag.label) })]))) : null,
        el("div", { className: "samai-sim-say", attrs: { "aria-live": "polite" } }, [
          el("span", { className: "samai-sim-say-key", attrs: { "aria-hidden": "true" } }),
          el("p")
        ])
      ])))
    )
  ]);
}

// ─── Shell ───────────────────────────────────────────────────────────────────

function renderControls(steps, ordinals, p, captionId, journey) {
  const tour = p.tour || {};
  return [
    // With a journey the narration lives in the node the step is about, so a
    // caption below the window would only say the same thing a second time.
    journey ? null : el("div", { className: "samai-sim-caption" }, [
      el("span", { className: "samai-sim-number" }),
      el("p", {
        id: captionId,
        className: "samai-sim-text",
        attrs: { "aria-live": "polite", "aria-atomic": "true" }
      })
    ]),
    el("div", { className: "samai-sim-controls" }, [
      el("button", {
        className: "samai-sim-previous",
        type: "button"
      }, iconText("chevron-right", tour.previousLabel || DEFAULTS.previous)),
      el("div", {
        className: "samai-sim-dots",
        attrs: { role: "group", "aria-label": tour.stepsLabel || TEXT.stepsLabel }
      }, steps.map((step, index) => (ordinals[index] ? el("button", {
        className: "samai-sim-dot",
        type: "button",
        attrs: {
          "data-step": index,
          "aria-controls": journey ? null : captionId,
          "aria-label": [`${TEXT.step} ${formatDigits(ordinals[index])}`, asText(step.label)]
            .filter(Boolean).join(": ")
        }
      }) : null))),
      el("button", {
        className: "samai-sim-next",
        type: "button"
      }, textIcon(tour.nextLabel || DEFAULTS.next, "chevron-left"))
    ]),
    el("ol", { className: "samai-sim-print" }, steps.map((step) => el("li", {}, [
      step.label ? el("strong", { text: step.label }) : null,
      el("p", { text: step.text })
    ])))
  ];
}

function renderAppSimulator(node) {
  const p = opts(node);
  const id = p.id || nextId("app-simulator");
  const chrome = flags(p);
  const agents = chrome.agents ? agentList(p) : [];
  const pickers = chrome.pickers ? pickerList(p) : [];
  const messages = asArray(p.messages);
  const emptyText = p.emptyText === undefined ? TEXT.emptyText : asText(p.emptyText);
  const steps = asArray(p.tour && p.tour.steps);
  const guided = steps.length > 0;
  const journey = isObject(p.journey) ? p.journey : null;
  const active = asText(p.activeAgent, agents.length ? agents[0].key : "");
  const nav = asArray(p.nav).filter((item) => item.key);
  const activeNav = asText(p.activeNav, nav.length ? asText(nav[0].key) : "");
  const threads = Math.max(0, Math.min(8, p.threads === undefined ? 4 : Number(p.threads) || 0));
  let counted = 0;
  const ordinals = steps.map((step) => (step.target || journey ? (counted += 1) : 0));

  const window_ = el("div", {
    className: "samai-sim-window",
    attrs: { "data-part": "app", inert: guided || null, "aria-hidden": guided || null }
  }, [
    chrome.titleBar ? el("header", { className: "samai-sim-top" }, [
      el("div", { className: "samai-sim-brand" }, [
        chrome.dots ? el("span", { className: "samai-sim-dots-window" }, [el("i"), el("i"), el("i")]) : null,
        chrome.appName ? el("span", {
          className: "samai-sim-name",
          text: asText(p.appName, TEXT.appName)
        }) : null
      ]),
      agents.length ? el("div", {
        className: "samai-sim-agents",
        attrs: { "data-part": "agent", role: "group", "aria-label": asText(p.agentsLabel, TEXT.agentsLabel) }
      }, agents.map((agent) => el("button", {
        className: `samai-sim-agent${agent.key === active ? " is-on" : ""}`,
        type: "button",
        attrs: { "data-agent": agent.key, "aria-pressed": String(agent.key === active) }
      }, el("span", { text: agent.label })))) : null,
      el("span", { className: "samai-sim-top-end", attrs: { "aria-hidden": "true" } }, [
        chrome.screenTitle ? el("span", { className: "samai-sim-screen-name" }) : null,
        chrome.overflow ? el("span", { className: "samai-sim-overflow" }, icon("ellipsis")) : null
      ])
    ]) : null,
    el("div", { className: `samai-sim-body${chrome.sidebar ? "" : " is-bare"}` }, [
      chrome.sidebar ? el("aside", {
        className: `samai-sim-side${nav.length ? " has-nav" : ""}`,
        attrs: { "data-part": "threads", "aria-label": asText(p.threadsLabel, TEXT.threadsLabel) }
      }, [
        chrome.newChat ? el("span", { className: "samai-sim-new" },
          [icon("plus"), el("span", { text: asText(p.newChat, TEXT.newChat) })]) : null,
        ...renderRail(p, chrome, threads, activeNav),
        chrome.account ? renderAccount(p.account === undefined ? DEFAULT_ACCOUNT : p.account) : null
      ]) : null,
      el("div", { className: "samai-sim-main" }, [
        el("div", { className: "samai-sim-chat", attrs: { "data-part": "chat" } }, [
          el("div", { className: "samai-sim-messages", attrs: { "data-part": "messages" } }, [
            emptyText ? el("p", {
              className: "samai-sim-empty",
              text: emptyText,
              hidden: messages.length > 0
            }) : null,
            ...messages.map((message) => renderMessage(message, fieldDefaults(p))),
            // What the window is doing, and that it has not finished doing it,
            // on one line. The dots carry on alone when a step reports no words.
            // It belongs in the transcript, after the message it is answering —
            // outside it the chat's spacing would strand it mid-panel.
            el("div", { className: "samai-sim-working", attrs: { "data-part": "status" }, hidden: true }, [
              el("span", { className: "samai-sim-working-icon" }),
              el("span", { className: "samai-sim-working-text" }),
              el("span", { className: "samai-sim-working-dots", attrs: { "aria-hidden": "true" } },
                [el("i"), el("i"), el("i")])
            ])
          ]),
          chrome.composer ? el("div", { className: "samai-sim-composer", attrs: { "data-part": "composer" } }, [
            el("div", { className: "samai-sim-files", hidden: true }),
            el("div", { className: "samai-sim-row" }, [
              renderTools(p, chrome),
              el("span", { className: "samai-sim-field", attrs: { "data-part": "field" } }, [
                el("span", { className: "samai-sim-placeholder", text: asText(p.placeholder, TEXT.placeholder) }),
                el("span", { className: "samai-sim-typed" }),
                el("i", { className: "samai-sim-caret", attrs: { "aria-hidden": "true" } })
              ]),
              pickers.length ? el("div", { className: "samai-sim-pickers" }, pickers.map(renderPicker)) : null,
              chrome.send ? el("button", {
                className: "samai-sim-send",
                type: "button",
                attrs: { "data-part": "send", "aria-label": asText(p.sendLabel, TEXT.sendLabel) }
              }, icon("paper-plane")) : null
            ])
          ]) : null,
          el("p", { className: "samai-sim-hint", hidden: true })
        ]),
        el("div", { className: "samai-sim-screen", hidden: true, attrs: { "data-part": "screen" } })
      ]),
      el("div", { className: "samai-sim-overlay", hidden: true })
    ])
  ]);

  const captionId = `${id}-caption`;
  const stage = el("div", { className: "samai-sim-stage" }, [
    window_,
    guided ? el("div", { className: "samai-sim-spotlight", attrs: { "aria-hidden": "true" } }) : null,
    guided ? el("div", { className: "samai-sim-callout", attrs: { "aria-hidden": "true" } }) : null
  ]);

  // With a journey the stage keeps a narration slot of its own: on a step that
  // shows the window full width the track is not on screen to carry the words.
  const body = journey ? el("div", { className: "samai-sim-split is-full" }, [
    el("div", { className: "samai-sim-screen-pane" }, [
      stage,
      el("div", { className: "samai-sim-say samai-sim-full-say", attrs: { "aria-live": "polite" } }, [
        el("span", { className: "samai-sim-say-key", attrs: { "aria-hidden": "true" } }),
        el("p")
      ])
    ]),
    renderJourney(journey)
  ]) : stage;

  const shell = el("div", {
    id,
    className: `samai-simulator${guided ? " is-guided" : ""}${journey ? " has-journey" : ""}`,
    attrs: p.ariaLabel ? { role: "group", "aria-label": asText(p.ariaLabel) } : null
  }, [
    body,
    ...(guided ? renderControls(steps, ordinals, p, captionId, journey) : []),
    p.note ? el("p", { className: "samai-sim-note", text: p.note }) : null
  ]);

  state.set(shell, {
    p,
    chrome,
    steps,
    ordinals,
    pickers,
    messages,
    journey,
    screens: Object.fromEntries(screenEntries(p)),
    modals: Object.fromEntries(modalEntries(p)),
    values: fieldDefaults(p),
    activeAgent: active,
    activeNav,
    activeScreen: asText(p.activeScreen, CHAT),
    response: isObject(p.response) ? p.response : { from: "assistant", lines: 4 }
  });
  return shell;
}

// ─── Behaviour ───────────────────────────────────────────────────────────────

function setMenu(holder, open) {
  holder.classList.toggle("is-open", open);
  const button = holder.querySelector("button");
  if (button) button.setAttribute("aria-expanded", String(open));
}

/** The window as steps 0..index leave it. Derived, never accumulated. */
function stateAt(config, index) {
  const result = {
    agent: config.activeAgent,
    nav: config.activeNav,
    screen: config.activeScreen,
    modal: "",
    hint: "",
    picks: Object.create(null),
    prompt: "",
    files: [],
    messages: config.messages.slice()
  };
  config.pickers.forEach((picker) => { result.picks[picker.key] = picker.value; });
  for (let i = 0; i <= index; i += 1) {
    const step = config.steps[i];
    if (!step) continue;
    // Replayed with everything else, so jumping to a dot lands on the same field
    // values as walking there. A learner's own edit survives until a later step
    // names that field.
    if (step.set) Object.assign(config.values, step.set);
    if (step.agent) result.agent = step.agent;
    if (step.nav) result.nav = asText(step.nav);
    if (step.screen) result.screen = asText(step.screen);
    // A modal belongs to the step that opens it: a dialog that outlived its step
    // would sit over every screen after it.
    result.modal = step.modal ? asText(step.modal) : "";
    result.hint = step.hint ? asText(step.hint) : "";
    if (step.reset) {
      result.messages = config.messages.slice();
      result.prompt = "";
      result.files = [];
    }
    if (step.prompt !== undefined) result.prompt = fill(step.prompt, config.values);
    if (step.attach) result.files = result.files.concat([step.attach]);
    if (step.pick) {
      Object.entries(step.pick).forEach(([key, value]) => { result.picks[key] = asText(value); });
    }
    if (step.send) {
      result.messages = result.messages.concat([{ from: "user", text: result.prompt, files: result.files }]);
      result.prompt = "";
      result.files = [];
    }
    if (step.respond) {
      result.messages = result.messages.concat([
        step.respond === true ? config.response : Object.assign({ from: "assistant" }, step.respond)
      ]);
    }
  }
  return result;
}

function initializeAppSimulator(shell) {
  const config = state.get(shell);
  const holders = Array.from(shell.querySelectorAll("[data-menu]"));
  const agents = Array.from(shell.querySelectorAll(".samai-sim-agent"));
  const navItems = Array.from(shell.querySelectorAll(".samai-sim-nav"));
  const chat = shell.querySelector(".samai-sim-chat");
  const screen = shell.querySelector(".samai-sim-screen");
  const overlay = shell.querySelector(".samai-sim-overlay");
  const screenName = shell.querySelector(".samai-sim-screen-name");
  const closeLabel = asText(config.p.closeLabel, TEXT.close);
  let uploadTimer = null;

  const openMenu = (key) => holders.forEach((holder) => setMenu(holder, holder.dataset.menu === key));

  const selectAgent = (key) => agents.forEach((button) => {
    const on = button.dataset.agent === key;
    button.classList.toggle("is-on", on);
    button.setAttribute("aria-pressed", String(on));
  });

  const selectNav = (key) => navItems.forEach((button) => {
    const on = button.dataset.nav === key;
    button.classList.toggle("is-on", on);
    button.setAttribute("aria-pressed", String(on));
  });

  // The upload queue settles a beat after it is drawn, and only then does the
  // action waiting on it come alive. Re-rendering cancels a pending settle, so a
  // learner stepping away does not get a callback into a screen that is gone.
  const settleUploads = () => {
    window.clearTimeout(uploadTimer);
    const queue = screen.querySelector(".samai-sim-upload") || overlay.querySelector(".samai-sim-upload");
    if (!queue) return;
    const delay = Number(queue.dataset.delay) || 1600;
    uploadTimer = window.setTimeout(() => {
      queue.classList.add("is-done");
      queue.querySelectorAll(".samai-sim-upload-state").forEach((cell) => {
        cell.textContent = cell.dataset.done || cell.textContent;
      });
      const action = queue.querySelector(".samai-sim-button");
      if (action) action.disabled = false;
    }, delay);
  };

  const showScreen = (key, values) => {
    const wanted = key && key !== CHAT ? key : null;
    const definition = wanted ? config.screens[wanted] : null;
    chat.hidden = Boolean(definition);
    screen.hidden = !definition;
    screen.className = `samai-sim-screen${definition && isObject(definition.menu) ? " has-menu" : ""}`;
    screen.replaceChildren(...(definition ? renderScreen(definition, values) : []));
    if (screenName) {
      screenName.textContent = definition
        ? fill(definition.title, values)
        : asText(config.p.chatTitle, asText(config.p.newChat, TEXT.newChat));
    }
  };

  const showModal = (key, values) => {
    const definition = key ? config.modals[key] : null;
    overlay.hidden = !definition;
    overlay.replaceChildren(...(definition ? [renderModal(definition, values, closeLabel)] : []));
  };

  const selectOption = (holder, option) => {
    const picker = config.pickers.find((item) => item.key === holder.dataset.menu);
    const value = holder.querySelector(".samai-sim-picker-value");
    const chosen = picker && picker.options.find((item) => item.label === option.dataset.value);
    if (value && chosen) value.textContent = chosen.chip;
    holder.querySelectorAll(".samai-sim-option").forEach((item) => {
      const current = item === option;
      item.classList.toggle("is-current", current);
      item.setAttribute("aria-selected", String(current));
    });
  };

  pushCleanup(() => window.clearTimeout(uploadTimer));

  // Field controls write straight into the values and never redraw the surface
  // they sit on, so the caret keeps its place; `{field}` elsewhere catches up
  // when the surface is next drawn.
  listen(shell, "input", (event) => {
    const bound = event.target.closest("[data-bind]");
    if (bound) config.values[bound.dataset.bind] = bound.value;
  });

  if (!config.steps.length) {
    // Live window: the learner opens the menus, switches the agent, moves
    // between rail destinations, and works whatever the screens put in front.
    let liveScreen = config.activeScreen;
    let liveModal = "";
    const redraw = () => {
      showScreen(liveScreen, config.values);
      showModal(liveModal, config.values);
      settleUploads();
    };
    holders.forEach((holder) => {
      listen(holder.querySelector("button"), "click", () => {
        openMenu(holder.classList.contains("is-open") ? null : holder.dataset.menu);
      });
      holder.querySelectorAll(".samai-sim-option").forEach((option) => listen(option, "click", () => {
        if (option.getAttribute("role") === "option") selectOption(holder, option);
        openMenu(null);
      }));
    });
    agents.forEach((button) => listen(button, "click", () => selectAgent(button.dataset.agent)));
    navItems.forEach((button) => listen(button, "click", () => {
      selectNav(button.dataset.nav);
      liveScreen = config.screens[button.dataset.nav] ? button.dataset.nav : CHAT;
      liveModal = "";
      redraw();
    }));
    listen(shell, "click", (event) => {
      const choice = event.target.closest("[data-choice]");
      if (choice) {
        config.values[choice.dataset.choice] = choice.dataset.value;
        redraw();
        return;
      }
      const action = event.target.closest(
        ".samai-sim-button, .samai-sim-line-action, .samai-sim-screen-action, .samai-sim-dialog-close"
      );
      if (!action || action.disabled) return;
      if (action.dataset.set) Object.assign(config.values, JSON.parse(action.dataset.set));
      if (action.dataset.nav) { selectNav(action.dataset.nav); liveScreen = action.dataset.nav; }
      if (action.dataset.screen) liveScreen = action.dataset.screen;
      if (action.dataset.close !== undefined) liveModal = "";
      if (action.dataset.modal) liveModal = action.dataset.modal;
      redraw();
    });
    listen(document, "click", (event) => {
      if (!shell.contains(event.target)) openMenu(null);
    });
    listen(shell, "keydown", (event) => {
      if (event.key === "Escape") openMenu(null);
    });
    redraw();
    return;
  }

  const stage = shell.querySelector(".samai-sim-stage");
  const split = shell.querySelector(".samai-sim-split");
  const spotlight = shell.querySelector(".samai-sim-spotlight");
  const callout = shell.querySelector(".samai-sim-callout");
  const number = shell.querySelector(".samai-sim-number");
  const caption = shell.querySelector(".samai-sim-text");
  const previous = shell.querySelector(".samai-sim-previous");
  const next = shell.querySelector(".samai-sim-next");
  const dots = Array.from(shell.querySelectorAll(".samai-sim-dot"));
  const list = shell.querySelector(".samai-sim-messages");
  const empty = shell.querySelector(".samai-sim-empty");
  const files = shell.querySelector(".samai-sim-files");
  const field = shell.querySelector(".samai-sim-field");
  const placeholder = shell.querySelector(".samai-sim-placeholder");
  const typed = shell.querySelector(".samai-sim-typed");
  const hint = shell.querySelector(".samai-sim-hint");
  const working = shell.querySelector(".samai-sim-working");
  const workingIcon = shell.querySelector(".samai-sim-working-icon");
  const workingText = shell.querySelector(".samai-sim-working-text");
  const fullSay = shell.querySelector(".samai-sim-full-say");
  const view = shell.querySelector(".samai-sim-view");
  const nodeEls = Array.from(shell.querySelectorAll(".samai-sim-node"));
  const nodeKeys = nodeEls.map((nodeEl) => nodeEl.dataset.node);
  const tagEls = Array.from(shell.querySelectorAll(".samai-sim-tag"));
  const tour = config.p.tour || {};
  const hotspots = tour.hotspots !== false;
  const still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let shown = null;
  let current = 0;
  let placeTimer = null;
  let typeTimer = null;
  let resizeTimer = null;

  function write(text) {
    window.clearInterval(typeTimer);
    typeTimer = null;
    placeholder.hidden = Boolean(text);
    field.classList.toggle("is-typing", Boolean(text));
    if (!text || still) {
      typed.textContent = text;
      return;
    }
    // Typed a character at a time, so the learner watches the prompt appear.
    typed.textContent = "";
    let count = 0;
    const pace = Math.max(16, Math.min(45, Math.round(900 / text.length)));
    typeTimer = window.setInterval(() => {
      count += 1;
      typed.textContent = text.slice(0, count);
      if (count >= text.length) {
        window.clearInterval(typeTimer);
        typeTimer = null;
      }
    }, pace);
  }

  function apply(next_, step) {
    selectAgent(next_.agent);
    selectNav(next_.nav);
    showScreen(next_.screen, config.values);
    showModal(next_.modal, config.values);
    settleUploads();
    config.pickers.forEach((picker) => {
      const holder = shell.querySelector(`[data-menu="${picker.key}"]`);
      const option = holder && holder.querySelector(`.samai-sim-option[data-value="${CSS.escape(next_.picks[picker.key])}"]`);
      if (option) selectOption(holder, option);
    });
    if (field && (!shown || shown.prompt !== next_.prompt)) write(next_.prompt);
    if (files) {
      files.replaceChildren(...next_.files.map(renderFile));
      files.hidden = next_.files.length === 0;
    }
    const rendered = next_.messages.map((message) => renderMessage(message, config.values));
    if (empty) empty.hidden = next_.messages.length > 0;
    // The working line is a standing node the transcript is rebuilt around, so
    // it has to be handed back after the messages it follows.
    list.replaceChildren(...[empty, ...rendered, working].filter(Boolean));
    if (hint) {
      hint.textContent = next_.hint;
      hint.hidden = !next_.hint;
    }
    const status = isObject(step.status) ? step.status : null;
    working.hidden = !status && step.status !== true;
    working.className = `samai-sim-working${status && status.tone ? ` is-${validClassNames(status.tone)}` : ""}`;
    workingIcon.replaceChildren(status && status.icon ? icon(status.icon) : "");
    workingText.textContent = status ? asText(status.text) : "";
    shown = next_;
  }

  function applyJourney(step) {
    if (!split) return;
    // The path draws itself: every node up to the active one stays lit, and the
    // connectors behind it with them. A full step has reached nothing yet.
    const reached = step.full ? -1 : nodeKeys.indexOf(asText(step.at));
    const activeTags = asArray(step.activeTags).map(asText);
    split.classList.toggle("is-full", Boolean(step.full));
    fullSay.classList.toggle("is-on", Boolean(step.full));
    fullSay.querySelector(".samai-sim-say-key").textContent = step.full ? formatDigits(current + 1) : "";
    fullSay.querySelector("p").textContent = step.full ? asText(step.text) : "";
    nodeEls.forEach((nodeEl, position) => {
      const isActive = nodeKeys[position] === asText(step.at) && !step.full;
      nodeEl.classList.toggle("is-on", position <= reached);
      nodeEl.classList.toggle("is-active", isActive);
      nodeEl.classList.toggle("is-flow-on", position < reached);
      const say = nodeEl.querySelector(".samai-sim-say");
      say.classList.toggle("is-on", isActive);
      say.querySelector(".samai-sim-say-key").textContent = isActive ? formatDigits(current + 1) : "";
      say.querySelector("p").textContent = isActive ? asText(step.text) : "";
    });
    tagEls.forEach((tagEl) => tagEl.classList.toggle("is-on", activeTags.includes(tagEl.dataset.tag)));
    const activeNode = nodeEls.find((nodeEl) => nodeEl.classList.contains("is-active"));
    if (activeNode && view) {
      view.scrollTo({
        top: activeNode.offsetTop - (view.clientHeight - activeNode.offsetHeight) / 2,
        behavior: still ? "auto" : "smooth"
      });
    }
  }

  function place(step) {
    const node = shell.querySelector(`[data-part="${step.target}"]`);
    if (!node || !node.getClientRects().length) {
      spotlight.classList.remove("is-on");
      callout.classList.remove("is-on");
      return;
    }
    const base = stage.getBoundingClientRect();
    const rect = node.getBoundingClientRect();
    let { top, left, right, bottom } = rect;
    const menu = node.classList.contains("is-open") ? node.querySelector(".samai-sim-menu") : null;
    if (menu) {
      const area = menu.getBoundingClientRect();
      top = Math.min(top, area.top);
      left = Math.min(left, area.left);
      right = Math.max(right, area.right);
      bottom = Math.max(bottom, area.bottom);
    }
    const y = top - base.top - 7;
    const x = left - base.left - 7;
    const width = right - left + 14;
    const height = bottom - top + 14;
    // Measured pixels, so the overlay is placed physically; `translateX(-100%)`
    // on the callout keeps its label anchored to the reading edge in RTL.
    spotlight.style.top = `${y}px`;
    spotlight.style.left = `${x}px`;
    spotlight.style.width = `${width}px`;
    spotlight.style.height = `${height}px`;
    spotlight.classList.add("is-on");
    callout.textContent = step.label || "";
    callout.classList.toggle("is-on", Boolean(step.label));
    // Above the spotlight when the stage has room for it, otherwise just inside
    // it — the stage clips its own overflow, so neither can escape.
    const above = y - callout.offsetHeight - 5;
    callout.style.top = `${above >= 0 ? above : y + 6}px`;
    callout.style.left = `${x + width}px`;
  }

  function show(index) {
    current = index < 0 || index > config.steps.length - 1 ? 0 : index;
    const step = config.steps[current];
    const last = current === config.steps.length - 1;
    openMenu(step.open || null);
    apply(stateAt(config, current), step);
    applyJourney(step);
    if (number) number.textContent = config.ordinals[current] ? formatDigits(config.ordinals[current]) : "؟";
    if (caption) caption.textContent = asText(step.text);
    dots.forEach((dot) => dot.classList.toggle("is-on", Number(dot.dataset.step) === current));
    previous.disabled = current === 0;
    next.replaceChildren(textIcon(
      last ? (tour.restartLabel || DEFAULTS.restart) : (tour.nextLabel || DEFAULTS.next),
      last ? "rotate-right" : "chevron-left"
    ));
    if (!step.target) {
      spotlight.classList.remove("is-on");
      callout.classList.remove("is-on");
      return;
    }
    // A menu opens and the window re-lays out on this same tick; measure once
    // that has settled. A timer rather than rAF, so placement still happens in a
    // background tab.
    window.clearTimeout(placeTimer);
    placeTimer = window.setTimeout(() => place(step), 60);
  }

  const advance = () => show(current === config.steps.length - 1 ? 0 : current + 1);

  listen(previous, "click", () => show(current - 1));
  listen(next, "click", advance);
  dots.forEach((dot) => listen(dot, "click", () => show(Number(dot.dataset.step))));
  // Pressing the lit part is the same as pressing next, which is how a learner
  // expects an interface to behave. The ring takes the press rather than the
  // control under it: the window is inert while a tour runs, and an inert
  // subtree is not hit-tested at all, so nothing inside it could receive one.
  if (hotspots) {
    shell.classList.add("has-hotspots");
    listen(spotlight, "click", advance);
  }
  listen(window, "resize", () => {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(() => {
      if (config.steps[current].target) place(config.steps[current]);
    }, 120);
  });
  pushCleanup(() => {
    window.clearTimeout(placeTimer);
    window.clearTimeout(resizeTimer);
    window.clearInterval(typeTimer);
  });
  show(0);
}

register("appSimulator", {
  render: renderAppSimulator,
  init: { selector: ".samai-simulator", setup: initializeAppSimulator },
  meta: {
    doc: "Mock AI application window — chrome toggled by flag, rail destinations opening screens built from blocks, dialogs, learner-editable fields — toured part by part, composing a request as it goes, shown beside the components working behind it, or left live.",
    interactive: true,
    leaf: true,
    opts: {
      chrome: "{titleBar,dots,appName,agents,screenTitle,overflow,sidebar,newChat,threads,account,composer,tools,pickers,send}?",
      appName: "string?",
      ariaLabel: "string?",
      agents: "{key,label}[]?",
      messages: "{from,text,points,body,lines,files,cites}[]?",
      emptyText: "string?",
      placeholder: "string?",
      tools: "{icon,label}[]?",
      pickers: "{key,label,options,value}[]?",
      nav: "{key,icon,label}|{heading}[]?",
      screens: "{[key]:{title,icon,lead,menu,action,blocks}}?",
      modals: "{[key]:{title,lead,blocks,actions}}?",
      fields: "{[key]:string}?",
      activeNav: "string?",
      activeScreen: "string?",
      account: "{name,detail,icon}?",
      response: "{lines}|{text}?",
      journey: "{label,nodes:{key,tone,icon,title,description,tags}[]}?",
      tour: "{steps:{target,label,text,open,agent,nav,screen,modal,hint,set,status,at,activeTags,full,reset,prompt,attach,pick,send,respond}[],hotspots}?",
      note: "string?"
    },
    check(node, v) {
      const p = v.p;
      const agents = agentList(p);
      const keys = new Set(agents.map((agent) => agent.key));
      if (p.chrome !== undefined && !isObject(p.chrome)) v.fail("appSimulator chrome must be an object of flags.");
      Object.keys(isObject(p.chrome) ? p.chrome : {}).forEach((key) => {
        if (!(key in CHROME)) v.fail(`appSimulator chrome has no flag "${key}".`);
      });
      if (agents.length && (agents.length < 2 || keys.size !== agents.length)) {
        v.fail("appSimulator needs at least two agents with unique keys, or an empty list.");
      }
      if (p.activeAgent !== undefined && !keys.has(p.activeAgent)) {
        v.fail("appSimulator activeAgent must match an agent key.");
      }
      const pickers = pickerList(p);
      if (pickers.some((picker) => !NAME.test(picker.key) || PARTS.includes(picker.key))) {
        v.fail("appSimulator picker keys must be unique semantic names outside the built-in parts.");
      }
      pickers.forEach((picker) => {
        if (!picker.options.some((option) => option.label === picker.value)) {
          v.fail(`appSimulator picker "${picker.key}" has a value that is not one of its options.`);
        }
      });

      // Every named part — rail item, block, picker, journey node — shares one
      // namespace with the built-ins, because a tour target is one string.
      const named = partKeys(p).slice(PARTS.length);
      const seen = new Set(PARTS);
      named.forEach((key) => {
        if (!NAME.test(key)) v.fail(`appSimulator part "${key}" must be a lowercase semantic name.`);
        if (seen.has(key)) v.fail(`appSimulator part "${key}" is declared twice.`);
        seen.add(key);
      });

      const fields = new Set(Object.keys(isObject(p.fields) ? p.fields : {}));
      const checkBlocks = (blocks, at) => v.asArray(blocks).forEach((block, index) => {
        const where = `${at} block ${index + 1}`;
        if (!isObject(block)) return v.fail(`${where} must be an object.`);
        if (!BLOCK_TYPES.includes(v.asText(block.type))) {
          return v.fail(`${where} has an unknown type "${v.asText(block.type)}".`);
        }
        if (block.type === "field" || block.type === "choices") {
          if (!fields.has(v.asText(block.bind))) {
            v.fail(`${where} binds to "${v.asText(block.bind)}", which is not a declared field.`);
          }
          if (block.type === "field" && block.control !== undefined && !CONTROLS.includes(block.control)) {
            v.fail(`${where} has an unknown control "${block.control}".`);
          }
        }
        checkBlocks(block.blocks, where);
        v.asArray(block.items).forEach((item, position) => {
          if (isObject(item)) checkBlocks(item.blocks, `${where} item ${position + 1}`);
        });
        return undefined;
      });
      const screens = new Set(screenEntries(p).map(([key]) => key));
      const modals = new Set(modalEntries(p).map(([key]) => key));
      screenEntries(p).forEach(([key, screen]) => checkBlocks(screen.blocks, `appSimulator screen "${key}"`));
      modalEntries(p).forEach(([key, modal]) => checkBlocks(modal.blocks, `appSimulator modal "${key}"`));

      const navKeys = new Set(v.asArray(p.nav).map((item) => v.asText(item.key)).filter(Boolean));
      v.asArray(p.nav).forEach((item, index) => {
        if (item.heading === undefined && !item.key) v.fail(`appSimulator nav item ${index + 1} needs a key or a heading.`);
      });
      if (p.activeNav !== undefined && !navKeys.has(p.activeNav)) {
        v.fail("appSimulator activeNav must match a nav item key.");
      }
      if (p.activeScreen !== undefined && p.activeScreen !== CHAT && !screens.has(p.activeScreen)) {
        v.fail(`appSimulator activeScreen "${p.activeScreen}" is not a declared screen.`);
      }
      const nodes = new Set(v.asArray(p.journey && p.journey.nodes).map((item) => v.asText(item.key)));
      if (p.journey !== undefined && !nodes.size) v.fail("appSimulator journey needs at least one node.");

      const opens = new Set(menuKeys(p));
      v.asArray(p.tour && p.tour.steps).forEach((step, index) => {
        const at = `appSimulator tour step ${index + 1}`;
        if (!v.asText(step.text).trim()) v.fail(`${at} needs text.`);
        if (step.target !== undefined && !seen.has(step.target)) v.fail(`${at} targets an unknown part "${step.target}".`);
        if (step.open !== undefined && !opens.has(step.open)) v.fail(`${at} opens an unknown menu "${step.open}".`);
        if (step.agent !== undefined && !keys.has(step.agent)) v.fail(`${at} selects an unknown agent "${step.agent}".`);
        if (step.nav !== undefined && !navKeys.has(step.nav)) v.fail(`${at} selects an unknown rail item "${step.nav}".`);
        if (step.screen !== undefined && step.screen !== CHAT && !screens.has(step.screen)) {
          v.fail(`${at} opens an unknown screen "${step.screen}".`);
        }
        if (step.modal !== undefined && !modals.has(v.asText(step.modal))) {
          v.fail(`${at} opens an unknown dialog "${step.modal}".`);
        }
        if (step.at !== undefined && !nodes.has(v.asText(step.at))) {
          v.fail(`${at} lights an unknown journey node "${step.at}".`);
        }
        if (step.attach !== undefined && !v.asText(step.attach.label).trim()) v.fail(`${at} attaches a file with no label.`);
        Object.keys(step.set || {}).forEach((key) => {
          if (!fields.has(key)) v.fail(`${at} sets "${key}", which is not a declared field.`);
        });
        Object.entries(step.pick || {}).forEach(([key, value]) => {
          const picker = pickers.find((item) => item.key === key);
          if (!picker) v.fail(`${at} picks for an unknown picker "${key}".`);
          else if (!picker.options.some((option) => option.label === value)) {
            v.fail(`${at} picks "${value}", which is not an option of "${key}".`);
          }
        });
      });
    }
  }
});

    </script>
    <script type="samai/module" data-id="components/assessment.js">
// Scored decision surfaces: staged application and end-of-lesson quiz.

import { DEFAULTS } from "../core/contract.js";
import { el, findChildren, icon, iconText, interpolate, nest, opts, textIcon } from "../core/dom.js";
import { formatDigits } from "../core/digits.js";
import { listen, state } from "../core/lifecycle.js";
import { register } from "../core/render.js";

function decisionData(node, stepName) {
  return nest(node)
    .filter((child) => child && child.name === stepName)
    .map((step) => ({
      opts: opts(step),
      choices: findChildren(step, "choice").map((choice) => opts(choice))
    }));
}

function renderApplication(node) {
  const p = opts(node);
  const steps = decisionData(node, "applicationStep");
  const completion = findChildren(node, "completion")[0];
  const shell = el("div", { id: p.id, className: "samai-decision samai-application" }, [
    p.instructions ? el("p", { className: "samai-activity-instructions", text: p.instructions }) : null,
    el("div", { className: "samai-decision-progress" }, [
      el("span", { className: "samai-decision-count", attrs: { "aria-live": "polite" } }),
      el("div", {
        className: "samai-decision-meter",
        attrs: { role: "progressbar", "aria-valuemin": "0", "aria-valuemax": steps.length, "aria-valuenow": "0" }
      }, el("i"))
    ]),
    el("div", { className: "samai-decision-stage", attrs: { tabindex: "-1", "aria-live": "polite" } }),
    el("div", { className: "samai-decision-complete", hidden: true, attrs: { tabindex: "-1" } }, [
      el("span", { className: "samai-complete-icon" }, icon(opts(completion).icon, "circle-check")),
      el("h3", { text: opts(completion).title || p.completionText || DEFAULTS.complete }),
      opts(completion).text ? el("p", { text: opts(completion).text }) : null,
      el("button", { className: "samai-decision-restart samai-restart", type: "button" }, (
        iconText("rotate-right", opts(completion).restartLabel || p.restartLabel || DEFAULTS.restart)
      ))
    ])
  ]);
  state.set(shell, { p, steps, mode: "application" });
  return shell;
}

function renderQuiz(node) {
  const p = opts(node);
  const steps = decisionData(node, "question");
  const shell = renderApplication({
    name: "application",
    opts: Object.assign({}, p, { completionText: p.completionText || "اكتمل الاختبار" }),
    nest: [
      ...steps.map((step) => ({
        name: "applicationStep",
        opts: {
          title: step.opts.tag,
          prompt: step.opts.prompt,
          context: step.opts.context,
          correctFeedback: step.opts.feedback
        },
        nest: step.choices.map((choice) => ({ name: "choice", opts: choice }))
      })),
      {
        name: "completion",
        opts: {
          icon: p.completeIcon || "award",
          title: p.completionText || "اكتمل الاختبار",
          restartLabel: p.restartLabel || "إعادة الاختبار"
        }
      }
    ]
  });
  shell.classList.remove("samai-application");
  shell.classList.add("samai-quiz");
  const instructions = shell.querySelector(".samai-activity-instructions");
  const quizHead = el("header", { className: "samai-quiz-head" }, [
    el("span", { className: "samai-quiz-head-icon" }, icon(p.icon, "list-check")),
    el("h3", { text: p.title || "اختبر فهمك" })
  ]);
  if (instructions) {
    shell.setAttribute("aria-label", instructions.textContent || p.title || "اختبر فهمك");
    instructions.replaceWith(quizHead);
  } else {
    shell.prepend(quizHead);
  }
  const config = state.get(shell);
  config.mode = "quiz";
  config.p = p;
  state.set(shell, config);
  return shell;
}

function initializeDecision(shell) {
  const config = state.get(shell);
  const stage = shell.querySelector(".samai-decision-stage");
  const complete = shell.querySelector(".samai-decision-complete");
  const count = shell.querySelector(".samai-decision-count");
  const meter = shell.querySelector(".samai-decision-meter");
  const fill = meter.querySelector("i");
  const restart = shell.querySelector(".samai-decision-restart");
  let index = 0;
  let answers = Array(config.steps.length).fill(null);

  function score() {
    return answers.reduce((total, answer, stepIndex) => (
      answer !== null && config.steps[stepIndex].choices[answer]?.correct === true ? total + 1 : total
    ), 0);
  }

  function finish(moveFocus) {
    stage.hidden = true;
    complete.hidden = false;
    if (config.mode === "quiz") {
      const title = complete.querySelector("h3");
      title.textContent = interpolate(config.p.scoreTemplate || "النتيجة: {score} من {total}", {
        score: formatDigits(score()),
        total: formatDigits(config.steps.length)
      });
    }
    if (moveFocus) complete.focus();
  }

  function render(moveFocus) {
    if (index >= config.steps.length) {
      finish(moveFocus);
      return;
    }
    const step = config.steps[index];
    const percent = config.steps.length ? ((config.mode === "quiz" ? index + 1 : index) / config.steps.length) * 100 : 0;
    count.textContent = interpolate(config.p.countTemplate || "الخطوة {current} من {total}", {
      current: formatDigits(index + 1),
      total: formatDigits(config.steps.length)
    });
    fill.style.width = `${percent}%`;
    meter.setAttribute("aria-valuenow", String(index));
    const feedback = el("div", { className: "samai-decision-feedback", attrs: { role: "status" } });
    const next = el("button", { className: "samai-decision-next", type: "button", hidden: true }, (
      textIcon(index === config.steps.length - 1 ? (config.p.finishLabel || "إتمام النشاط") : (config.p.nextLabel || DEFAULTS.next), "arrow-left")
    ));
    const previous = config.mode === "quiz" ? el("button", {
      className: "samai-decision-previous",
      type: "button",
      attrs: { disabled: index === 0 }
    }, iconText("arrow-right", config.p.previousLabel || DEFAULTS.previous)) : null;
    const markers = ["أ", "ب", "ج", "د"];
    const options = el("div", { className: "samai-decision-options" }, step.choices.map((choice, choiceIndex) => (
      el("button", {
        className: "samai-decision-option",
        type: "button",
        attrs: { "data-choice": choiceIndex }
      }, [
        el("span", { className: "samai-choice-marker", text: config.mode === "quiz" ? (markers[choiceIndex] || formatDigits(choiceIndex + 1)) : formatDigits(choiceIndex + 1) }),
        el("span", { text: choice.text })
      ])
    )));
    const view = el("article", { className: "samai-decision-card" }, [
      step.opts.title && config.mode !== "quiz" ? el("span", { className: "samai-decision-tag", text: step.opts.title }) : null,
      step.opts.context ? el("p", { className: "samai-decision-context", text: step.opts.context }) : null,
      el("h3", { text: step.opts.prompt }),
      options,
      feedback,
      config.mode === "quiz" ? el("footer", { className: "samai-decision-actions" }, [previous, next]) : next
    ]);
    stage.hidden = false;
    complete.hidden = true;
    stage.replaceChildren(view);
    function revealAnswer(choiceIndex) {
      const choice = step.choices[choiceIndex];
      const correct = choice.correct === true;
      options.querySelectorAll("button").forEach((option, optionIndex) => {
        option.disabled = true;
        if (step.choices[optionIndex].correct) option.classList.add("is-correct");
      });
      const selected = options.querySelector(`[data-choice="${choiceIndex}"]`);
      selected?.classList.add(correct ? "is-selected-correct" : "is-selected-wrong");
      feedback.textContent = correct
        ? (step.opts.correctFeedback || choice.feedback || "إجابة صحيحة")
        : (choice.feedback || step.opts.correctFeedback || "راجع الخيار الصحيح");
      feedback.classList.add("is-visible", correct ? "is-correct" : "is-wrong");
      next.hidden = false;
    }
    options.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => {
        const choiceIndex = Number(button.dataset.choice);
        answers[index] = choiceIndex;
        revealAnswer(choiceIndex);
      }, { once: true });
    });
    if (answers[index] !== null) revealAnswer(answers[index]);
    previous?.addEventListener("click", () => {
      index = Math.max(0, index - 1);
      render(true);
    });
    next.addEventListener("click", () => {
      index += 1;
      render(true);
    });
    if (moveFocus) stage.focus();
  }

  listen(restart, "click", () => {
    index = 0;
    answers = Array(config.steps.length).fill(null);
    render(true);
  });
  render(false);
}

register("application", {
  render: renderApplication,
  init: { selector: ".samai-decision", setup: initializeDecision },
  meta: {
    doc: "Different decisions in sequence, each with feedback. Not scored.",
    interactive: true,
    opts: { instructions: "string?", countTemplate: "string?", restartLabel: "string?" },
    check(node, v) {
      const stepName = node.name === "quiz" ? "question" : "applicationStep";
      const steps = v.findChildren(node, stepName);
      if (!steps.length) v.fail(`${node.name} must have at least one ${stepName} child.`);
      steps.forEach((step, index) => {
        const choices = v.findChildren(step, "choice");
        if (choices.length < 2 || choices.filter((choice) => v.opts(choice).correct === true).length !== 1) {
          v.fail(`${stepName} ${index + 1} must have at least two choices and exactly one correct choice.`);
        }
      });
    }
  }
});

register("applicationStep", {
  meta: {
    doc: "One decision inside an application.",
    value: true,
    parents: ["application"],
    surface: "static",
    opts: { prompt: "string", title: "string?", context: "string?", correctFeedback: "string?" }
  }
});

register("completion", {
  meta: {
    doc: "Closing panel shown after the last application step.",
    value: true,
    parents: ["application"],
    opts: { title: "string?", text: "string?", icon: "icon?", restartLabel: "string?" }
  }
});

register("quiz", {
  render: renderQuiz,
  meta: {
    doc: "Scored end check. Shares the application engine and reports a score.",
    interactive: true,
    opts: { title: "string?", scoreTemplate: "string?", restartLabel: "string?" },
    check(node, v) {
      const stepName = node.name === "quiz" ? "question" : "applicationStep";
      const steps = v.findChildren(node, stepName);
      if (!steps.length) v.fail(`${node.name} must have at least one ${stepName} child.`);
      steps.forEach((step, index) => {
        const choices = v.findChildren(step, "choice");
        if (choices.length < 2 || choices.filter((choice) => v.opts(choice).correct === true).length !== 1) {
          v.fail(`${stepName} ${index + 1} must have at least two choices and exactly one correct choice.`);
        }
      });
    }
  }
});

register("question", {
  meta: {
    doc: "One quiz question.",
    value: true,
    parents: ["quiz"],
    surface: "static",
    opts: { prompt: "string", tag: "string?", context: "string?", feedback: "string?" }
  }
});

register("choice", {
  meta: {
    doc: "One answer option. Exactly one sibling must set correct: true.",
    value: true,
    parents: ["applicationStep", "question"],
    opts: { text: "string", correct: "boolean?", feedback: "string?" }
  }
});

    <script type="samai/module" data-id="core/assets.js">
// Lesson asset resolution.
//
// A lesson lives in content/moduleN/ but is rendered by content/index.html, so
// a relative path like "assets/diagram-01.svg" would otherwise resolve against
// the wrong directory. Lessons keep the short readable path and export
// `meta.base = import.meta.url`; this layer rewrites the rendered DOM.

const URL_ATTRIBUTES = [
  ["img", "src"],
  ["source", "src"],
  ["source", "srcset"],
  ["image", "href"],
  ["use", "href"],
  ["a", "href"]
];

const ABSOLUTE = /^(?:[a-z][a-z0-9+.-]*:|\/\/|\/|#)/i;

function resolveOne(element, attribute, base) {
  const value = element.getAttribute(attribute);
  if (!value || ABSOLUTE.test(value.trim())) return;
  try {
    element.setAttribute(attribute, new URL(value, base).href);
  } catch (error) {
    // Leave an unparseable value alone; the browser reports the broken asset.
  }
}

export function resolveAssets(scope, base) {
  if (!base || !scope) return;
  URL_ATTRIBUTES.forEach(([tag, attribute]) => {
    scope.querySelectorAll(`${tag}[${attribute}]`).forEach((element) => resolveOne(element, attribute, base));
  });
  if (scope instanceof Element) {
    URL_ATTRIBUTES.forEach(([tag, attribute]) => {
      if (scope.matches?.(`${tag}[${attribute}]`)) resolveOne(scope, attribute, base);
    });
  }
}

/** Keeps resolving assets in content that components add after mount. */
export function observeAssets(scope, base) {
  if (!base || typeof MutationObserver !== "function") return null;
  const observer = new MutationObserver((records) => {
    records.forEach((record) => {
      record.addedNodes.forEach((node) => {
        if (node.nodeType === Node.ELEMENT_NODE) resolveAssets(node, base);
      });
    });
  });
  observer.observe(scope, { childList: true, subtree: true });
  return observer;
}

    <script type="samai/module" data-id="core/validate.js">
// Lesson validation.
//
// Structural rules come from each component's registered `meta`, and opts rules
// come from its `meta.check`. Adding or changing a component therefore touches
// one component file — this module never names a component.

import { asArray, asText, findChildren, nest, opts } from "./dom.js";
import { componentMeta, componentNames, getComponent, hasCustomComponent, isCustomName } from "./render.js";

const NODE_KEYS = new Set(["name", "opts", "nest"]);

export function countComponents(nodes) {
  return asArray(nodes).reduce((total, node) => (
    total + (typeof node === "object" && node ? 1 + countComponents(nest(node)) : 0)
  ), 0);
}

/**
 * @param {{meta: object, content: Array}} lesson normalised lesson module
 * @returns {{valid: true, componentCount: number, customComponents: string[], warnings: string[]}}
 */
export function validateLesson(lesson) {
  if (!lesson || typeof lesson !== "object" || Array.isArray(lesson)) {
    throw new Error("A lesson module must export an object.");
  }
  if (!lesson.meta || typeof lesson.meta !== "object") throw new Error("meta is required.");
  if (lesson.meta.title !== undefined && (typeof lesson.meta.title !== "string" || !lesson.meta.title.trim())) {
    throw new Error("meta.title must be a non-empty string when provided.");
  }
  ["module", "lesson"].forEach((key) => {
    if (typeof lesson.meta[key] !== "string" || !lesson.meta[key].trim()) {
      throw new Error(`meta.${key} must be a non-empty string.`);
    }
  });
  if (!Array.isArray(lesson.content) || lesson.content.length === 0) {
    throw new Error("content must be a non-empty array.");
  }

  const ids = new Set();
  const navTargets = [];
  const warnings = [];
  const warn = (message) => {
    if (!warnings.includes(message)) warnings.push(message);
  };
  const fail = (message) => {
    throw new Error(message);
  };

  function visit(node, path, parentName) {
    if (typeof node === "string") return;
    if (!node || typeof node !== "object" || Array.isArray(node)) throw new Error(`Invalid node at ${path}.`);
    Object.keys(node).forEach((key) => {
      if (!NODE_KEYS.has(key)) throw new Error(`Unsupported node key "${key}" at ${path}.`);
    });

    const custom = isCustomName(node.name);
    if (!getComponent(node.name) && !custom) {
      throw new Error(`Unknown component "${node.name}" at ${path}.`);
    }
    if (custom && !hasCustomComponent(node.name)) {
      throw new Error(`Missing custom component definition for "${node.name}".`);
    }

    const p = opts(node);
    const children = nest(node);
    const meta = custom ? null : (componentMeta(node.name) || {});

    if (meta) {
      if (meta.parents && !meta.parents.includes(parentName)) {
        throw new Error(`${node.name} must be a direct child of ${meta.parents.join(" or ")}.`);
      }
      if (meta.topLevel === "only" && parentName) {
        throw new Error(`${node.name} must be a top-level component.`);
      }
      if (meta.leaf && children.length) {
        throw new Error(`${node.name} does not accept nested components.`);
      }
      if (!parentName && !meta.topLevel) {
        warn(`${path} (${node.name}) should be wrapped in a semantic section.`);
      }
      const parentMeta = parentName ? componentMeta(parentName) : null;
      if (parentMeta?.surface === "static" && meta.interactive) {
        warn(`${path} nests interactive ${node.name} inside ${parentName}; use a sibling section to avoid crowded controls.`);
      }
      if (typeof meta.check === "function") {
        meta.check(node, {
          p, path, parentName, children, fail, warn, navTargets,
          asArray, asText, opts, nest, findChildren
        });
      }
    }

    if (p.id) {
      if (ids.has(p.id)) throw new Error(`Duplicate component id "${p.id}".`);
      ids.add(p.id);
    }

    children.forEach((child, index) => visit(child, `${path}.nest[${index}]`, node.name));
  }

  lesson.content.forEach((node, index) => visit(node, `content[${index}]`, null));
  navTargets.forEach((target) => {
    if (!ids.has(target)) throw new Error(`lessonNav target "${target}" has no matching component id.`);
  });

  return Object.freeze({
    valid: true,
    componentCount: countComponents(lesson.content),
    components: Object.freeze(componentNames()),
    warnings: Object.freeze(warnings)
  });
}

    </script>
    <script type="samai/module" data-id="core/runtime.js">
// Render loop: takes a normalised lesson module, validates it, builds the page,
// and runs every registered initializer.

import { VIEWER_VERSION, DEFAULTS } from "./contract.js";
import { el, resetIds, validClassNames } from "./dom.js";
import { applyDigitDisplay, observeDigitDisplay, setDigitMode } from "./digits.js";
import { observeAssets, resolveAssets } from "./assets.js";
import { pushCleanup, runCleanups } from "./lifecycle.js";
import {
  configureCustomComponents, drainCustomMounts, customComponentNames,
  initializers, renderNode, resetCustomMounts, ui
} from "./render.js";
import { validateLesson } from "./validate.js";

let styleTag = null;

function applyMeta(meta) {
  document.documentElement.lang = meta.language || "ar";
  document.documentElement.dir = meta.direction || "rtl";
  document.title = meta.title || meta.lesson === "0" ? `سماي 2 - الوحدة ${meta.module}` : `سماي 2 - الوحدة ${meta.module} - الدرس ${meta.lesson}`;
  document.body.className = ["samai-viewer", validClassNames(meta.bodyClass)].filter(Boolean).join(" ");
  document.body.dataset.module = meta.module === undefined ? "" : meta.module;
  document.body.dataset.lesson = meta.lesson === undefined ? "" : meta.lesson;
}

function applyStyles(styles) {
  if (styleTag) {
    styleTag.remove();
    styleTag = null;
  }
  if (typeof styles !== "string" || !styles.trim()) return;
  styleTag = document.createElement("style");
  styleTag.dataset.samaiLessonStyles = "";
  styleTag.textContent = styles;
  document.head.append(styleTag);
}

function scrollToCurrentHash() {
  if (!window.location.hash) return;
  let id;
  try {
    id = decodeURIComponent(window.location.hash.slice(1));
  } catch (error) {
    id = window.location.hash.slice(1);
  }
  const target = id ? document.getElementById(id) : null;
  if (target) {
    target.classList.add("is-visible");
    const previous = document.documentElement.style.scrollBehavior;
    document.documentElement.style.scrollBehavior = "auto";
    target.scrollIntoView({ behavior: "auto", block: "start" });
    document.documentElement.style.scrollBehavior = previous;
  }
}

function initializeHashNavigation() {
  window.addEventListener("hashchange", scrollToCurrentHash);
  pushCleanup(() => window.removeEventListener("hashchange", scrollToCurrentHash));
  if (!window.location.hash) return;
  const frame = window.requestAnimationFrame(scrollToCurrentHash);
  pushCleanup(() => window.cancelAnimationFrame(frame));
}

function initializeReveal(scope) {
  const items = Array.from(scope.querySelectorAll("[data-reveal]"));
  if (!("IntersectionObserver" in window) || (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) {
    items.forEach((item) => item.classList.add("is-visible"));
    return;
  }
  items.forEach((item) => {
    const rect = item.getBoundingClientRect();
    if (rect.bottom > 0 && rect.top < window.innerHeight * 1.05) item.classList.add("is-visible");
  });
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add("is-visible");
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08 });
  items.filter((item) => !item.classList.contains("is-visible")).forEach((item) => observer.observe(item));
  pushCleanup(() => observer.disconnect());
}

function initializeCustomComponents() {
  drainCustomMounts().forEach((item) => {
    const cleanupFn = item.definition.mount({
      element: item.host,
      opts: item.node.opts || {},
      nest: item.node.nest || [],
      context: item.context,
      ui
    });
    if (typeof cleanupFn === "function") pushCleanup(cleanupFn);
  });
}

function initialize(scope) {
  initializers().forEach(({ selector, setup }) => {
    if (typeof setup === "function") scope.querySelectorAll(selector).forEach(setup);
  });
  initializeReveal(scope);
  initializeHashNavigation();
  initializeCustomComponents();
}

/**
 * @param {{meta: object, content: Array, components?: object, styles?: string}} lesson
 */
export function renderLesson(lesson) {
  const root = document.getElementById("lesson-root");
  if (!root) throw new Error("#lesson-root was not found.");
  runCleanups();
  resetCustomMounts();
  resetIds();
  configureCustomComponents(lesson.components);
  const report = validateLesson(lesson);
  setDigitMode(lesson.meta.useArabicIndicDigits === true);
  applyMeta(lesson.meta);
  applyStyles(lesson.styles);

  const chrome = [];
  const content = [];
  lesson.content.forEach((node, index) => {
    const rendered = renderNode(node, { lesson, index });
    if (node.name === "brandBar" || node.name === "lessonNav") chrome.push(rendered);
    else content.push(rendered);
  });
  root.replaceChildren(
    el("a", { className: "samai-skip-link", text: DEFAULTS.skip, attrs: { href: "#lesson-content" } }),
    ...chrome,
    el("main", { id: "lesson-content" }, content)
  );
  resolveAssets(root, lesson.meta.base);
  const assetObserver = observeAssets(root, lesson.meta.base);
  if (assetObserver) pushCleanup(() => assetObserver.disconnect());
  applyDigitDisplay(root);
  observeDigitDisplay(root);
  root.removeAttribute("aria-live");
  initialize(root);
  document.dispatchEvent(new CustomEvent("samai2:ready", { detail: { lesson, report } }));
  return report;
}

export function showError(error) {
  const root = document.getElementById("lesson-root");
  if (!root) return;
  root.replaceChildren(el("main", { className: "samai-load-error", attrs: { role: "alert" } }, [
    el("h1", { text: "تعذر تحميل الدرس" }),
    el("p", { text: "تعذر قراءة تعريف الدرس أو التحقق منه" }),
    el("code", { text: error && error.message ? error.message : String(error) })
  ]));
}

    <script type="module">
const SPECIFIER = /(from|import)(\s*\(?\s*)(["'])(\.{1,2}\/[^"'\n]+)\3/g;
const built = new Map();

function resolveId(fromId, specifier) {
  const parts = fromId.split("/").slice(0, -1).concat(specifier.split("/"));
  const out = [];
  for (const part of parts) {
    if (!part || part === ".") continue;
    if (part === "..") out.pop();
    else out.push(part);
  }
  return out.join("/");
}

let viewer = null;
try {
  document.querySelectorAll("script[type='samai/module']").forEach((node) => {
    const id = node.dataset.id;
    const source = node.textContent.replace(SPECIFIER, (match, keyword, gap, quote, specifier) => {
      const url = built.get(resolveId(id, specifier));
      return url ? keyword + gap + quote + url + quote : match;
    });
    built.set(id, URL.createObjectURL(new Blob([source], { type: "text/javascript" })));
  });
  viewer = await import(built.get("viewer.js"));
  const lesson = await import(built.get("lesson.js"));
  viewer.renderLesson(viewer.toLesson(lesson));
} catch (error) {
  console.error(error);
  if (viewer) viewer.showError(error);
  else {
    const root = document.getElementById("lesson-root");
    if (root) root.textContent = "تعذر تحميل الدرس: " + error.message;
  }
}
</script>
